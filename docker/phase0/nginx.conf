events {}
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8443 ssl;
        server_name phase0-jwks;
        ssl_certificate /run/phase0/proxy.crt;
        ssl_certificate_key /run/phase0/proxy.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        location = /space/jwks.json {
            if ($request_method != GET) { return 405; }
            set $space_issuer space:8443;
            proxy_ssl_server_name on;
            proxy_ssl_name space;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/phase0/ca.crt;
            proxy_pass https://$space_issuer/.well-known/jwks.json;
        }
        location = /gateway/jwks.json {
            if ($request_method != GET) { return 405; }
            set $gateway_issuer gateway:8080;
            proxy_pass http://$gateway_issuer/.well-known/voice-principal-jwks.json;
        }
        location / { return 404; }
    }
}
