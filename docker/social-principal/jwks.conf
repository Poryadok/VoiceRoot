# Public keys only. No private key volume is mounted by this service.
server {
  listen 8443 ssl;
  ssl_certificate /etc/voice/tls/tls.crt;
  ssl_certificate_key /etc/voice/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  root /srv/jwks;
  location = /space.json { limit_except GET { deny all; } try_files $uri =404; }
  location = /realtime.json { limit_except GET { deny all; } try_files $uri =404; }
  location / { return 404; }
}
