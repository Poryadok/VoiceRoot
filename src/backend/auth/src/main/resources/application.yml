spring:
  datasource:
    # Tests may override the Auth-owned database without changing deployment env.
    url: "${voice.auth.jdbc.url:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}}"
    username: ${SPRING_DATASOURCE_USERNAME:voice}
    password: ${SPRING_DATASOURCE_PASSWORD:voice}
  flyway:
    enabled: ${AUTH_FLYWAY_ENABLED:true}
    # Same JDBC URL as spring.datasource (explicit so Flyway never follows a secondary DataSource bean).
    url: "${voice.auth.jdbc.url:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}}"
    user: "${SPRING_DATASOURCE_USERNAME:voice}"
    password: "${SPRING_DATASOURCE_PASSWORD:voice}"
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

auth:
  persistence: jdbc
  jwt:
    issuer: voice-auth
    audience: voice-client
    key-id: local-key
    access-ttl: PT15M
    private-key-pem: "${AUTH_JWT_PRIVATE_KEY_PEM:}"
    private-key-location: "${AUTH_JWT_PRIVATE_KEY_LOCATION:}"
  refresh:
    ttl: P30D
  account-deletion:
    token-secret: "${ACCOUNT_DELETE_TOKEN_SECRET:}"
  redis:
    blacklist-prefix: "jwt:blacklist:"
  grpc:
    port: 9090
  user-grpc:
    addr: "${USER_GRPC_ADDR:}"
    deadline: "${AUTH_USER_GRPC_DEADLINE:PT15S}"
  oauth:
    public-api-base-url: "${AUTH_OAUTH_PUBLIC_API_BASE_URL:http://127.0.0.1:18080}"
    twitch:
      client-id: "${AUTH_OAUTH_TWITCH_CLIENT_ID:}"
      client-secret: "${AUTH_OAUTH_TWITCH_CLIENT_SECRET:}"
      api-base-url: "${AUTH_OAUTH_TWITCH_API_BASE_URL:https://api.twitch.tv}"
      token-url: "${AUTH_OAUTH_TWITCH_TOKEN_URL:https://id.twitch.tv/oauth2/token}"
      authorize-url: "${AUTH_OAUTH_TWITCH_AUTHORIZE_URL:https://id.twitch.tv/oauth2/authorize}"
    youtube:
      client-id: "${AUTH_OAUTH_YOUTUBE_CLIENT_ID:}"
      client-secret: "${AUTH_OAUTH_YOUTUBE_CLIENT_SECRET:}"
      api-base-url: "${AUTH_OAUTH_YOUTUBE_API_BASE_URL:https://www.googleapis.com}"
      token-url: "${AUTH_OAUTH_YOUTUBE_TOKEN_URL:https://oauth2.googleapis.com/token}"
      authorize-url: "${AUTH_OAUTH_YOUTUBE_AUTHORIZE_URL:https://accounts.google.com/o/oauth2/v2/auth}"
    developer-portal:
      enabled: ${AUTH_OAUTH_DEVELOPER_PORTAL_ENABLED:true}
      client-id: "${AUTH_OAUTH_DEVELOPER_PORTAL_CLIENT_ID:}"
      client-secret: "${AUTH_OAUTH_DEVELOPER_PORTAL_CLIENT_SECRET:}"
      redirect-uris: "${AUTH_OAUTH_DEVELOPER_PORTAL_REDIRECT_URIS:}"
      authorization-code-ttl: ${AUTH_OAUTH_AUTHORIZATION_CODE_TTL:PT60S}
    admin:
      enabled: ${AUTH_OAUTH_ADMIN_ENABLED:false}
      client-id: "${AUTH_OAUTH_ADMIN_CLIENT_ID:}"
      client-secret: "${AUTH_OAUTH_ADMIN_CLIENT_SECRET:}"
      redirect-uris: "${AUTH_OAUTH_ADMIN_REDIRECT_URIS:}"
      authorization-code-ttl: ${AUTH_OAUTH_AUTHORIZATION_CODE_TTL:PT60S}
  totp:
    test-bypass: ${AUTH_TOTP_TEST_BYPASS:false}
    encryption-key: "${AUTH_TOTP_ENCRYPTION_KEY:}"
  nats:
    url: "${AUTH_NATS_URL:}"
  resend:
    api-key: "${AUTH_RESEND_API_KEY:}"
    from: "${AUTH_RESEND_FROM:Voice <onboarding@resend.dev>}"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
