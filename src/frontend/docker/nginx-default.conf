server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mutable entry points and manifests must not outlive their deployment.
    add_header Cache-Control "no-store" always;

    # Environment-owned mount; never return SPA HTML for missing configuration.
    location = /voice-runtime-config.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Only content-addressed build outputs may be cached indefinitely.
    location ~ "^/(main\.[0-9a-f]{64}\.dart\.js|flutter_bootstrap\.[0-9a-f]{64}\.js)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
