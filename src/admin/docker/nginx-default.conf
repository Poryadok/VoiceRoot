server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /voice-runtime-config.json {
        add_header Cache-Control "no-store" always;
        try_files /voice-runtime-config.json =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
