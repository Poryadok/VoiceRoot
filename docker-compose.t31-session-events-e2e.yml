# Local acceptance-only ingress, receiver database, and test runner.
# This overlays the normal Phase0 app stack and adds no deployable service.
services:
  gameintegration:
    environment:
      GAME_INTEGRATION_OPERATOR_ACCOUNT_IDS: ${T31_E2E_OPERATOR_ACCOUNT_ID:-00000000-0000-4000-8000-000000000000}
      GAME_INTEGRATION_SPACE_TEMPLATE_IDS: guild-default
      GAME_INTEGRATION_SPACE_GRPC_ADDR: space:9090
      GAME_INTEGRATION_SPACE_S2S_TOKEN: voice-compose-space-gameintegration

  space:
    environment:
      SPACE_GAME_INTEGRATION_S2S_TOKEN: voice-compose-space-gameintegration

  t31-session-event-gateway-tls:
    image: nginx:1.28-alpine
    expose: ["8443"]
    volumes:
      - ${T31_E2E_TLS_DIR:?generate the disposable T31 gateway certificate first}/gateway.crt:/run/t31/gateway.crt:ro
      - ${T31_E2E_TLS_DIR:?generate the disposable T31 gateway certificate first}/gateway.key:/run/t31/gateway.key:ro
      - ./scripts/dev/t31-session-event-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null --header='Host: t31-gateway.test' https://127.0.0.1:8443/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks:
      default:
        aliases:
          - t31-gateway.test

  t31-session-event-receiver-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controlledgame_t31_e2e
      POSTGRES_USER: controlledgame
      POSTGRES_PASSWORD: t31-receiver-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlledgame -d controlledgame_t31_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30

  t31-session-event-runner:
    build:
      context: ./src/backend
      dockerfile: controlledgame/Dockerfile
    command:
      - go
      - test
      - -v
      - -count=1
      - -run
      - ^TestT31ComposeHTTPSClaimInboxEffectAckReclaim$$
      - .
    environment:
      VOICE_T31_COMPOSE_SESSION_EVENTS: "1"
      CONTROLLEDGAME_DATABASE_URL: postgres://controlledgame:t31-receiver-local-only@t31-session-event-receiver-db:5432/controlledgame_t31_e2e?sslmode=disable
      T31_GIS_HTTPS_BASE_URL: https://t31-gateway.test:8443
      T31_GATEWAY_CA_FILE: /run/t31/ca.crt
      T31_APPLICATION_ID: ${T31_APPLICATION_ID:?bootstrap a sandbox app and credential first}
      T31_ENVIRONMENT_ID: ${T31_ENVIRONMENT_ID:?bootstrap a sandbox environment and credential first}
      T31_GAME_SERVER_CREDENTIAL: ${T31_GAME_SERVER_CREDENTIAL:?issue game.sessions.manage for the target env}
      T31_OTHER_APPLICATION_ID: ${T31_OTHER_APPLICATION_ID:?bootstrap a second app/env credential}
      T31_OTHER_ENVIRONMENT_ID: ${T31_OTHER_ENVIRONMENT_ID:?bootstrap a second app/env credential}
      T31_OTHER_GAME_SERVER_CREDENTIAL: ${T31_OTHER_GAME_SERVER_CREDENTIAL:?issue credential for the other app/env}
      T31_EXPECTED_EVENT_ID: ${T31_EXPECTED_EVENT_ID:?create an active GIS session first}
      T31_ACCEPTANCE_PHASE: ${T31_ACCEPTANCE_PHASE:?select a hosted acceptance phase}
      T31_ACCEPTANCE_STATE_FILE: /run/t31-state/claim.json
      T40_PUBLIC_GATEWAY_BASE_URL: ${T40_PUBLIC_GATEWAY_BASE_URL:-http://gateway:8080}
      T40_GAME_SERVER_CREDENTIAL: ${T40_GAME_SERVER_CREDENTIAL:-}
      T40_GAME_ROSTER_CREDENTIAL: ${T40_GAME_ROSTER_CREDENTIAL:-}
      T40_APPLICATION_ID: ${T40_APPLICATION_ID:-}
      T40_ENVIRONMENT_ID: ${T40_ENVIRONMENT_ID:-}
      T40_PLAYER_ONE_TOKEN: ${T40_PLAYER_ONE_TOKEN:-}
      T40_PLAYER_TWO_TOKEN: ${T40_PLAYER_TWO_TOKEN:-}
      T40_PLAYER_ONE_PROFILE_ID: ${T40_PLAYER_ONE_PROFILE_ID:-}
      T40_PLAYER_TWO_PROFILE_ID: ${T40_PLAYER_TWO_PROFILE_ID:-}
      T40_CHAT_DATABASE_URL: ${T40_CHAT_DATABASE_URL:-postgres://voice:voice@postgres:5432/chat_db?sslmode=disable}
      T40_GAME_INTEGRATION_DATABASE_URL: ${T40_GAME_INTEGRATION_DATABASE_URL:-postgres://voice:voice@postgres:5432/game_integration_db?sslmode=disable}
      T40_SPACE_DATABASE_URL: ${T40_SPACE_DATABASE_URL:-postgres://voice:voice@postgres:5432/space_db?sslmode=disable}
    volumes:
      - ${T31_E2E_TLS_DIR:?generate the disposable T31 gateway certificate first}:/run/t31:ro
      - ${T31_E2E_STATE_DIR:?create the T31 acceptance state directory first}:/run/t31-state:rw
    depends_on:
      t31-session-event-gateway-tls:
        condition: service_healthy
      t31-session-event-receiver-db:
        condition: service_healthy

  t30-chat-retry-runner:
    build:
      context: ./src/backend
      dockerfile: gameintegration/Dockerfile.acceptance
    command:
      - go
      - test
      - -count=1
      - -run
      - ^TestT30ComposeChatProvisionLostResponseRetriesRealReceipt$$
      - ./internal/sessionowners
    environment:
      VOICE_T30_COMPOSE_CHAT_RETRY: "1"
      DATABASE_URL: postgres://gameintegration_runtime:${GAME_INTEGRATION_DB_PASSWORD:-voice-compose-gameintegration-runtime}@postgres:5432/game_integration_db?sslmode=disable
      CHAT_DATABASE_URL: postgres://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD:-voice}@postgres:5432/chat_db?sslmode=disable
      GAME_INTEGRATION_PRINCIPAL_PRIVATE_KEY_FILE: /run/phase0/gameintegration/current.pem
      GAME_INTEGRATION_PRINCIPAL_KID: current
      GIS_CHAT_GRPC_ADDR: chat:9091
      GIS_CHAT_TLS_CA_FILE: /run/phase0/ca.crt
      GIS_CHAT_CLIENT_CERT_FILE: /run/phase0/gameintegration-chat-client.crt
      GIS_CHAT_CLIENT_KEY_FILE: /run/phase0/gameintegration-chat-client.key
      T31_APPLICATION_ID: ${T31_APPLICATION_ID:?bootstrap an app/environment before running T30 receipt acceptance}
      T31_ENVIRONMENT_ID: ${T31_ENVIRONMENT_ID:?bootstrap an app/environment before running T30 receipt acceptance}
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/gameintegration/current.pem:/run/phase0/gameintegration/current.pem:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-chat-client.crt:/run/phase0/gameintegration-chat-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-chat-client.key:/run/phase0/gameintegration-chat-client.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
    depends_on:
      gameintegration:
        condition: service_healthy
      chat:
        condition: service_healthy
