apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-gateway
  namespace: voice-dev
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: GATEWAY_MATCH_SQUAD_MEMBER_TLS_CA_FILE
              value: /etc/voice/match-squad/ca/ca.crt
          volumeMounts:
            - name: match-squad-ca
              mountPath: /etc/voice/match-squad/ca
              readOnly: true
      volumes:
        - name: match-squad-ca
          configMap:
            name: voice-match-squad-ca
            items:
              - key: ca.crt
                path: ca.crt
