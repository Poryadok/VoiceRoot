# Flutter web SPA client: runtime-required release with environment-owned config.
# Substitute __IMAGE_REGISTRY__ / __IMAGE_TAG__ / __WEB_INGRESS_HOST__ before apply.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-web-runtime-config
  namespace: voice-prod
data:
  voice-runtime-config.json: |
    {"version":1,"app_origin":"https://__WEB_INGRESS_HOST__","api_base_url":"https://__GATEWAY_INGRESS_HOST__","livekit_url":"wss://__LIVEKIT_INGRESS_HOST__"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-web
  namespace: voice-prod
  labels: {app: voice-web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: voice-web}
  template:
    metadata:
      labels: {app: voice-web}
    spec:
      containers:
        - name: web
          image: __IMAGE_REGISTRY__/web:__IMAGE_TAG__
          ports: [{containerPort: 80, name: http}]
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/voice-runtime-config.json
              subPath: voice-runtime-config.json
              readOnly: true
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15}
      volumes:
        - name: runtime-config
          configMap:
            name: voice-web-runtime-config
---
apiVersion: v1
kind: Service
metadata:
  name: voice-web
  namespace: voice-prod
spec:
  selector: {app: voice-web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-web-https
  namespace: voice-prod
  labels:
    app.kubernetes.io/name: voice-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [__WEB_INGRESS_HOST__]
      secretName: voice-origin-tls
  rules:
    - host: __WEB_INGRESS_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voice-web
                port:
                  number: 80
