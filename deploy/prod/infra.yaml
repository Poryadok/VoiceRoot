# Production infrastructure: Postgres, Redis, NATS JetStream, LiveKit, ClamAV, ClickHouse.
# DB schemas: run migrations via compose on first boot or external managed Postgres.
apiVersion: v1
kind: Service
metadata:
  name: voice-postgres
  namespace: voice-prod
spec:
  selector:
    app: voice-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voice-postgres
  namespace: voice-prod
spec:
  serviceName: voice-postgres
  replicas: 1
  selector:
    matchLabels:
      app: voice-postgres
  template:
    metadata:
      labels:
        app: voice-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: voice-app-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voice-app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: voice
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "voice", "-d", "voice"]
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  # Init scripts ConfigMap must be created separately (see deploy/prod/README.md).
---
apiVersion: v1
kind: Service
metadata:
  name: voice-redis
  namespace: voice-prod
spec:
  selector:
    app: voice-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voice-redis
  namespace: voice-prod
spec:
  serviceName: voice-redis
  replicas: 1
  selector:
    matchLabels:
      app: voice-redis
  template:
    metadata:
      labels:
        app: voice-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redisdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redisdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: voice-nats
  namespace: voice-prod
spec:
  type: ClusterIP
  selector:
    app: voice-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: leaf-tls
      port: 7422
      targetPort: 7422
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voice-nats
  namespace: voice-prod
spec:
  serviceName: voice-nats
  replicas: 1
  selector:
    matchLabels:
      app: voice-nats
  template:
    metadata:
      labels:
        app: voice-nats
    spec:
      containers:
        - name: nats
          image: nats:2.12-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - {name: APP_ACCOUNT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: voice-nats-operator, key: account.public}}}
            - {name: SYSTEM_ACCOUNT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: voice-nats-operator, key: system-account.public}}}
          ports:
            - containerPort: 4222
            - name: leaf-tls
              containerPort: 7422
            - containerPort: 8222
          volumeMounts:
            - name: jsdata
              mountPath: /data
            - name: nats-config
              mountPath: /etc/nats/nats.conf
              subPath: nats.conf
              readOnly: true
            - name: nats-operator-jwt
              mountPath: /etc/nats/jwt
              readOnly: true
            - name: nats-hub-tls
              mountPath: /etc/nats/tls
              readOnly: true
      volumes:
        - name: nats-config
          configMap:
            name: voice-nats-hub-config
        - name: nats-operator-jwt
          secret:
            secretName: voice-nats-operator
            defaultMode: 0400
            items:
              - {key: operator.jwt, path: operator.jwt}
              - {key: account.jwt, path: account.jwt}
              - {key: system-account.jwt, path: system-account.jwt}
        - name: nats-hub-tls
          secret:
            secretName: voice-nats-hub-tls
            defaultMode: 0400
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
  volumeClaimTemplates:
    - metadata:
        name: jsdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-nats-leaf-config
  namespace: voice-prod
data:
  leaf.conf: |
    listen: 127.0.0.1:4222
    leafnodes {
      remotes = [{
        urls: ["nats-leaf://voice-nats:7422"]
        account: "$G"
        credentials: $NATS_CREDS
        tls { ca_file: /etc/nats/tls/ca.crt; handshake_first: true }
      }]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-nats-hub-config
  namespace: voice-prod
data:
  nats.conf: |
    server_name: voice-nats-hub
    jetstream { store_dir: /data }
    http: 8222
    operator: /etc/nats/jwt/operator.jwt
    resolver: MEMORY
    resolver_preload: {
      $APP_ACCOUNT_PUBLIC_KEY: /etc/nats/jwt/account.jwt
      $SYSTEM_ACCOUNT_PUBLIC_KEY: /etc/nats/jwt/system-account.jwt
    }
    system_account: $SYSTEM_ACCOUNT_PUBLIC_KEY
    leafnodes {
      listen: 0.0.0.0:7422
      tls {
        cert_file: /etc/nats/tls/tls.crt
        key_file: /etc/nats/tls/tls.key
        ca_file: /etc/nats/tls/ca.crt
        handshake_first: true
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: voice-livekit
  namespace: voice-prod
spec:
  type: NodePort
  selector:
    app: voice-livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
      nodePort: 30981
    - name: rtc-udp
      port: 7882
      targetPort: 7882
      protocol: UDP
      nodePort: 30982
    - name: metrics
      port: 6789
      targetPort: 6789
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-livekit
  namespace: voice-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-livekit
  template:
    metadata:
      labels:
        app: voice-livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.8.4
          args: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
          ports:
            - containerPort: 7880
            - containerPort: 7881
            - containerPort: 7882
              protocol: UDP
            - containerPort: 6789
              name: metrics
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
              readOnly: true
      volumes:
        - name: livekit-config
          secret:
            secretName: voice-livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: voice-clamav
  namespace: voice-prod
spec:
  selector:
    app: voice-clamav
  ports:
    - port: 3310
      targetPort: 3310
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-clamav
  namespace: voice-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-clamav
  template:
    metadata:
      labels:
        app: voice-clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:stable
          ports:
            - containerPort: 3310
---
apiVersion: v1
kind: Service
metadata:
  name: voice-clickhouse
  namespace: voice-prod
spec:
  selector:
    app: voice-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voice-clickhouse
  namespace: voice-prod
spec:
  serviceName: voice-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: voice-clickhouse
  template:
    metadata:
      labels:
        app: voice-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          env:
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voice-app-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              value: voice
          ports:
            - containerPort: 8123
            - containerPort: 9000
          volumeMounts:
            - name: chdata
              mountPath: /var/lib/clickhouse
          startupProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: chdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  # Apply DDL: scripts/prod/apply-clickhouse-init.sh (wraps scripts/staging/apply-clickhouse-init.sh)
