apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-user-report-threshold-jwks
  namespace: __K_NAMESPACE__
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: __INGRESS_CLASS__
  tls:
    - hosts: [__USER_REPORT_JWKS_HOST__]
      secretName: voice-user-report-threshold-jwks-tls
  rules:
    - host: __USER_REPORT_JWKS_HOST__
      http:
        paths:
          - path: /.well-known/principal-jwks.json
            pathType: Exact
            backend:
              service:
                name: voice-user
                port: {number: 8080}
