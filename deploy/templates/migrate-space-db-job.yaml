# Source-bound Space fresh installer or live verifier of retained Job evidence.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: voice-migrate-space-db
  namespace: __K_NAMESPACE__
  annotations:
    voice.io/native-input-hash: __SPACE_NATIVE_INPUT_HASH__
  labels:
    app.kubernetes.io/name: voice-migrate-space-db
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voice-migrate-space-db
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: __SPACE_NATIVE_INSTALLER_IMAGE__
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "$SPACE_NATIVE_INSTALLER_MODE" = verify ]; then
                exec native-migrate --mode=verify --prior-evidence=/evidence/prior.jsonl
              fi
              exec native-migrate --mode=provision
          env:
            - {name: PGHOST, value: voice-postgres}
            - {name: PGSSLMODE, value: disable}
            - name: PGUSER
              valueFrom:
                configMapKeyRef: {name: voice-app-config, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: voice-app-secrets, key: POSTGRES_PASSWORD}
            - {name: SPACE_NATIVE_INSTALLER_MODE, value: __SPACE_NATIVE_INSTALLER_MODE__}
            - {name: SPACE_NATIVE_REQUIRED_SOURCE_SHA256, value: __SPACE_NATIVE_SOURCE_SHA256__}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: migrations, mountPath: /migrations, readOnly: true}
            - {name: evidence, mountPath: /evidence, readOnly: true}
      volumes:
        - name: migrations
          configMap: {name: voice-space-db-migrations, optional: false}
        - name: evidence
          configMap: {name: voice-space-native-installer-evidence, optional: true}
