apiVersion: v1
kind: Service
metadata:
  name: voice-file-principal
  namespace: __K_NAMESPACE__
spec:
  selector: {app: voice-file}
  ports: [{name: principal, port: 9091, targetPort: 9091}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-file-story-principal
  namespace: __K_NAMESPACE__
spec:
  podSelector: {matchLabels: {app: voice-file}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: voice-story}}}]
      ports: [{protocol: TCP, port: 9091}]
    # Preserve existing ordinary service ingress during the separate edge migration.
    - ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-story-principal-jwks
  namespace: __K_NAMESPACE__
spec:
  ingressClassName: __INGRESS_CLASS__
  tls:
    - hosts: [__STORY_JWKS_HOST__]
      secretName: voice-story-jwks-tls
  rules:
    - host: __STORY_JWKS_HOST__
      http:
        paths:
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service: {name: voice-story, port: {number: 8080}}
