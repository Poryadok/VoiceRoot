apiVersion: v1
kind: Service
metadata:
  name: voice-auth-authority
  namespace: __K_NAMESPACE__
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector: {app: voice-auth}
  ports:
    - {name: authority-grpc, port: 9093, targetPort: 9093, protocol: TCP}
    - {name: principal-jwks, port: 8443, targetPort: 8443, protocol: TCP}
