apiVersion: v1
kind: Service
metadata:
  name: voice-moderation-authority
  namespace: __K_NAMESPACE__
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector: {app: voice-moderation}
  ports:
    - {name: evidence-grpc, port: 9467, targetPort: 9467, protocol: TCP}
    - {name: principal-jwks, port: 8443, targetPort: 8443, protocol: TCP}
