# Protected privacy listeners accept network traffic only from Social.
# Ordinary User 9090 remains available for GetProfile/ListAccountProfiles until
# those independent callers migrate. Application-level privacy denial is required.
# Policies are additive: remove any broader 9091 ingress grants before cutover.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-social-privacy-consumers
  namespace: __K_NAMESPACE__
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [voice-user, voice-space]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: voice-social}
      ports:
        - {protocol: TCP, port: 9091}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 9090}
    - ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-social-principal-jwks
  namespace: __K_NAMESPACE__
spec:
  podSelector:
    matchLabels: {app: voice-social}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [voice-user, voice-space]}
      ports:
        - {protocol: TCP, port: 8443}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 9090}
    - ports:
        - {protocol: TCP, port: 8080}
