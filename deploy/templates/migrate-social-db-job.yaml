# One-shot golang-migrate Job for social_db; credentials stay in voice-app-secrets.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: voice-migrate-social-db
  namespace: __K_NAMESPACE__
  labels:
    app.kubernetes.io/name: voice-migrate-social-db
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voice-migrate-social-db
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: migrate/migrate:__MIGRATE_IMAGE_TAG__
          args: ["-path=/migrations", "-database=$(DATABASE_URL)", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: voice-app-secrets, key: SOCIAL_DATABASE_URL}
          volumeMounts:
            - {name: migrations, mountPath: /migrations, readOnly: true}
      volumes:
        - name: migrations
          configMap: {name: voice-social-db-migrations, optional: false}
