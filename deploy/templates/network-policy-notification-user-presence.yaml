# Additive to the existing User capability policies. Only Notification may use
# User routing presence; only User may fetch Notification's signing public keys.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-notification-user-presence
  namespace: __K_NAMESPACE__
spec:
  podSelector: {matchLabels: {app: voice-user}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: voice-notification}}}]
      ports: [{protocol: TCP, port: 9095}]
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 9090}]
    - ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-notification-principal-jwks
  namespace: __K_NAMESPACE__
spec:
  podSelector: {matchLabels: {app: voice-notification}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: voice-user}}}]
      ports: [{protocol: TCP, port: 8443}]
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 9090}]
    - ports: [{protocol: TCP, port: 8080}]
