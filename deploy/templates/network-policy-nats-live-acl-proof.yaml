# Staging-only, per-run additive ingress for the temporary proof Job's TLS
# leaves and direct authenticated hub client. The shared policy is unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: __PROOF_NAME__
  namespace: voice-staging
  annotations:
    voice.io/nats-generation: __GENERATION__
spec:
  podSelector:
    matchLabels: {app: voice-nats-pvc-candidate}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {voice.io/nats-proof-run: __PROOF_NAME__}
      ports:
        - {protocol: TCP, port: 4222}
        - {protocol: TCP, port: 7422}
