# File's retention-owner principal has an intentionally narrow two-way trust
# topology: File fetches no User data except the protected resolver, and User
# fetches only File's public JWKS. Existing Social privacy routes remain in the
# separate Social policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-file-user-principal-listener
  namespace: __K_NAMESPACE__
spec:
  podSelector:
    matchLabels: {app: voice-user}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: voice-file}
      ports:
        - {protocol: TCP, port: 9092}
    - from:
        - podSelector:
            matchLabels: {app: voice-social}
      ports:
        - {protocol: TCP, port: 9091}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 9090}
    - ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-file-principal-jwks
  namespace: __K_NAMESPACE__
spec:
  podSelector:
    matchLabels: {app: voice-file}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: voice-user}
      ports:
        - {protocol: TCP, port: 8443}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 9090}
    - ports:
        - {protocol: TCP, port: 8080}
