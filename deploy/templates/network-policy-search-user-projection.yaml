apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-search-user-projection
  namespace: __K_NAMESPACE__
spec:
  podSelector: {matchLabels: {app: voice-user}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: voice-search}}}]
      ports: [{protocol: TCP, port: 9093}]
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 9090}]
    - ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-search-projection-jwks
  namespace: __K_NAMESPACE__
spec:
  podSelector: {matchLabels: {app: voice-search}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: voice-user}}}]
      ports: [{protocol: TCP, port: 8443}]
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 9090}]
    - ports: [{protocol: TCP, port: 8080}]
