# Strategic merge patch for deployment/voice-file; see Story media admission runbook.
spec:
  template:
    spec:
      containers:
        - name: file
          ports:
            - {name: principal, containerPort: 9091}
          env:
            - {name: FILE_PRINCIPAL_GRPC_LISTEN, value: ":9091"}
            - {name: FILE_PRINCIPAL_TLS_CERT_FILE, value: /run/file-principal-grpc/tls.crt}
            - {name: FILE_PRINCIPAL_TLS_KEY_FILE, value: /run/file-principal-grpc/tls.key}
            - {name: FILE_PRINCIPAL_CLIENT_CA_FILE, value: /run/file-principal-client-ca/ca.crt}
            - {name: S2S_JWKS_CA_FILE, value: /run/principal-trust/ca.crt}
            - {name: S2S_JWKS_URLS_JSON, value: '{"story":"https://__STORY_JWKS_HOST__/.well-known/jwks.json","messaging":"__MESSAGING_JWKS_URL__"}'}
            - {name: S2S_JWKS_CLIENT_CERT_FILE, value: /run/file-jwks-client/tls.crt}
            - {name: S2S_JWKS_CLIENT_KEY_FILE, value: /run/file-jwks-client/tls.key}
            - {name: FILE_PRINCIPAL_REPLAY_REDIS_ADDR, value: "__FILE_REPLAY_REDIS_ADDR__"}
            - name: FILE_PRINCIPAL_REPLAY_REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: voice-file-replay, key: password}}
          volumeMounts:
            - {name: file-principal-grpc-tls, mountPath: /run/file-principal-grpc, readOnly: true}
            - {name: file-principal-client-ca, mountPath: /run/file-principal-client-ca, readOnly: true}
            - {name: file-jwks-client-tls, mountPath: /run/file-jwks-client, readOnly: true}
            - {name: principal-trust, mountPath: /run/principal-trust, readOnly: true}
      volumes:
        - {name: file-principal-grpc-tls, secret: {secretName: voice-file-principal-grpc-tls}}
        - {name: file-principal-client-ca, secret: {secretName: voice-file-principal-client-ca}}
        - {name: file-jwks-client-tls, secret: {secretName: voice-file-jwks-client-tls}}
        - {name: principal-trust, secret: {secretName: voice-principal-trust}}
