apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-nats-analytics-chat-bootstrap
  namespace: __NAMESPACE__
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    nats_url="${NATS_URL:?NATS_URL is required}"

    nats() {
      if [ -n "${NATS_CREDS:-}" ]; then command nats --creds "$NATS_CREDS" --inbox-prefix _INBOX.voice.bootstrap.reply "$@"; else command nats "$@"; fi
    }

    stream() {
      name="$1"; shift
      stream_with_max_age "$name" 604800000000000 "$@"
    }

    stream_with_max_age() {
      name="$1"; max_age="$2"; shift 2
      expected="$(printf '%s\n' "$@" | jq -R . | jq -sc 'sort')"
      info="$(nats --server "$nats_url" req --raw "\$JS.API.STREAM.INFO.$name" "")"
      if printf '%s' "$info" | jq -e '.error' >/dev/null; then
        printf '%s' "$info" | jq -r '.error.description' | grep -qi 'stream not found' && { echo "required central stream not found: $name" >&2; exit 1; }
        echo "$info" >&2; exit 1
      fi
      actual="$(printf '%s' "$info" | jq -c '[(.config.subjects | sort), .config.storage, .config.retention, .config.max_age]')"
      expected_config="$(jq -cn --argjson subjects "$expected" --argjson max_age "$max_age" '[ $subjects, "file", "limits", $max_age ]')"
      if [ "$actual" != "$expected_config" ]; then
        # Subjects are public topology, not credential material. Keep the
        # fail-closed check diagnosable when an independently bootstrapped
        # central stream drifts from this exact contract.
        printf 'incompatible configuration for stream %s: expected=%s actual=%s\n' "$name" "$expected_config" "$actual" >&2
        exit 1
      fi
    }

    consumer() {
      stream_name="$1"; durable="$2"; filter="$3"; target="$4"; deliver="$5"; group="$6"
      max_deliver="${7:--1}"; backoff="${8:-[]}"
      if info="$(nats --server "$nats_url" req --raw "\$JS.API.CONSUMER.INFO.$stream_name.$durable" "" 2>&1)"; then
        if printf '%s' "$info" | jq -e '.error' >/dev/null; then
          printf '%s' "$info" | jq -r '.error.description' | grep -qi 'consumer not found' || { echo "$info" >&2; exit 1; }
        else
          actual="$(printf '%s' "$info" | jq -c '[.stream_name, .name, .config.durable_name, .config.filter_subject, .config.deliver_subject, (.config.deliver_group // ""), .config.ack_policy, .config.deliver_policy, (.config.max_deliver // -1), (.config.backoff // [])]')"
          expected="$(jq -cn --arg stream "$stream_name" --arg durable "$durable" --arg filter "$filter" --arg target "$target" --arg group "$group" --arg deliver "$deliver" --argjson max_deliver "$max_deliver" --argjson backoff "$backoff" '[ $stream, $durable, $durable, $filter, $target, $group, "explicit", $deliver, $max_deliver, $backoff ]')"
          [ "$actual" = "$expected" ] || { echo "incompatible consumer $stream_name/$durable" >&2; exit 1; }
          return
        fi
      else
        echo "$info" >&2; exit 1
      fi
      payload="$(jq -cn --arg stream "$stream_name" --arg durable "$durable" --arg filter "$filter" --arg target "$target" --arg group "$group" --arg deliver "$deliver" --argjson max_deliver "$max_deliver" --argjson backoff "$backoff" '{stream_name: $stream, action: "create", config: {name: $durable, durable_name: $durable, filter_subject: $filter, deliver_subject: $target, deliver_group: $group, deliver_policy: $deliver, ack_policy: "explicit", max_deliver: $max_deliver, backoff: $backoff}}')"
      result="$(nats --server "$nats_url" req --raw "\$JS.API.CONSUMER.CREATE.$stream_name.$durable" "$payload" 2>&1)" || { echo "$result" >&2; exit 1; }
      printf '%s' "$result" | jq -e --arg durable "$durable" '(.error | not) and .config.durable_name == $durable' >/dev/null || { echo "$result" >&2; exit 1; }
    }

    # Multi-filter push consumers use the JetStream API directly because the
    # CLI's single --filter form cannot preserve an exact FilterSubjects set.
    consumer_filters() {
      stream_name="$1"; durable="$2"; target="$3"; deliver="$4"; shift 4
      filters="$(printf '%s\n' "$@" | jq -R . | jq -sc 'sort')"
      if info="$(nats --server "$nats_url" req --raw "\$JS.API.CONSUMER.INFO.$stream_name.$durable" "" 2>&1)"; then
        if printf '%s' "$info" | jq -e '.error' >/dev/null; then
          printf '%s' "$info" | jq -r '.error.description' | grep -qi 'consumer not found' || { echo "$info" >&2; exit 1; }
        else
          actual="$(printf '%s' "$info" | jq -c '[.stream_name, .name, .config.durable_name, (.config.filter_subject // ""), (.config.filter_subjects // [] | sort), .config.deliver_subject, (.config.deliver_group // ""), .config.ack_policy, .config.deliver_policy]')"
          expected="$(jq -cn --arg stream "$stream_name" --arg durable "$durable" --arg target "$target" --arg deliver "$deliver" --argjson filters "$filters" '[ $stream, $durable, $durable, "", $filters, $target, "", "explicit", $deliver ]')"
          [ "$actual" = "$expected" ] || { echo "incompatible consumer $stream_name/$durable" >&2; exit 1; }
          return
        fi
      else
        echo "$info" >&2; exit 1
      fi
      payload="$(jq -cn --arg stream "$stream_name" --arg durable "$durable" --arg target "$target" --arg deliver "$deliver" --argjson filters "$filters" '{stream_name: $stream, action: "create", config: {name: $durable, durable_name: $durable, filter_subjects: $filters, deliver_subject: $target, deliver_policy: $deliver, ack_policy: "explicit"}}')"
      result="$(nats --server "$nats_url" req --raw "\$JS.API.CONSUMER.CREATE.$stream_name.$durable" "$payload" 2>&1)" || { echo "$result" >&2; exit 1; }
      printf '%s' "$result" | jq -e '(.error | not) and .config.durable_name != null' >/dev/null || { echo "$result" >&2; exit 1; }
    }

    pull_consumer() {
      stream_name="$1"; durable="$2"; filter="$3"; deliver="$4"
      if info="$(nats --server "$nats_url" req --raw "\$JS.API.CONSUMER.INFO.$stream_name.$durable" "" 2>&1)"; then
        if printf '%s' "$info" | jq -e '.error' >/dev/null; then
          printf '%s' "$info" | jq -r '.error.description' | grep -qi 'consumer not found' || { echo "$info" >&2; exit 1; }
        else
          actual="$(printf '%s' "$info" | jq -c '[.stream_name, .name, .config.durable_name, .config.filter_subject, (.config.filter_subjects // []), (.config.deliver_subject // ""), (.config.deliver_group // ""), .config.ack_policy, .config.deliver_policy]')"
          expected="$(jq -cn --arg stream "$stream_name" --arg durable "$durable" --arg filter "$filter" --arg deliver "$deliver" '[ $stream, $durable, $durable, $filter, [], "", "", "explicit", $deliver ]')"
          [ "$actual" = "$expected" ] || { echo "incompatible consumer $stream_name/$durable" >&2; exit 1; }
          return
        fi
      else
        echo "$info" >&2; exit 1
      fi
      payload="$(jq -cn --arg stream "$stream_name" --arg durable "$durable" --arg filter "$filter" --arg deliver "$deliver" '{stream_name: $stream, action: "create", config: {name: $durable, durable_name: $durable, filter_subject: $filter, deliver_policy: $deliver, ack_policy: "explicit"}}')"
      result="$(nats --server "$nats_url" req --raw "\$JS.API.CONSUMER.CREATE.$stream_name.$durable" "$payload" 2>&1)" || { echo "$result" >&2; exit 1; }
      printf '%s' "$result" | jq -e '(.error | not) and .config.durable_name != null' >/dev/null || { echo "$result" >&2; exit 1; }
    }

    stream message_events message.sent message.edited message.deleted message.read message.read_receipt_revoked message.reaction_added message.reaction_removed message.mention_added message.pinned message.unpinned message.forwarded message.delivery_ack
    stream user_events user.account_deleted user.account_restored user.guest_converted user.profile_created user.profile_updated user.profile_switched user.verified user.presence_changed user.game_detected user.settings_changed
    stream chat_events chat.created chat.member_changed chat.dm_peer_deleted space.tree_changed space.created voice.room_created voice.room_deleted space.invite_created space.member_joined space.member_left space.updated space.deleted
    stream matchmaking_events mm.search_started mm.search_cancelled mm.search_nudge mm.search_timeout mm.match_found mm.match_completed mm.rating_submitted mm.player_banned
    stream voice_events voice.call_incoming voice.call_accepted voice.call_declined voice.call_missed voice.call_ended voice.state_changed voice.screen_share_started voice.screen_share_stopped voice.call_started voice.member_joined
    stream story_events story.created story.viewed story.reacted story.expired story.highlight_created story.lfp_created story.lfp_response
    stream bot_events bot.registered bot.command_executed bot.webhook_delivered bot.webhook_failed
    stream social_events social.friend_request social.friend_accepted social.friend_removed social.user_blocked social.contacts_synced
    stream role_events role.created role.updated role.deleted role.assigned role.revoked role.chat_override_set role.chat_override_removed role.voice_override_set role.voice_override_removed
    stream file_events file.uploaded file.processed file.scan_infected file.expired file.downloaded
    stream subscription_events subscription.plan_started subscription.plan_cancelled subscription.plan_expired subscription.downgrade subscription.payment_success subscription.payment_failed subscription.space_pro_started subscription.space_pro_expired subscription.grace_reminder subscription.entitlement_changed
    stream_with_max_age subscription_auth_quarantine 34560000000000000 subscription.auth_quarantined
    stream moderation_events moderation.report_created moderation.sanction_applied moderation.appeal_submitted
    stream analytics_events 'analytics.>'

    consumer message_events analytics_v2_msg 'message.>' _INBOX.voice.analytics.analytics_v2_msg new analytics_v2_msg
    consumer user_events analytics_v2_user 'user.>' _INBOX.voice.analytics.analytics_v2_user new analytics_v2_user
    consumer chat_events analytics_v2_chat '>' _INBOX.voice.analytics.analytics_v2_chat new analytics_v2_chat
    consumer matchmaking_events analytics_v2_mm 'mm.>' _INBOX.voice.analytics.analytics_v2_mm new analytics_v2_mm
    consumer voice_events analytics_v2_voice 'voice.>' _INBOX.voice.analytics.analytics_v2_voice new analytics_v2_voice
    consumer story_events analytics_v2_story 'story.>' _INBOX.voice.analytics.analytics_v2_story new analytics_v2_story
    consumer bot_events analytics_v2_bot 'bot.>' _INBOX.voice.analytics.analytics_v2_bot new analytics_v2_bot
    consumer social_events analytics_v2_social 'social.>' _INBOX.voice.analytics.analytics_v2_social new analytics_v2_social
    consumer role_events analytics_v2_role 'role.>' _INBOX.voice.analytics.analytics_v2_role new analytics_v2_role
    consumer file_events analytics_v2_file 'file.>' _INBOX.voice.analytics.analytics_v2_file new analytics_v2_file
    consumer subscription_events analytics_v2_subscription 'subscription.>' _INBOX.voice.analytics.analytics_v2_subscription new analytics_v2_subscription
    consumer moderation_events analytics_v2_moderation 'moderation.>' _INBOX.voice.analytics.analytics_v2_moderation new analytics_v2_moderation
    consumer analytics_events analytics_v2_telemetry 'analytics.>' _INBOX.voice.analytics.analytics_v2_telemetry new analytics_v2_telemetry
    consumer user_events chat_account_deleted user.account_deleted _INBOX.voice.chat.chat_account_deleted all ''
    consumer message_events chat_message_activity message.sent _INBOX.voice.chat.chat_message_activity all chat_message_activity
    consumer message_events messaging_delivery_ack message.delivery_ack _INBOX.voice.messaging.messaging_delivery_ack all messaging_delivery_ack
    consumer user_events messaging_receipt_privacy user.settings_changed _INBOX.voice.messaging.messaging_receipt_privacy all messaging_receipt_privacy
    consumer message_events bot_message_events message.sent _INBOX.voice.bot.bot_message_events all ''
    consumer_filters story_events matchmaking_story_lfp_v2 _INBOX.voice.matchmaking.matchmaking_story_lfp_v2 all story.lfp_created story.lfp_response
    consumer_filters subscription_events space_subscription_entitlement _INBOX.voice.space.space_subscription_entitlement new subscription.space_pro_started subscription.space_pro_expired
    pull_consumer user_events user-account-deletion-v1 user.account_deleted all
    consumer subscription_events auth_subscription_tier 'subscription.>' _INBOX.voice.auth.subscription_tier new '' 5 '[1000000000,5000000000,30000000000,120000000000,300000000000]'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: voice-nats-analytics-chat-bootstrap
  namespace: __NAMESPACE__
spec:
  backoffLimit: 12
  template:
    metadata:
      labels: {app: voice-nats-analytics-chat-bootstrap}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: natsio/nats-box:0.18.0
          command: ["/bin/sh", "/config/bootstrap.sh"]
          env:
            - {name: NATS_URL, value: "nats://voice-nats:4222"}
            - {name: NATS_CREDS, value: "/var/run/nats/bootstrap/bootstrap.creds"}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: nats-bootstrap-creds, mountPath: /var/run/nats/bootstrap/bootstrap.creds, subPath: bootstrap.creds, readOnly: true}
      volumes:
        - name: config
          configMap: {name: voice-nats-analytics-chat-bootstrap, defaultMode: 0555}
        - name: nats-bootstrap-creds
          secret: {secretName: voice-nats-bootstrap-credentials, defaultMode: 0400, items: [{key: bootstrap.creds, path: bootstrap.creds}]}
