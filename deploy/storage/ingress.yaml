# Optional DNS-only HTTPS MinIO API route for uploads above edge proxy limits.
# The TLS Secret must already contain a certificate valid for the public host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-storage-https
  namespace: __K_NAMESPACE__
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: __STORAGE_INGRESS_HOST__
      http:
        paths:
          - path: /__FILE_BUCKET__
            pathType: Prefix
            backend:
              service:
                name: voice-minio
                port:
                  number: 9000
          - path: /__AVATAR_BUCKET__
            pathType: Prefix
            backend:
              service:
                name: voice-minio
                port:
                  number: 9000
  tls:
    - hosts:
        - __STORAGE_INGRESS_HOST__
      secretName: __STORAGE_TLS_SECRET__
