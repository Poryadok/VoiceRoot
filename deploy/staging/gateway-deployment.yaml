# Image is substituted in CI (sed) before kubectl apply — see docs/DEPLOYMENT.md.
# Full app stack upstreams: voice-app-config ConfigMap + voice-app-secrets Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-gateway
  namespace: voice-staging
  labels:
    app: voice-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-gateway
  template:
    metadata:
      labels:
        app: voice-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext: {fsGroup: 65532}
      containers:
        - name: gateway
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: GATEWAY_SESSION_EPOCH_STRICT, value: "true"}
            - name: LISTEN_ADDR
              value: ":8080"
            - {name: GATEWAY_PRINCIPAL_SIGNING_KEYS_DIR, value: /etc/voice/media/keys}
            - {name: GATEWAY_PRINCIPAL_ACTIVE_KID, valueFrom: {secretKeyRef: {name: voice-gateway-principal-signing, key: active-kid}}}
            - {name: GATEWAY_VOICE_USER_GRPC_ADDR, value: "voice-voice:9093"}
            - {name: GATEWAY_VOICE_USER_TLS_SERVER_NAME, value: voice-voice}
            - {name: GATEWAY_VOICE_USER_TLS_CA_FILE, value: /etc/voice/media/ca/ca.crt}
            - {name: GATEWAY_VOICE_USER_CLIENT_CERT_FILE, value: /etc/voice/media/client/tls.crt}
            - {name: GATEWAY_VOICE_USER_CLIENT_KEY_FILE, value: /etc/voice/media/client/tls.key}
            - {name: GATEWAY_MATCH_SQUAD_MEMBER_GRPC_ADDR, value: "voice-voice:9095"}
            - {name: GATEWAY_MATCH_SQUAD_MEMBER_TLS_CA_FILE, value: /etc/voice/media/ca/ca.crt}
            - {name: GATEWAY_MATCH_SQUAD_MEMBER_TLS_SERVER_NAME, value: voice-voice}
            - {name: GATEWAY_MATCH_SQUAD_MEMBER_CLIENT_CERT_FILE, value: /etc/voice/media/client/tls.crt}
            - {name: GATEWAY_MATCH_SQUAD_MEMBER_CLIENT_KEY_FILE, value: /etc/voice/media/client/tls.key}
            - name: GATEWAY_REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: voice-app-config
                  key: REDIS_ADDR
            - name: GATEWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voice-app-secrets
                  key: GATEWAY_DATABASE_URL
            - name: GATEWAY_STATIC_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: voice-app-secrets
                  key: GATEWAY_STATIC_TOKENS_JSON
                  optional: true
          envFrom:
            - configMapRef:
                name: voice-app-config
          volumeMounts:
            - {name: media-signing, mountPath: /etc/voice/media/keys, readOnly: true}
            - {name: media-client, mountPath: /etc/voice/media/client, readOnly: true}
            - {name: media-ca, mountPath: /etc/voice/media/ca, readOnly: true}
          # Gateway waits for required User gRPC before binding HTTP; staging's
          # 120s dial deadline must fit before liveness probing begins.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: media-signing
          secret: {secretName: voice-gateway-principal-signing, defaultMode: 0440, items: [{key: current.pem, path: current.pem}, {key: next.pem, path: next.pem}]}
        - name: media-client
          secret: {secretName: voice-gateway-media-client-tls, defaultMode: 0440, items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]}
        - name: media-ca
          secret: {secretName: voice-media-ca, defaultMode: 0440, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: voice-gateway
  namespace: voice-staging
  labels:
    app: voice-gateway
spec:
  selector:
    app: voice-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
