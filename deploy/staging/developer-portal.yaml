# Developer Portal: one runtime-required image with environment-owned public API binding.
# Substitute __IMAGE_REGISTRY__ / __IMAGE_TAG__ / __DEVELOPER_PORTAL_INGRESS_HOST__ before apply.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-developer-portal-runtime-config
  namespace: voice-staging
data:
  voice-runtime-config.json: |
    {"version":1,"app_origin":"https://__DEVELOPER_PORTAL_INGRESS_HOST__","api_base_url":"https://__GATEWAY_INGRESS_HOST__"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-developer-portal
  namespace: voice-staging
  labels: {app: voice-developer-portal}
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: voice-developer-portal}
  template:
    metadata:
      labels: {app: voice-developer-portal}
    spec:
      containers:
        - name: portal
          image: __IMAGE_REGISTRY__/developer-portal:__IMAGE_TAG__
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/voice-runtime-config.json
              subPath: voice-runtime-config.json
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          ports: [{containerPort: 80, name: http}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 15}
      volumes:
        - name: runtime-config
          configMap:
            name: voice-developer-portal-runtime-config
---
apiVersion: v1
kind: Service
metadata:
  name: voice-developer-portal
  namespace: voice-staging
spec:
  selector: {app: voice-developer-portal}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-developer-portal-http
  namespace: voice-staging
  labels:
    app.kubernetes.io/name: voice-developer-portal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: __DEVELOPER_PORTAL_INGRESS_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voice-developer-portal
                port:
                  number: 80
