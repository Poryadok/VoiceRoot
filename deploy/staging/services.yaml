            - {name: GAME_INTEGRATION_REALTIME_WORKLOAD_KEY_B64, valueFrom: {secretKeyRef: {name: voice-gameintegration-workload-credentials, key: GAME_INTEGRATION_REALTIME_WORKLOAD_KEY_B64}}}
