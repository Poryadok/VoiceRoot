          ports: [{containerPort: 8080}, {containerPort: 9090}, {containerPort: 8443, name: principal-jwks}]
          env:
            - {name: VOICE_RELEASE_PROFILE, value: "free-invite-alpha"}
            - {name: VOICE_RELEASE_POLICY_FILE, value: "__RELEASE_POLICY_DIRECTORY_NOTIFICATION__/policy.json"}
