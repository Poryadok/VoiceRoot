apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-chat
  namespace: voice-staging
  labels: {app: voice-chat}
spec:
  replicas: 1
  # Chat's account-deleted durable is fixed and has no queue group.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: voice-chat}
  template:
    metadata:
      labels: {app: voice-chat}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext: {fsGroup: 65532}
      containers:
        - name: chat
          image: __IMAGE_REGISTRY__/chat:__IMAGE_TAG__
          ports: [{containerPort: 8080}, {containerPort: 9090}, {containerPort: 8443}]
          env:
            - {name: CHAT_REALTIME_LIFECYCLE_GRPC_LISTEN, value: ":9099"}
            - {name: CHAT_REALTIME_LIFECYCLE_TLS_CERT_FILE, value: /etc/voice/realtime-p3/tls/tls.crt}
            - {name: CHAT_REALTIME_LIFECYCLE_TLS_KEY_FILE, value: /etc/voice/realtime-p3/tls/tls.key}
            - {name: CHAT_REALTIME_LIFECYCLE_CLIENT_CA_FILE, value: /etc/voice/realtime-p3/trust/realtime-client-ca.crt}
            - {name: CHAT_REALTIME_PRINCIPAL_JWKS_URL, value: "https://voice-p3-principal-jwks.voice-staging.svc:8443/realtime.json"}
            - {name: CHAT_REALTIME_PRINCIPAL_JWKS_CA_FILE, value: /etc/voice/realtime-p3/trust/realtime-jwks-ca.crt}
            - {name: CHAT_REALTIME_PRINCIPAL_REPLAY_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: CHAT_REALTIME_PRINCIPAL_REPLAY_REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: voice-p3-principal-replay, key: password}}}
            - {name: NATS_URL, value: "nats://127.0.0.1:4222"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: CHAT_DATABASE_URL}}}
            - {name: SPACE_DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: SPACE_DATABASE_URL}}}
            - {name: CHAT_GRPC_LISTEN, value: ":9090"}
            - {name: CHAT_MATCH_SQUAD_PRINCIPAL_GRPC_LISTEN, value: ":9092"}
            - {name: CHAT_MATCH_SQUAD_PRINCIPAL_TLS_CERT_FILE, value: /etc/voice/match-squad/server/tls.crt}
            - {name: CHAT_MATCH_SQUAD_PRINCIPAL_TLS_KEY_FILE, value: /etc/voice/match-squad/server/tls.key}
            - {name: CHAT_MATCH_SQUAD_PRINCIPAL_CLIENT_CA_FILE, value: /etc/voice/media/ca/ca.crt}
            - {name: CHAT_MATCH_SQUAD_PRINCIPAL_JWKS_URL, value: https://voice-matchmaking.voice-staging.svc:8443/internal/v1/principal/jwks.json}
            - {name: CHAT_MATCH_SQUAD_PRINCIPAL_JWKS_CA_FILE, value: /etc/voice/principal-jwks/ca/ca.crt}
            - {name: CHAT_MATCH_SQUAD_PRINCIPAL_REPLAY_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: CHAT_MATCH_SQUAD_PRINCIPAL_REPLAY_REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: voice-match-squad-replay, key: password}}}
          envFrom: [{configMapRef: {name: voice-app-config}}]
          volumeMounts:
            - {name: realtime-p3-server, mountPath: /etc/voice/realtime-p3/tls, readOnly: true}
            - {name: realtime-p3-trust, mountPath: /etc/voice/realtime-p3/trust, readOnly: true}
            - {name: match-squad-server, mountPath: /etc/voice/match-squad/server, readOnly: true}
            - {name: media-ca, mountPath: /etc/voice/media/ca, readOnly: true}
            - {name: matchmaking-principal-jwks-ca, mountPath: /etc/voice/principal-jwks/ca, readOnly: true}
            - {name: chat-match-squad-replay, mountPath: /etc/voice/match-squad/replay, readOnly: true}
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
        - name: nats-leaf
          image: nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
          args: ["-c", "/etc/nats/leaf.conf", "-a", "127.0.0.1", "-m", "8222"]
          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/chat.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/chat.creds, subPath: chat.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: realtime-p3-server
          secret: {secretName: voice-chat-realtime-p3-tls, defaultMode: 0440}
        - name: realtime-p3-trust
          secret: {secretName: voice-p3-principal-trust, defaultMode: 0440, items: [{key: realtime-client-ca.crt, path: realtime-client-ca.crt}, {key: realtime-jwks-ca.crt, path: realtime-jwks-ca.crt}]}
        - name: nats-leaf-config
          configMap: {name: voice-nats-leaf-config}
        - name: nats-service-creds
          secret: {secretName: voice-nats-service-credentials, defaultMode: 0400, items: [{key: chat.creds, path: chat.creds}]}
        - name: nats-hub-tls
          secret: {secretName: voice-nats-hub-tls, items: [{key: ca.crt, path: ca.crt}]}
        - name: match-squad-server
          secret: {secretName: voice-chat-match-squad-server-tls, defaultMode: 0440, items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]}
        - name: media-ca
          secret: {secretName: voice-media-ca, defaultMode: 0440, items: [{key: ca.crt, path: ca.crt}]}
        - name: matchmaking-principal-jwks-ca
          secret: {secretName: voice-matchmaking-principal-jwks-ca, defaultMode: 0440, items: [{key: ca.crt, path: ca.crt}]}
        - name: chat-match-squad-replay
          secret: {secretName: voice-match-squad-replay, defaultMode: 0440, items: [{key: password, path: password}]}
