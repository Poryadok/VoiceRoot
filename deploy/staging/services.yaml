# Public documents are provisioned from the SAME issuer secret generation before
# rollout. No issuer private key is mounted by this independent startup service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-p3-principal-publisher-config
  namespace: voice-staging
data:
  default.conf: |
    server {
      listen 8443 ssl;
      ssl_certificate /etc/voice/tls/tls.crt;
      ssl_certificate_key /etc/voice/tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      server_tokens off;
      root /srv/jwks;
      location = /realtime.json { limit_except GET { deny all; } try_files $uri =404; }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-p3-principal-jwks
  namespace: voice-staging
spec:
  replicas: 1
  selector:
    matchLabels: {app: voice-p3-principal-jwks}
  template:
    metadata:
      labels: {app: voice-p3-principal-jwks}
    spec:
      containers:
        - name: jwks
          image: nginx:stable-alpine
          ports: [{containerPort: 8443}]
          volumeMounts:
            - {name: public, mountPath: /srv/jwks, readOnly: true}
            - {name: tls, mountPath: /etc/voice/tls, readOnly: true}
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
          # TCP availability only. Chat validates HTTPS CA/SAN, exact issuer
          # current+next keys and replay before starting its protected listener.
          readinessProbe: {tcpSocket: {port: 8443}, periodSeconds: 5}
      volumes:
        - name: public
          configMap: {name: voice-p3-principal-public, items: [{key: realtime.json, path: realtime.json}]}
        - name: tls
          secret: {secretName: voice-p3-principal-jwks-tls, defaultMode: 0440}
        - name: config
          configMap: {name: voice-p3-principal-publisher-config}
---
apiVersion: v1
kind: Service
metadata:
  name: voice-p3-principal-jwks
  namespace: voice-staging
spec:
  selector: {app: voice-p3-principal-jwks}
  ports: [{name: https, port: 8443}]
