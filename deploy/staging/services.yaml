apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-realtime
  namespace: voice-staging
  labels: {app: voice-realtime}
spec:
  replicas: 1
  # The fixed Realtime durable names are singleton ownership slots.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: voice-realtime}
  template:
    metadata:
      labels: {app: voice-realtime}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext: {fsGroup: 65532}
      containers:
        - name: realtime
          image: __IMAGE_REGISTRY__/realtime:__IMAGE_TAG__
          ports: [{containerPort: 8080}, {containerPort: 9091}]
          env:
            - {name: VOICE_RELEASE_PROFILE, value: "free-invite-alpha"}
            - {name: VOICE_RELEASE_POLICY_FILE, value: "__RELEASE_POLICY_DIRECTORY_REALTIME__/policy.json"}
            - {name: VOICE_RELEASE_POLICY_SHA256, value: "__RELEASE_POLICY_SHA256__"}
            - {name: VOICE_RELEASE_SNAPSHOT_FILE, value: "__RELEASE_SNAPSHOT_REALTIME__"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: REALTIME_DATABASE_URL}}}
            - {name: REALTIME_PRINCIPAL_SIGNING_KEYS_DIR, value: /etc/voice/p3/keys}
            - {name: REALTIME_PRINCIPAL_ACTIVE_KID, value: current}
            - {name: REALTIME_PRINCIPAL_JWKS_FILE, value: /etc/voice/p3/public/realtime.json}
            - {name: REALTIME_CHAT_LIFECYCLE_ADDR, value: "voice-chat:9099"}
            - {name: REALTIME_CHAT_LIFECYCLE_SERVER_NAME, value: voice-chat.voice-staging.svc}
            - {name: REALTIME_CHAT_LIFECYCLE_CA_FILE, value: /etc/voice/p3/trust/chat-server-ca.crt}
            - {name: REALTIME_CHAT_LIFECYCLE_CERT_FILE, value: /etc/voice/p3/tls/tls.crt}
            - {name: REALTIME_CHAT_LIFECYCLE_KEY_FILE, value: /etc/voice/p3/tls/tls.key}
            - {name: REALTIME_SPACE_LIFECYCLE_GRPC_LISTEN, value: ":9091"}
            - {name: REALTIME_SPACE_LIFECYCLE_TLS_CERT_FILE, value: /etc/voice/p3/tls/tls.crt}
            - {name: REALTIME_SPACE_LIFECYCLE_TLS_KEY_FILE, value: /etc/voice/p3/tls/tls.key}
            - {name: REALTIME_SPACE_LIFECYCLE_CLIENT_CA_FILE, value: /etc/voice/p3/trust/space-client-ca.crt}
            - {name: REALTIME_SPACE_PRINCIPAL_JWKS_URL, value: "https://voice-space.voice-staging.svc:8443/.well-known/jwks.json"}
            - {name: REALTIME_SPACE_PRINCIPAL_JWKS_CA_FILE, value: /etc/voice/p3/trust/space-jwks-ca.crt}
            - {name: REALTIME_SPACE_PRINCIPAL_REPLAY_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: REALTIME_SPACE_PRINCIPAL_REPLAY_REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: voice-p3-principal-replay, key: password}}}
            - {name: REALTIME_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - name: REALTIME_INSTANCE_ID
              value: realtime-1
            - {name: GAME_INTEGRATION_CONSENT_URL, value: "http://voice-gameintegration:8080"}
            - {name: GAME_INTEGRATION_REALTIME_WORKLOAD_KEY_B64, valueFrom: {secretKeyRef: {name: voice-gameintegration-workload-credentials, key: GAME_INTEGRATION_REALTIME_WORKLOAD_KEY_B64}}}
            - {name: NATS_URL, value: "nats://127.0.0.1:4222"}
          envFrom: [{configMapRef: {name: voice-app-config}}]
          volumeMounts:
            - {name: release-policy, mountPath: "__RELEASE_POLICY_DIRECTORY_REALTIME__", readOnly: true}
            - {name: p3-signing, mountPath: /etc/voice/p3/keys, readOnly: true}
            - {name: p3-public, mountPath: /etc/voice/p3/public, readOnly: true}
            - {name: p3-server, mountPath: /etc/voice/p3/tls, readOnly: true}
            - {name: p3-trust, mountPath: /etc/voice/p3/trust, readOnly: true}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
        - name: nats-leaf
          image: nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
          args: ["-c", "/etc/nats/leaf.conf", "-a", "127.0.0.1", "-m", "8222"]
          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/realtime.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/realtime.creds, subPath: realtime.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: release-policy
          configMap: {name: "__RELEASE_POLICY_OBJECT__", items: [{key: "__RELEASE_POLICY_KEY__", path: policy.json}]}
        - name: p3-signing
          secret: {secretName: voice-realtime-principal-signing, defaultMode: 0440, items: [{key: current.pem, path: current.pem}, {key: next.pem, path: next.pem}]}
        - name: p3-public
          configMap: {name: voice-p3-principal-public, items: [{key: realtime.json, path: realtime.json}]}
        - name: p3-server
          secret: {secretName: voice-realtime-p3-tls, defaultMode: 0440}
        - name: p3-trust
          secret: {secretName: voice-p3-principal-trust, defaultMode: 0440, items: [{key: chat-server-ca.crt, path: chat-server-ca.crt}, {key: space-client-ca.crt, path: space-client-ca.crt}, {key: space-jwks-ca.crt, path: space-jwks-ca.crt}]}
        - name: nats-leaf-config
          configMap: {name: voice-nats-leaf-config}
        - name: nats-service-creds
          secret: {secretName: voice-nats-service-credentials, defaultMode: 0400, items: [{key: realtime.creds, path: realtime.creds}]}
        - name: nats-hub-tls
          secret: {secretName: voice-nats-hub-tls, items: [{key: ca.crt, path: ca.crt}]}
