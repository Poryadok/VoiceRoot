          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/space.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/space.creds, subPath: space.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: nats-leaf-config
          configMap: {name: voice-nats-leaf-config}
        - name: nats-service-creds
          secret: {secretName: voice-nats-service-credentials, defaultMode: 0400, items: [{key: space.creds, path: space.creds}]}
        - name: nats-hub-tls
          secret: {secretName: voice-nats-hub-tls, items: [{key: ca.crt, path: ca.crt}]}
        - name: principal-tls
          secret: {secretName: voice-space-principal-tls}
