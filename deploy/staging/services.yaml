# Voice application services (full app stack). Image placeholders substituted by render-and-apply.sh.
# Services: auth, social, user, chat, messaging, file, matchmaking, search, notification, realtime, space, role, voice, gameintegration, gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-auth
  namespace: voice-staging
  labels: {app: voice-auth}
spec:
  replicas: 1
  # Single-node staging: avoid two JVM pods during rollout (old + pulling new).
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: voice-auth}
  template:
    metadata:
      labels: {app: voice-auth}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext: {fsGroup: 65532}
      containers:
        - name: auth
          # Group-readable Secret projections keep private keys off world access.
          image: __IMAGE_REGISTRY__/auth:__IMAGE_TAG__
          ports: [{containerPort: 8080, name: http}, {containerPort: 9090, name: grpc}, {containerPort: 9091, name: principal}, {containerPort: 9092, name: session-floor}]
          env:
            - {name: VOICE_RELEASE_PROFILE, value: "free-invite-alpha"}
            - {name: VOICE_RELEASE_POLICY_FILE, value: "__RELEASE_POLICY_DIRECTORY_AUTH__/policy.json"}
            - {name: VOICE_RELEASE_POLICY_SHA256, value: "__RELEASE_POLICY_SHA256__"}
            - {name: VOICE_RELEASE_SNAPSHOT_FILE, value: "__RELEASE_SNAPSHOT_AUTH__"}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://voice-postgres:5432/auth_db"}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {configMapKeyRef: {name: voice-app-config, key: POSTGRES_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: POSTGRES_PASSWORD}}}
            - {name: AUTH_FLYWAY_ENABLED, value: "false"}
            # Certificate-only store; changeit is public integrity metadata, not a secret.
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0 -Djavax.net.ssl.trustStore=/etc/voice/media/trust/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"}
            - {name: AUTH_PRINCIPAL_GRPC_PORT, value: "9091"}
            - {name: AUTH_SESSION_FLOOR_GRPC_PORT, value: "9092"}
            - {name: AUTH_GRPC_TLS_CERT_FILE, value: /etc/voice/media/server/tls.crt}
            - {name: AUTH_GRPC_TLS_KEY_FILE, value: /etc/voice/media/server/tls.key}
            - {name: AUTH_SESSION_FLOOR_TLS_CLIENT_CA_FILE, value: /etc/voice/media/ca/ca.crt}
            - {name: S2S_JWKS_URLS_JSON, value: '{"gateway":"https://__GATEWAY_INGRESS_HOST__/.well-known/voice-principal-jwks.json","space":"https://voice-space:8443/internal/v1/principal/jwks.json","voice":"https://voice-voice:8443/internal/v1/principal/jwks.json"}'}
            - {name: SPRING_DATA_REDIS_HOST, value: voice-redis}
            - {name: SPRING_DATA_REDIS_PORT, value: "6379"}
            - {name: AUTH_JWT_PRIVATE_KEY_LOCATION, value: "file:/run/jwt.pem"}
            - {name: AUTH_OAUTH_PUBLIC_API_BASE_URL, valueFrom: {configMapKeyRef: {name: voice-app-config, key: AUTH_OAUTH_PUBLIC_API_BASE_URL}}}
            - {name: AUTH_OAUTH_DEVELOPER_PORTAL_ENABLED, valueFrom: {configMapKeyRef: {name: voice-app-config, key: AUTH_OAUTH_DEVELOPER_PORTAL_ENABLED}}}
            - {name: AUTH_OAUTH_DEVELOPER_PORTAL_CLIENT_ID, valueFrom: {configMapKeyRef: {name: voice-app-config, key: AUTH_OAUTH_DEVELOPER_PORTAL_CLIENT_ID}}}
            - {name: AUTH_OAUTH_DEVELOPER_PORTAL_REDIRECT_URIS, valueFrom: {configMapKeyRef: {name: voice-app-config, key: AUTH_OAUTH_DEVELOPER_PORTAL_REDIRECT_URIS}}}
            - {name: AUTH_OAUTH_ADMIN_ENABLED, valueFrom: {configMapKeyRef: {name: voice-app-config, key: AUTH_OAUTH_ADMIN_ENABLED}}}
            - {name: AUTH_OAUTH_ADMIN_CLIENT_ID, valueFrom: {configMapKeyRef: {name: voice-app-config, key: AUTH_OAUTH_ADMIN_CLIENT_ID}}}
            - {name: AUTH_OAUTH_ADMIN_REDIRECT_URIS, valueFrom: {configMapKeyRef: {name: voice-app-config, key: AUTH_OAUTH_ADMIN_REDIRECT_URIS}}}
            - {name: AUTH_NATS_URL, value: "nats://127.0.0.1:4222"}
            - {name: USER_GRPC_ADDR, value: "voice-user:9090"}
            - {name: AUTH_RESEND_API_KEY, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: AUTH_RESEND_API_KEY, optional: true}}}
            - {name: AUTH_RESEND_FROM, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: AUTH_RESEND_FROM, optional: true}}}
            - {name: AUTH_TOTP_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: AUTH_TOTP_ENCRYPTION_KEY}}}
            - {name: ACCOUNT_DELETE_TOKEN_SECRET, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: ACCOUNT_DELETE_TOKEN_SECRET}}}
          volumeMounts:
            - {name: release-policy, mountPath: "__RELEASE_POLICY_DIRECTORY_AUTH__", readOnly: true}
            - {name: jwt-key, mountPath: /run/jwt.pem, subPath: jwt.pem, readOnly: true}
            - {name: media-server, mountPath: /etc/voice/media/server, readOnly: true}
            - {name: media-ca, mountPath: /etc/voice/media/ca, readOnly: true}
            - {name: media-trust, mountPath: /etc/voice/media/trust, readOnly: true}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 6}
        - name: nats-leaf
          image: nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
          args: ["-c", "/etc/nats/leaf.conf", "-a", "127.0.0.1", "-m", "8222"]
          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/auth.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/auth.creds, subPath: auth.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: release-policy
          configMap: {name: "__RELEASE_POLICY_OBJECT__", items: [{key: "__RELEASE_POLICY_KEY__", path: policy.json}]}
        - name: jwt-key
          secret: {secretName: voice-app-secrets, items: [{key: AUTH_JWT_PRIVATE_KEY, path: jwt.pem}]}
        - name: media-server
          secret: {secretName: voice-auth-media-server-tls, defaultMode: 0440, items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]}
        - name: media-ca
          secret: {secretName: voice-media-ca, defaultMode: 0440, items: [{key: ca.crt, path: ca.crt}]}
        - name: media-trust
          secret: {secretName: voice-media-jvm-trust, defaultMode: 0440, items: [{key: truststore.p12, path: truststore.p12}]}
        - name: nats-leaf-config
          configMap: {name: voice-nats-leaf-config}
        - name: nats-service-creds
          secret: {secretName: voice-nats-service-credentials, defaultMode: 0400, items: [{key: auth.creds, path: auth.creds}]}
        - name: nats-hub-tls
          secret: {secretName: voice-nats-hub-tls, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: voice-auth
  namespace: voice-staging
spec:
  selector: {app: voice-auth}
  ports: [{name: http, port: 8080}, {name: grpc, port: 9090}, {name: principal, port: 9091}, {name: session-floor, port: 9092}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-social
  namespace: voice-staging
  labels: {app: voice-social}
spec:
  replicas: 1
  selector:
    matchLabels: {app: voice-social}
  template:
    metadata:
      labels: {app: voice-social}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: social
          image: __IMAGE_REGISTRY__/social:__IMAGE_TAG__
          ports: [{containerPort: 8080}, {containerPort: 9090}, {containerPort: 8443}]
          env:
            - {name: NATS_URL, value: "nats://127.0.0.1:4222"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: SOCIAL_DATABASE_URL}}}
            - {name: SOCIAL_GRPC_LISTEN, value: ":9090"}
            - {name: SOCIAL_PRINCIPAL_TLS_CERT_FILE, value: "/etc/voice/principal/tls/tls.crt"}
            - {name: SOCIAL_PRINCIPAL_TLS_KEY_FILE, value: "/etc/voice/principal/tls/tls.key"}
            - {name: SOCIAL_PRINCIPAL_JWKS_LISTEN, value: ":8443"}
            - {name: SOCIAL_PRINCIPAL_SIGNING_KEYS_DIR, value: "/etc/voice/principal/keys"}
            - {name: SOCIAL_PRINCIPAL_ACTIVE_KID, valueFrom: {secretKeyRef: {name: voice-social-principal-signing, key: active-kid}}}
            - {name: USER_PRINCIPAL_GRPC_ADDR, value: "voice-user:9091"}
            - {name: USER_PRINCIPAL_TLS_CA_FILE, value: "/etc/voice/principal/ca/ca.crt"}
            - {name: USER_PRINCIPAL_TLS_SERVER_NAME, value: "voice-user"}
            - {name: SPACE_PRINCIPAL_GRPC_ADDR, value: "voice-space:9091"}
            - {name: SPACE_PRINCIPAL_TLS_CA_FILE, value: "/etc/voice/principal/ca/ca.crt"}
            - {name: SPACE_PRINCIPAL_TLS_SERVER_NAME, value: "voice-space"}
          envFrom: [{configMapRef: {name: voice-app-config}}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          volumeMounts:
            - {name: principal-tls, mountPath: /etc/voice/principal/tls, readOnly: true}
            - {name: principal-ca, mountPath: /etc/voice/principal/ca, readOnly: true}
            - {name: principal-signing, mountPath: /etc/voice/principal/keys, readOnly: true}
        - name: nats-leaf
          image: nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
          args: ["-c", "/etc/nats/leaf.conf", "-a", "127.0.0.1", "-m", "8222"]
          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/social.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/social.creds, subPath: social.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: nats-leaf-config
          configMap: {name: voice-nats-leaf-config}
        - name: nats-service-creds
          secret: {secretName: voice-nats-service-credentials, defaultMode: 0400, items: [{key: social.creds, path: social.creds}]}
        - name: nats-hub-tls
          secret: {secretName: voice-nats-hub-tls, items: [{key: ca.crt, path: ca.crt}]}
        - name: principal-tls
          secret: {secretName: voice-social-principal-tls}
        - name: principal-ca
          secret: {secretName: voice-principal-ca}
        - name: principal-signing
          secret:
            secretName: voice-social-principal-signing
            items:
              - {key: current.pem, path: current.pem}
              - {key: next.pem, path: next.pem}
---
apiVersion: v1
kind: Service
metadata:
  name: voice-social
  namespace: voice-staging
spec:
  selector: {app: voice-social}
  ports: [{name: http, port: 8080}, {name: grpc, port: 9090}, {name: principal-jwks, port: 8443}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-user
  namespace: voice-staging
  labels: {app: voice-user}
spec:
  replicas: 1
  selector:
    matchLabels: {app: voice-user}
  template:
    metadata:
      labels: {app: voice-user}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: user
          image: __IMAGE_REGISTRY__/user:__IMAGE_TAG__
          ports: [{containerPort: 8080}, {containerPort: 9090}, {containerPort: 9091}, {containerPort: 9092}, {containerPort: 9093}, {containerPort: 9095, name: notif-presence}]
          env:
            - {name: VOICE_RELEASE_PROFILE, value: "free-invite-alpha"}
            - {name: VOICE_RELEASE_POLICY_FILE, value: "__RELEASE_POLICY_DIRECTORY_USER__/policy.json"}
            - {name: VOICE_RELEASE_POLICY_SHA256, value: "__RELEASE_POLICY_SHA256__"}
            - {name: VOICE_RELEASE_SNAPSHOT_FILE, value: "__RELEASE_SNAPSHOT_USER__"}
            - {name: NATS_URL, value: "nats://127.0.0.1:4222"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: USER_DATABASE_URL}}}
            - {name: USER_ACCOUNT_DELETE_CONSUMER_ENABLED, value: "false"}
            - {name: USER_GRPC_ADDR, value: ":9090"}
            - {name: USER_PRINCIPAL_TLS_CERT_FILE, value: "/etc/voice/principal/tls/tls.crt"}
            - {name: USER_PRINCIPAL_TLS_KEY_FILE, value: "/etc/voice/principal/tls/tls.key"}
            - {name: USER_PRINCIPAL_GRPC_LISTEN, value: ":9091"}
            - {name: USER_PRINCIPAL_REPLAY_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: USER_FILE_PRINCIPAL_GRPC_LISTEN, value: ":9092"}
            - {name: USER_FILE_PRINCIPAL_TLS_CERT_FILE, value: "/etc/voice/file-principal/tls/tls.crt"}
            - {name: USER_FILE_PRINCIPAL_TLS_KEY_FILE, value: "/etc/voice/file-principal/tls/tls.key"}
            - {name: USER_FILE_PRINCIPAL_REPLAY_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: USER_SEARCH_PRINCIPAL_GRPC_LISTEN, value: ":9093"}
            - {name: USER_SEARCH_PRINCIPAL_TLS_CERT_FILE, value: "/etc/voice/principal/tls/tls.crt"}
            - {name: USER_SEARCH_PRINCIPAL_TLS_KEY_FILE, value: "/etc/voice/principal/tls/tls.key"}
            - {name: USER_SEARCH_PRINCIPAL_REPLAY_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: USER_NOTIFICATION_PRINCIPAL_GRPC_LISTEN, value: ":9095"}
            - {name: USER_NOTIFICATION_PRINCIPAL_TLS_CERT_FILE, value: "/etc/voice/principal/tls/tls.crt"}
            - {name: USER_NOTIFICATION_PRINCIPAL_TLS_KEY_FILE, value: "/etc/voice/principal/tls/tls.key"}
            - {name: USER_NOTIFICATION_PRINCIPAL_REPLAY_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: USER_SEARCH_PROJECTION_CURSOR_HMAC_KEY, valueFrom: {secretKeyRef: {name: voice-user-search-projection, key: cursor-hmac-key}}}
            - {name: S2S_JWKS_URLS_JSON, value: '{"social":"https://voice-social:8443/.well-known/jwks.json","file":"https://voice-file:8443/.well-known/jwks.json","search":"https://voice-search:8443/.well-known/jwks.json","notification":"https://voice-notification:8443/.well-known/jwks.json"}'}
            - {name: S2S_JWKS_CA_FILE, value: "/etc/voice/principal/ca/ca.crt"}
            - {name: S2S_JWKS_REFRESH_AFTER, value: "30s"}
            - {name: S2S_JWKS_HARD_EXPIRY, value: "2m"}
            - {name: S2S_UNKNOWN_KID_COOLDOWN, value: "5s"}
            - {name: USER_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: USER_R2_ENDPOINT, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: USER_R2_ENDPOINT}}}
            - {name: USER_R2_SIGNING_ENDPOINT, value: "__S3_SIGNING_ENDPOINT__"}
            - {name: USER_R2_REGION, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: USER_R2_REGION}}}
            - {name: USER_R2_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: voice-minio-credentials, key: MINIO_ROOT_USER}}}
            - {name: USER_R2_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: voice-minio-credentials, key: MINIO_ROOT_PASSWORD}}}
            - {name: USER_R2_BUCKET, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: USER_R2_BUCKET}}}
            - {name: USER_R2_PUBLIC_BASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: USER_R2_PUBLIC_BASE_URL}}}
          envFrom: [{configMapRef: {name: voice-app-config}}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          volumeMounts:
            - {name: release-policy, mountPath: "__RELEASE_POLICY_DIRECTORY_USER__", readOnly: true}
            - {name: principal-tls, mountPath: /etc/voice/principal/tls, readOnly: true}
            - {name: file-principal-tls, mountPath: /etc/voice/file-principal/tls, readOnly: true}
            - {name: principal-ca, mountPath: /etc/voice/principal/ca, readOnly: true}
        - name: nats-leaf
          image: nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
          args: ["-c", "/etc/nats/leaf.conf", "-a", "127.0.0.1", "-m", "8222"]
          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/user.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/user.creds, subPath: user.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: release-policy
          configMap: {name: "__RELEASE_POLICY_OBJECT__", items: [{key: "__RELEASE_POLICY_KEY__", path: policy.json}]}
        - name: nats-leaf-config
          configMap: {name: voice-nats-leaf-config}
        - name: nats-service-creds
          secret: {secretName: voice-nats-service-credentials, defaultMode: 0400, items: [{key: user.creds, path: user.creds}]}
        - name: nats-hub-tls
          secret: {secretName: voice-nats-hub-tls, items: [{key: ca.crt, path: ca.crt}]}
        - name: principal-tls
          secret: {secretName: voice-user-principal-tls}
        - name: file-principal-tls
          secret: {secretName: voice-user-file-principal-tls}
        - name: principal-ca
          secret: {secretName: voice-principal-ca}
---
apiVersion: v1
