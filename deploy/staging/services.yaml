            - {name: NOTIFICATION_GRPC_LISTEN, value: ":9090"}
            - {name: NOTIFICATION_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: FCM_CREDENTIALS_JSON, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: FCM_SERVICE_ACCOUNT_JSON, optional: true}}}
            - {name: FCM_PROJECT_ID, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: FCM_PROJECT_ID, optional: true}}}
            - {name: FCM_SERVICE_ACCOUNT_JSON, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: FCM_SERVICE_ACCOUNT_JSON, optional: true}}}
            - {name: APNS_KEY_ID, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: APNS_KEY_ID, optional: true}}}
            - {name: APNS_TEAM_ID, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: APNS_TEAM_ID, optional: true}}}
            - {name: APNS_PRIVATE_KEY, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: APNS_PRIVATE_KEY, optional: true}}}
            - {name: APNS_BUNDLE_ID, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: APNS_BUNDLE_ID, optional: true}}}
            - {name: APNS_VOIP_TOPIC, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: APNS_VOIP_TOPIC, optional: true}}}
            - {name: APNS_PRODUCTION, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: APNS_PRODUCTION, optional: true}}}
            - {name: NOTIFICATION_RECORD_PUSHES, value: "false"}
            - {name: NOTIFICATION_PRINCIPAL_SIGNING_KEYS_DIR, value: /etc/voice/notification-principal/keys}
            - {name: NOTIFICATION_PRINCIPAL_ACTIVE_KID, valueFrom: {secretKeyRef: {name: voice-notification-principal-signing, key: active-kid}}}
            - {name: NOTIFICATION_PRINCIPAL_JWKS_LISTEN, value: ":8443"}
