            - {name: VOICE_AUTH_SESSION_FLOOR_CLIENT_CERT_FILE, value: /etc/voice/media/client/tls.crt}
            - {name: VOICE_AUTH_SESSION_FLOOR_CLIENT_KEY_FILE, value: /etc/voice/media/client/tls.key}
            - {name: S2S_JWKS_URLS_JSON, value: '{"gateway":"https://__GATEWAY_INGRESS_HOST__/.well-known/voice-principal-jwks.json"}'}
            - {name: S2S_JWKS_CA_FILE, value: /etc/voice/media/ca/jwks-ca.crt}
            - {name: S2S_JWKS_CLIENT_CERT_FILE, value: /etc/voice/media/client/tls.crt}
