apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-matchmaking
  namespace: voice-staging
  labels: {app: voice-matchmaking}
spec:
  replicas: 1
  # Matchmaking binds one centrally provisioned fixed push durable.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: voice-matchmaking}
  template:
    metadata:
      labels: {app: voice-matchmaking}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: matchmaking
          image: __IMAGE_REGISTRY__/matchmaking:__IMAGE_TAG__
          ports: [{containerPort: 8080}, {containerPort: 9090}, {containerPort: 8443, name: principal-jwks}]
          env:
            - {name: NATS_URL, value: "nats://127.0.0.1:4222"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: MATCHMAKING_DATABASE_URL}}}
            - {name: MATCHMAKING_GRPC_LISTEN, value: ":9090"}
            - {name: MATCHMAKING_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: MATCHMAKING_MATCH_SQUAD_CHAT_GRPC_ADDR, value: "voice-chat:9092"}
            - {name: MATCHMAKING_MATCH_SQUAD_VOICE_GRPC_ADDR, value: "voice-voice:9094"}
            - {name: MATCHMAKING_MATCH_SQUAD_CHAT_CA_FILE, value: /etc/voice/media/ca/ca.crt}
            - {name: MATCHMAKING_MATCH_SQUAD_VOICE_CA_FILE, value: /etc/voice/media/ca/ca.crt}
            - {name: MATCHMAKING_MATCH_SQUAD_CLIENT_CERT_FILE, value: /etc/voice/match-squad/client/tls.crt}
            - {name: MATCHMAKING_MATCH_SQUAD_CLIENT_KEY_FILE, value: /etc/voice/match-squad/client/tls.key}
            - {name: MATCHMAKING_MATCH_SQUAD_CHAT_SERVER_NAME, value: voice-chat}
            - {name: MATCHMAKING_MATCH_SQUAD_VOICE_SERVER_NAME, value: voice-voice}
            - {name: MATCHMAKING_PRINCIPAL_SIGNING_KEYS_DIR, value: /etc/voice/principal/keys}
            - {name: MATCHMAKING_PRINCIPAL_ACTIVE_KID, valueFrom: {secretKeyRef: {name: voice-matchmaking-principal-signing, key: active-kid}}}
            - {name: MATCHMAKING_PRINCIPAL_JWKS_LISTEN_ADDR, value: ":8443"}
            - {name: MATCHMAKING_PRINCIPAL_JWKS_TLS_CERT_FILE, value: /etc/voice/principal-jwks/tls/tls.crt}
            - {name: MATCHMAKING_PRINCIPAL_JWKS_TLS_KEY_FILE, value: /etc/voice/principal-jwks/tls/tls.key}
            - {name: S2S_JWKS_URLS_JSON, value: '{"gateway":"https://__GATEWAY_INGRESS_HOST__/.well-known/voice-principal-jwks.json","space":"https://voice-space:8443/internal/v1/principal/jwks.json"}'}
            - {name: S2S_JWKS_CA_FILE, value: /etc/voice/media/ca/jwks-ca.crt}
            - {name: S2S_JWKS_REFRESH_AFTER, value: 30s}
            - {name: S2S_JWKS_HARD_EXPIRY, value: 2m}
            - {name: S2S_UNKNOWN_KID_COOLDOWN, value: 5s}
          envFrom: [{configMapRef: {name: voice-app-config}}]
          volumeMounts:
            - {name: match-squad-client, mountPath: /etc/voice/match-squad/client, readOnly: true}
            - {name: media-ca, mountPath: /etc/voice/media/ca, readOnly: true}
            - {name: matchmaking-principal-signing, mountPath: /etc/voice/principal/keys, readOnly: true}
            - {name: matchmaking-principal-jwks-tls, mountPath: /etc/voice/principal-jwks/tls, readOnly: true}
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
        - name: nats-leaf
          image: nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
          args: ["-c", "/etc/nats/leaf.conf", "-a", "127.0.0.1", "-m", "8222"]
          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/matchmaking.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/matchmaking.creds, subPath: matchmaking.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: nats-leaf-config
          configMap: {name: voice-nats-leaf-config}
        - name: nats-service-creds
          secret: {secretName: voice-nats-service-credentials, defaultMode: 0400, items: [{key: matchmaking.creds, path: matchmaking.creds}]}
        - name: nats-hub-tls
          secret: {secretName: voice-nats-hub-tls, items: [{key: ca.crt, path: ca.crt}]}
        - name: match-squad-client
          secret: {secretName: voice-matchmaking-client-tls, defaultMode: 0440, items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]}
        - name: media-ca
          secret: {secretName: voice-media-ca, defaultMode: 0440, items: [{key: ca.crt, path: ca.crt}, {key: jwks-ca.crt, path: jwks-ca.crt}]}
        - name: matchmaking-principal-signing
          secret: {secretName: voice-matchmaking-principal-signing, defaultMode: 0440, items: [{key: current.pem, path: current.pem}, {key: next.pem, path: next.pem}]}
        - name: matchmaking-principal-jwks-tls
          secret: {secretName: voice-matchmaking-principal-jwks-tls, defaultMode: 0440, items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]}
