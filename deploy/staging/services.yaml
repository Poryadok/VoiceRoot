  name: voice-space
  namespace: voice-staging
  labels: {app: voice-space}
spec:
  replicas: 1
  # Space owns one fixed push durable; avoid overlapping old/new subscribers.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: voice-space}
  template:
    metadata:
      labels: {app: voice-space}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: space
          image: __IMAGE_REGISTRY__/space:__IMAGE_TAG__
          ports: [{containerPort: 8080}, {containerPort: 9090}, {containerPort: 9091}]
          env:
            - {name: NATS_URL, value: "nats://127.0.0.1:4222"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: SPACE_DATABASE_URL}}}
            - {name: SPACE_GRPC_LISTEN, value: ":9090"}
            - {name: SPACE_PRINCIPAL_TLS_CERT_FILE, value: "/etc/voice/principal/tls/tls.crt"}
            - {name: SPACE_PRINCIPAL_TLS_KEY_FILE, value: "/etc/voice/principal/tls/tls.key"}
            - {name: SPACE_PRINCIPAL_GRPC_LISTEN, value: ":9091"}
            - {name: SPACE_PRINCIPAL_REPLAY_REDIS_ADDR, valueFrom: {configMapKeyRef: {name: voice-app-config, key: REDIS_ADDR}}}
            - {name: S2S_JWKS_URLS_JSON, value: '{"social":"https://voice-social:8443/.well-known/jwks.json"}'}
            - {name: S2S_JWKS_CA_FILE, value: "/etc/voice/principal/ca/ca.crt"}
            - {name: S2S_JWKS_REFRESH_AFTER, value: "30s"}
            - {name: S2S_JWKS_HARD_EXPIRY, value: "2m"}
            - {name: S2S_UNKNOWN_KID_COOLDOWN, value: "5s"}
          envFrom: [{configMapRef: {name: voice-app-config}}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          volumeMounts:
            - {name: principal-tls, mountPath: /etc/voice/principal/tls, readOnly: true}
            - {name: principal-ca, mountPath: /etc/voice/principal/ca, readOnly: true}
        - name: nats-leaf
          image: nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
          args: ["-c", "/etc/nats/leaf.conf"]
          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/space.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/space.creds, subPath: space.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: nats-leaf-config
          configMap: {name: voice-nats-leaf-config}
        - name: nats-service-creds
          secret: {secretName: voice-nats-service-credentials, defaultMode: 0400, items: [{key: space.creds, path: space.creds}]}
        - name: nats-hub-tls
          secret: {secretName: voice-nats-hub-tls, items: [{key: ca.crt, path: ca.crt}]}
        - name: principal-tls
          secret: {secretName: voice-space-principal-tls}
        - name: principal-ca
          secret: {secretName: voice-principal-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: voice-space
  namespace: voice-staging
spec:
  selector: {app: voice-space}
  ports: [{name: http, port: 8080}, {name: grpc, port: 9090}, {name: principal-grpc, port: 9091}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-chat
  namespace: voice-staging
  labels: {app: voice-chat}
spec:
  replicas: 1
  # Chat's account-deleted durable is fixed and has no queue group.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: voice-chat}
  template:
    metadata:
      labels: {app: voice-chat}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: chat
          image: __IMAGE_REGISTRY__/chat:__IMAGE_TAG__
          ports: [{containerPort: 8080}, {containerPort: 9090}, {containerPort: 8443}]
          env:
            - {name: NATS_URL, value: "nats://127.0.0.1:4222"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: CHAT_DATABASE_URL}}}
            - {name: SPACE_DATABASE_URL, valueFrom: {secretKeyRef: {name: voice-app-secrets, key: SPACE_DATABASE_URL}}}
            - {name: CHAT_GRPC_LISTEN, value: ":9090"}
          envFrom: [{configMapRef: {name: voice-app-config}}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
