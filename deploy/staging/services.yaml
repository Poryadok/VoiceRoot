            - {name: NOTIFICATION_PRINCIPAL_JWKS_TLS_KEY_FILE, value: /etc/voice/notification-principal/tls/tls.key}
            - {name: USER_NOTIFICATION_PRINCIPAL_GRPC_ADDR, value: "voice-user:9095"}
            - {name: USER_NOTIFICATION_PRINCIPAL_TLS_CA_FILE, value: /etc/voice/notification-principal/ca/ca.crt}
            - {name: USER_NOTIFICATION_PRINCIPAL_TLS_SERVER_NAME, value: voice-user}
            - {name: USER_GRPC_ADDR, value: "voice-user:9090"}
            - {name: CHAT_GRPC_ADDR, value: "voice-chat:9090"}
            - {name: MESSAGING_GRPC_ADDR, value: "voice-messaging:9090"}
            - {name: GAME_INTEGRATION_CONSENT_URL, value: "http://voice-gameintegration:8080"}
            - {name: GAME_INTEGRATION_NOTIFICATION_WORKLOAD_KEY_B64, valueFrom: {secretKeyRef: {name: voice-gameintegration-workload-credentials, key: GAME_INTEGRATION_NOTIFICATION_WORKLOAD_KEY_B64}}}
            - {name: NATS_URL, value: "nats://127.0.0.1:4222"}
          envFrom: [{configMapRef: {name: voice-app-config}}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          volumeMounts:
            - {name: release-policy, mountPath: "__RELEASE_POLICY_DIRECTORY_NOTIFICATION__", readOnly: true}
            - {name: notification-principal-signing, mountPath: /etc/voice/notification-principal/keys, readOnly: true}
            - {name: notification-principal-tls, mountPath: /etc/voice/notification-principal/tls, readOnly: true}
            - {name: principal-ca, mountPath: /etc/voice/notification-principal/ca, readOnly: true}
        - name: nats-leaf
          image: nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
          args: ["-c", "/etc/nats/leaf.conf", "-a", "127.0.0.1", "-m", "8222"]
          env: [{name: NATS_CREDS, value: "/var/run/nats/creds/notification.creds"}]
          volumeMounts:
            - {name: nats-leaf-config, mountPath: /etc/nats/leaf.conf, subPath: leaf.conf, readOnly: true}
            - {name: nats-service-creds, mountPath: /var/run/nats/creds/notification.creds, subPath: notification.creds, readOnly: true}
            - {name: nats-hub-tls, mountPath: /etc/nats/tls/ca.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: release-policy
          configMap: {name: "__RELEASE_POLICY_OBJECT__", items: [{key: "__RELEASE_POLICY_KEY__", path: policy.json}]}
        - name: nats-leaf-config
