# Central, operator-applied bootstrap contract. Publisher workloads receive only
# read/publish access and validate these exact stream definitions at runtime.
streams:
  - name: message_events
    subjects: [message.sent, message.edited, message.deleted, message.read, message.read_receipt_revoked, message.reaction_added, message.reaction_removed, message.mention_added, message.pinned, message.unpinned, message.forwarded, message.delivery_ack]
    retention: limits
    max_age: 168h
    storage: file
  - name: chat_events
    subjects: [chat.created, chat.member_changed, chat.dm_peer_deleted, space.tree_changed, space.created, voice.room_created, voice.room_deleted, space.invite_created, space.member_joined, space.member_left, space.updated, space.deleted]
    retention: limits
    max_age: 168h
    storage: file
  - name: file_events
    subjects: [file.uploaded, file.processed, file.scan_infected, file.expired, file.downloaded]
    retention: limits
    max_age: 168h
    storage: file
  - name: moderation_events
    subjects: [moderation.report_created, moderation.sanction_applied, moderation.appeal_submitted]
    retention: limits
    max_age: 168h
    storage: file
  - name: bot_events
    subjects: [bot.registered, bot.command_executed, bot.webhook_delivered, bot.webhook_failed]
    retention: limits
    max_age: 168h
    storage: file
  - name: subscription_events
    subjects: [subscription.plan_started, subscription.plan_cancelled, subscription.plan_expired, subscription.downgrade, subscription.payment_success, subscription.payment_failed, subscription.space_pro_started, subscription.space_pro_expired, subscription.grace_reminder]
    retention: limits
    max_age: 168h
    storage: file
  - name: story_events
    subjects: [story.created, story.viewed, story.reacted, story.expired, story.highlight_created, story.lfp_created, story.lfp_response]
    retention: limits
    max_age: 168h
    storage: file
