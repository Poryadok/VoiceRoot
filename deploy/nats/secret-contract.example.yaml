# Non-production template only. Copy each document into the target namespace's
# secret manager; do not apply these placeholders and never commit real JWTs,
# NKey seeds, or .creds files. Broker authentication remains disabled until the
# dedicated activation PR mounts these exact keys.
apiVersion: v1
kind: Secret
metadata:
  name: voice-nats-operator
  namespace: __VOICE_NAMESPACE__
type: Opaque
stringData:
  # UTF-8 NATS JWT text. The server leaf will mount these read-only at
  # /etc/nats/jwt/operator.jwt, /etc/nats/jwt/account.jwt, and
  # /etc/nats/jwt/system-account.jwt. APP and SYS are distinct resolver
  # preloads; external values are deployment-specific and never committed.
  operator.jwt: "REPLACE_WITH_OPERATOR_JWT"
  account.jwt: "REPLACE_WITH_ACCOUNT_JWT"
  system-account.jwt: "REPLACE_WITH_SYSTEM_ACCOUNT_JWT"
  account.public: "REPLACE_WITH_APP_ACCOUNT_PUBLIC_NKEY"
  system-account.public: "REPLACE_WITH_SYSTEM_ACCOUNT_PUBLIC_NKEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: voice-nats-bootstrap-credentials
  namespace: __VOICE_NAMESPACE__
type: Opaque
stringData:
  # Provisioning Jobs only. Never mount this credential into a service pod.
  bootstrap.creds: "REPLACE_WITH_BOOTSTRAP_CREDS"
---
apiVersion: v1
kind: Secret
metadata:
  name: voice-nats-service-credentials
  namespace: __VOICE_NAMESPACE__
type: Opaque
stringData:
  # Each value is the complete UTF-8 .creds file, including its user JWT and
  # USER NKEY SEED block. The later leaf mounts one key only at
  # /var/run/nats/creds/<service>.creds with readOnly: true and mode 0400.
  analytics.creds: "REPLACE_WITH_ANALYTICS_CREDS"
  auth.creds: "REPLACE_WITH_AUTH_CREDS"
  bot.creds: "REPLACE_WITH_BOT_CREDS"
  chat.creds: "REPLACE_WITH_CHAT_CREDS"
  file.creds: "REPLACE_WITH_FILE_CREDS"
  gateway.creds: "REPLACE_WITH_GATEWAY_CREDS"
  matchmaking.creds: "REPLACE_WITH_MATCHMAKING_CREDS"
  messaging.creds: "REPLACE_WITH_MESSAGING_CREDS"
  moderation.creds: "REPLACE_WITH_MODERATION_CREDS"
  notification.creds: "REPLACE_WITH_NOTIFICATION_CREDS"
  realtime.creds: "REPLACE_WITH_REALTIME_CREDS"
  role.creds: "REPLACE_WITH_ROLE_CREDS"
  search.creds: "REPLACE_WITH_SEARCH_CREDS"
  social.creds: "REPLACE_WITH_SOCIAL_CREDS"
  space.creds: "REPLACE_WITH_SPACE_CREDS"
  story.creds: "REPLACE_WITH_STORY_CREDS"
  subscription.creds: "REPLACE_WITH_SUBSCRIPTION_CREDS"
  user.creds: "REPLACE_WITH_USER_CREDS"
  voice.creds: "REPLACE_WITH_VOICE_CREDS"
