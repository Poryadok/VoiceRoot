# Reviewed APP account permission intent. Issue fresh user JWTs from this policy;
# never deploy the disposable credentials emitted by nats-jwt-fixture.
version: 1
services:
  analytics:
    no_response: true
    publish:
      - $JS.API.CONSUMER.INFO.message_events.analytics_v2_msg
      - $JS.API.CONSUMER.INFO.user_events.analytics_v2_user
      - $JS.API.CONSUMER.INFO.chat_events.analytics_v2_chat
      - $JS.API.CONSUMER.INFO.matchmaking_events.analytics_v2_mm
      - $JS.API.CONSUMER.INFO.voice_events.analytics_v2_voice
      - $JS.API.CONSUMER.INFO.story_events.analytics_v2_story
      - $JS.API.CONSUMER.INFO.bot_events.analytics_v2_bot
      - $JS.API.CONSUMER.INFO.social_events.analytics_v2_social
      - $JS.API.CONSUMER.INFO.role_events.analytics_v2_role
      - $JS.API.CONSUMER.INFO.file_events.analytics_v2_file
      - $JS.API.CONSUMER.INFO.subscription_events.analytics_v2_subscription
      - $JS.API.CONSUMER.INFO.moderation_events.analytics_v2_moderation
      - $JS.API.CONSUMER.INFO.analytics_events.analytics_v2_telemetry
      - $JS.ACK.message_events.analytics_v2_msg.>
      - $JS.ACK.user_events.analytics_v2_user.>
      - $JS.ACK.chat_events.analytics_v2_chat.>
      - $JS.ACK.matchmaking_events.analytics_v2_mm.>
      - $JS.ACK.voice_events.analytics_v2_voice.>
      - $JS.ACK.story_events.analytics_v2_story.>
      - $JS.ACK.bot_events.analytics_v2_bot.>
      - $JS.ACK.social_events.analytics_v2_social.>
      - $JS.ACK.role_events.analytics_v2_role.>
      - $JS.ACK.file_events.analytics_v2_file.>
      - $JS.ACK.subscription_events.analytics_v2_subscription.>
      - $JS.ACK.moderation_events.analytics_v2_moderation.>
      - $JS.ACK.analytics_events.analytics_v2_telemetry.>
    subscribe:
      - _INBOX.voice.analytics.>
      - _INBOX.voice.analytics.analytics_v2_msg
      - _INBOX.voice.analytics.analytics_v2_user
      - _INBOX.voice.analytics.analytics_v2_chat
      - _INBOX.voice.analytics.analytics_v2_mm
      - _INBOX.voice.analytics.analytics_v2_voice
      - _INBOX.voice.analytics.analytics_v2_story
      - _INBOX.voice.analytics.analytics_v2_bot
      - _INBOX.voice.analytics.analytics_v2_social
      - _INBOX.voice.analytics.analytics_v2_role
      - _INBOX.voice.analytics.analytics_v2_file
      - _INBOX.voice.analytics.analytics_v2_subscription
      - _INBOX.voice.analytics.analytics_v2_moderation
      - _INBOX.voice.analytics.analytics_v2_telemetry
  auth:
    no_response: true
    publish: [user.guest_converted, user.account_deleted, user.account_restored, subscription.auth_quarantined, $JS.API.CONSUMER.INFO.subscription_events.auth_subscription_tier, $JS.ACK.subscription_events.auth_subscription_tier.>]
    subscribe: [_INBOX.voice.auth.requests.>, _INBOX.voice.auth.subscription_tier]
  bot:
    no_response: true
    publish:
      - bot.registered
      - bot.command_executed
      - bot.webhook_delivered
      - bot.webhook_failed
      - $JS.API.STREAM.INFO.bot_events
      - $JS.API.CONSUMER.INFO.message_events.bot_message_events
      - $JS.ACK.message_events.bot_message_events.>
    subscribe: [_INBOX.voice.bot.>, _INBOX.voice.bot.bot_message_events]
  chat:
    no_response: true
    publish:
      - chat.created
      - chat.member_changed
      - chat.dm_peer_deleted
      - $JS.API.STREAM.INFO.chat_events
      - $JS.API.CONSUMER.INFO.user_events.chat_account_deleted
      - $JS.API.CONSUMER.INFO.message_events.chat_message_activity
      - $JS.ACK.user_events.chat_account_deleted.>
      - $JS.ACK.message_events.chat_message_activity.>
    subscribe: [_INBOX.voice.chat.>, _INBOX.voice.chat.chat_account_deleted, _INBOX.voice.chat.chat_message_activity]
  file:
    no_response: true
    publish:
      - file.uploaded
      - file.processed
      - file.scan_infected
      - file.expired
      - file.downloaded
      - $JS.API.STREAM.INFO.file_events
    subscribe: [_INBOX.voice.file.>]
  gateway:
    no_response: true
    publish: [analytics.gateway.request, $JS.API.STREAM.INFO.analytics_events]
    subscribe: [_INBOX.voice.gateway.>]
  matchmaking:
    no_response: true
    publish:
      - mm.search_started
      - mm.search_cancelled
      - mm.search_nudge
      - mm.search_timeout
      - mm.match_found
      - mm.match_completed
      - mm.rating_submitted
      - mm.player_banned
      - $JS.API.STREAM.INFO.matchmaking_events
      - $JS.API.CONSUMER.INFO.story_events.matchmaking_story_lfp_v2
      - $JS.ACK.story_events.matchmaking_story_lfp_v2.>
    subscribe: [_INBOX.voice.matchmaking.>, _INBOX.voice.matchmaking.matchmaking_story_lfp_v2]
  messaging:
    no_response: true
    publish:
      - message.sent
      - message.edited
      - message.deleted
      - message.read
      - message.read_receipt_revoked
      - message.reaction_added
      - message.reaction_removed
      - message.mention_added
      - message.pinned
      - message.unpinned
      - message.forwarded
      - message.delivery_ack
      - $JS.API.STREAM.INFO.message_events
      - $JS.API.CONSUMER.INFO.message_events.messaging_delivery_ack
      - $JS.API.CONSUMER.INFO.user_events.messaging_receipt_privacy
      - $JS.ACK.message_events.messaging_delivery_ack.>
      - $JS.ACK.user_events.messaging_receipt_privacy.>
    subscribe: [_INBOX.voice.messaging.>, _INBOX.voice.messaging.messaging_delivery_ack, _INBOX.voice.messaging.messaging_receipt_privacy]
  moderation:
    no_response: true
    publish:
      - moderation.report_created
      - moderation.sanction_applied
      - moderation.appeal_submitted
      - analytics.moderation.report_created
      - analytics.moderation.sanction_applied
      - $JS.API.STREAM.INFO.moderation_events
      - $JS.API.STREAM.INFO.analytics_events
    subscribe: [_INBOX.voice.moderation.>]
  notification:
    no_response: true
    publish:
      - analytics.notification.push_sent
      - $JS.API.STREAM.INFO.analytics_events
      - $JS.API.CONSUMER.INFO.message_events.notif_msg_v2
      - $JS.API.CONSUMER.INFO.matchmaking_events.notif_mm
      - $JS.API.CONSUMER.INFO.voice_events.notif_voice
      - $JS.API.CONSUMER.INFO.story_events.notif_story
      - $JS.API.CONSUMER.INFO.social_events.notif_social
      - $JS.API.CONSUMER.INFO.subscription_events.notif_subscription
      - $JS.API.CONSUMER.INFO.moderation_events.notif_mod
      - $JS.ACK.message_events.notif_msg_v2.>
      - $JS.ACK.matchmaking_events.notif_mm.>
      - $JS.ACK.voice_events.notif_voice.>
      - $JS.ACK.story_events.notif_story.>
      - $JS.ACK.social_events.notif_social.>
      - $JS.ACK.subscription_events.notif_subscription.>
      - $JS.ACK.moderation_events.notif_mod.>
