    subscribe: [_INBOX.voice.space.>, _INBOX.voice.space.space_subscription_entitlement]
  story:
    no_response: true
    publish: [story.created, story.viewed, story.reacted, story.expired, story.highlight_created, story.lfp_created, story.lfp_response, $JS.API.STREAM.INFO.story_events]
    subscribe: [_INBOX.voice.story.>]
  subscription:
    no_response: true
    publish: [subscription.plan_started, subscription.plan_cancelled, subscription.plan_expired, subscription.downgrade, subscription.payment_success, subscription.payment_failed, subscription.space_pro_started, subscription.space_pro_expired, subscription.grace_reminder, subscription.entitlement_changed, analytics.subscription.payment_success, analytics.subscription.payment_failed, $JS.API.STREAM.INFO.subscription_events, $JS.API.STREAM.INFO.analytics_events]
    subscribe: [_INBOX.voice.subscription.>]
  user:
    no_response: true
    publish:
      - user.account_deleted
      - user.profile_created
      - user.profile_updated
      - user.profile_switched
      - user.verified
      - user.presence_changed
      - user.game_detected
      - user.settings_changed
      - user.search_profile_projection
      - $JS.API.STREAM.INFO.user_events
      - $JS.API.STREAM.INFO.user_profile_projection
      - $JS.API.CONSUMER.INFO.user_events.user-account-deletion-v1
      - $JS.API.CONSUMER.MSG.NEXT.user_events.user-account-deletion-v1
      - $JS.ACK.user_events.user-account-deletion-v1.>
    subscribe: [_INBOX.voice.user.>]
  voice:
    no_response: true
    publish: [voice.call_incoming, voice.call_accepted, voice.call_declined, voice.call_missed, voice.call_ended, voice.state_changed, voice.screen_share_started, voice.screen_share_stopped, voice.call_started, voice.member_joined, $JS.API.STREAM.INFO.voice_events]
    subscribe: [_INBOX.voice.voice.>]
