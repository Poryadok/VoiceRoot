      - _INBOX.voice.notification.>
      - _INBOX.voice.notification.message
      - _INBOX.voice.notification.matchmaking
      - _INBOX.voice.notification.voice
      - _INBOX.voice.notification.story
      - _INBOX.voice.notification.social
      - _INBOX.voice.notification.subscription
      - _INBOX.voice.notification.moderation
  realtime:
    no_response: true
    publish:
      - message.delivery_ack
      - $JS.API.STREAM.INFO.message_events
      - $JS.API.CONSUMER.INFO.message_events.rt_realtime1_msg
      - $JS.API.CONSUMER.INFO.chat_events.rt_realtime1_chat
      - $JS.API.CONSUMER.INFO.user_events.rt_realtime1_user
      - $JS.API.CONSUMER.INFO.social_events.rt_realtime1_social
      - $JS.API.CONSUMER.INFO.role_events.rt_realtime1_role
      - $JS.API.CONSUMER.INFO.voice_events.rt_realtime1_voice
      - $JS.API.CONSUMER.INFO.matchmaking_events.rt_realtime1_matchmaking
      - $JS.ACK.message_events.rt_realtime1_msg.>
      - $JS.ACK.chat_events.rt_realtime1_chat.>
      - $JS.ACK.user_events.rt_realtime1_user.>
      - $JS.ACK.social_events.rt_realtime1_social.>
      - $JS.ACK.role_events.rt_realtime1_role.>
      - $JS.ACK.voice_events.rt_realtime1_voice.>
      - $JS.ACK.matchmaking_events.rt_realtime1_matchmaking.>
    subscribe:
      - _INBOX.voice.realtime.>
      - _INBOX.voice.realtime1.message
      - _INBOX.voice.realtime1.chat
      - _INBOX.voice.realtime1.user
      - _INBOX.voice.realtime1.social
      - _INBOX.voice.realtime1.role
      - _INBOX.voice.realtime1.voice
      - _INBOX.voice.realtime1.matchmaking
  role:
    no_response: true
    publish: [role.created, role.updated, role.deleted, role.assigned, role.revoked, role.chat_override_set, role.chat_override_removed, role.voice_override_set, role.voice_override_removed, $JS.API.STREAM.INFO.role_events]
    subscribe: [_INBOX.voice.role.>]
  search:
    no_response: true
    publish:
      - analytics.search.query
      - $JS.API.STREAM.INFO.analytics_events
      - $JS.API.CONSUMER.INFO.message_events.search-indexer-message-v1
      - $JS.API.CONSUMER.INFO.user_events.search-indexer-user-v1
      - $JS.API.CONSUMER.INFO.chat_events.search-indexer-chat-v1
      - $JS.API.CONSUMER.INFO.user_profile_projection.search-user-profile-projection-v1
      - $JS.ACK.message_events.search-indexer-message-v1.>
      - $JS.ACK.user_events.search-indexer-user-v1.>
      - $JS.ACK.chat_events.search-indexer-chat-v1.>
      - $JS.ACK.user_profile_projection.search-user-profile-projection-v1.>
    subscribe:
      - _INBOX.voice.search.>
      - _INBOX.voice.search.indexer.message
      - _INBOX.voice.search.indexer.user
      - _INBOX.voice.search.indexer.chat
      - _INBOX.voice.search.user-projection
  social:
    no_response: true
    publish: [social.friend_request, social.friend_accepted, social.friend_removed, social.user_blocked, social.contacts_synced, $JS.API.STREAM.INFO.social_events]
    subscribe: [_INBOX.voice.social.>]
  space:
    no_response: true
    publish:
      - space.tree_changed
      - space.created
      - space.invite_created
      - space.member_joined
      - space.member_left
      - space.updated
      - space.deleted
      - voice.room_created
      - voice.room_deleted
