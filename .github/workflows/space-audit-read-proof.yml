name: Space audit read integration proof

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/space-audit-read-proof.yml"
      - "src/backend/space/**"
      - "src/backend/gateway/**"
      - "src/backend/pkg/**"
      - "src/backend/migrations/space_db/**"
      - "protos/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to prove
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: space-audit-read-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  space-audit-read-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
      - name: Verify exact source SHA
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: src/backend/space/go.sum
      - name: Prove audit filters, cursor binding and ACL
        working-directory: src/backend/space
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test ./internal/store ./internal/grpcsvc ./internal/lifecycleprincipal -count=1 -json \
            -run '^(TestAuditCursor.*|TestAuditRead.*|TestPublicAuditRead.*|TestAuditTimestampBoundPreservesNanosecondPredicates|TestSpaceStore_ListAuditLogFilteredPage.*|TestSpaceStore_ListAuditLogSignedPage.*|TestGetAuditLog.*)$' \
            | tee "$RUNNER_TEMP/space-audit-read.jsonl"
          python3 - "$RUNNER_TEMP/space-audit-read.jsonl" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          required = {
              "TestGetAuditLog_FiltersCursorAndRevokedAccess",
              "TestGetAuditLog_SignedCursorRejectsCrossSpaceAndAccessScopeReplay",
              "TestGetAuditLog_RoleDependencyFailure_Unavailable",
              "TestSpaceStore_ListAuditLogFilteredPage_BindsSignedSnapshotCursor",
              "TestSpaceStore_ListAuditLogFilteredPage_RejectsCursorReplayAndExpiry",
              "TestSpaceStore_ListAuditLogSignedPage_UsesDatabaseKeyAcrossStoreInstances",
              "TestAuditCursorRejectsIncompleteOrInvalidLifetime",
              "TestAuditCursorRoundTripAndViewerBinding",
              "TestAuditTimestampBoundPreservesNanosecondPredicates",
              "TestPublicAuditReadFiltersACLAndFrozenDisclosure",
              "TestPublicAuditReadRejectsRawActor",
              "TestAuditReadRequiresProtectedListener",
              "TestAuditReadDelegatedPrincipalRejectsTamperingAndRevocation",
          }
          passed = {e.get("Test") for e in events if e.get("Action") == "pass"}
          skipped = {e.get("Test") for e in events if e.get("Action") == "skip"}
          assert not skipped, f"Unexpected skipped audit tests: {skipped}"
          assert required <= passed, f"Missing required passing tests: {required - passed}"
          PY
      - name: Prove REST query mapping and signed caller transport
        working-directory: src/backend/gateway
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test -short -count=1 -json -run '^TestSpaceAuditRead' . \
            | tee "$RUNNER_TEMP/space-audit-rest.jsonl"
          python3 - "$RUNNER_TEMP/space-audit-rest.jsonl" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          required = {"TestSpaceAuditReadStrictQueryAndProtectedBinding", "TestSpaceAuditReadDependencyAndSafeErrors"}
          passed = {e.get("Test") for e in events if e.get("Action") == "pass"}
          assert not any(e.get("Action") == "skip" for e in events)
          assert required <= passed, f"Missing required REST tests: {required - passed}"
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: space-audit-read-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/space-audit-read.jsonl
            ${{ runner.temp }}/space-audit-rest.jsonl
          retention-days: 14
