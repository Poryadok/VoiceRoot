name: NATS retained PVC inspection fixtures

on:
  pull_request:
    paths:
      - 'scripts/staging/nats-retained-pvc-inspection/**'
      - '.github/workflows/nats-retained-pvc-inspection.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/staging/nats-retained-pvc-inspection/**'
      - '.github/workflows/nats-retained-pvc-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-pvc-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Disposable Linux fixtures and reviewed-copy launcher checks
        run: |
          docker run --rm --network none --label voice.task=a1-pvc-inspector \
            --mount type=bind,source="$GITHUB_WORKSPACE/scripts/staging/nats-retained-pvc-inspection",target=/work,readonly \
            python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016 \
            python -I -S /work/test_inspector.py
