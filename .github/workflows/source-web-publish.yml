name: Source-bound Web image publication

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/source-web-publish.yml
      - scripts/dev/publish_candidate.py
      - scripts/dev/publish_candidate_test.py
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact frozen Web source commit
        required: true
        type: string

permissions: {}

concurrency:
  group: source-web-image-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -B scripts/dev/publish_candidate_test.py

  publish:
    name: Publish exact source Web image
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Poryadok/VoiceRoot' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.product_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify immutable Web image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_SHA: ${{ inputs.product_sha }}
          PUBLISHER_SHA: ${{ github.sha }}
        run: python -B publisher/scripts/dev/publish_candidate.py --route web --product-root product --publisher-root publisher --output evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: source-web-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
