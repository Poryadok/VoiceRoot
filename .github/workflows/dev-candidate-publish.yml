          python -B scripts/dev/realtime_p3_public_inputs_test.py
          python -B scripts/dev/story_media_backup_cohort_finalize_test.py
      - name: Verify P3 operator and root handoff fixtures
        run: |
          docker run --rm --network none --user 1000:1000 -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo/scripts/dev golang:1.26-bookworm \
            python3 -B -m unittest realtime_p3_create_only_test
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo/scripts/dev golang:1.26-bookworm \
            python3 -B -m unittest realtime_p3_create_only_packet_test realtime_p3_create_only_socket_test realtime_p3_create_only_source_test realtime_p3_create_only_transport_test realtime_p3_create_only_export_integration_test realtime_p3_missing_issuer_test realtime_p3_root_bundle_test realtime_p3_root_export_test
      - name: Verify encrypted cohort capture and isolated restore chain
        run: bash scripts/ci/story-media-cohort-chain.sh

  publish:
    name: Publish exact DEV candidate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Poryadok/VoiceRoot' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.product_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify immutable candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_SHA: ${{ inputs.product_sha }}
          PUBLISHER_SHA: ${{ github.sha }}
        run: python -B publisher/scripts/dev/publish_candidate.py --product-root product --publisher-root publisher --output evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dev-candidate-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
