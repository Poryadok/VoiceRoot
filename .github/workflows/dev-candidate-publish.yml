name: DEV candidate image publication

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/dev-candidate-publish.yml
      - scripts/dev/publish_candidate.py
      - scripts/dev/publish_candidate_test.py
      - scripts/dev/story-media-pki-issuer/**
      - scripts/dev/story_media_issuer_test.py
      - scripts/dev/story_media_template_test.py
      - scripts/dev/media_initial_admission.py
      - scripts/dev/media_initial_admission_test.py
      - scripts/dev/media_live_baseline.py
      - scripts/dev/media_live_baseline_test.py
      - scripts/dev/media_operation_journal.py
      - scripts/dev/media_operation_journal_test.py
      - scripts/dev/media_operation_guard.py
      - scripts/dev/media_operation_guard_test.py
      - scripts/dev/media_backup_phase.py
      - scripts/dev/media_backup_phase_test.py
      - scripts/dev/media_backup_upload_phase.py
      - scripts/dev/media_backup_upload_phase_test.py
      - scripts/dev/media_backup_upload_run.py
      - scripts/dev/media_backup_upload_run_test.py
      - scripts/dev/media_backup_upload_runner.py
      - scripts/dev/media_backup_upload_runner_test.py
      - scripts/dev/media_backup_capture_operation.py
      - scripts/dev/media_backup_capture_operation_test.py
      - scripts/dev/media_backup_readback.py
      - scripts/dev/media_backup_readback_test.py
      - scripts/dev/media_restore_journal.py
      - scripts/dev/media_restore_journal_test.py
      - scripts/dev/frontend_runtime_adoption.py
      - scripts/dev/frontend_runtime_adoption_test.py
      - scripts/dev/frontend_runtime_executor.py
      - scripts/dev/frontend_runtime_executor_test.py
      - scripts/dev/cohort_backup_phases.py
      - scripts/dev/cohort_backup_phases_test.py
      - scripts/dev/cohort_backup_operation.py
      - scripts/dev/cohort_backup_operation_test.py
      - scripts/dev/cohort_upload_phase.py
      - scripts/dev/cohort_upload_phase_test.py
      - scripts/dev/cohort_upload_run.py
      - scripts/dev/cohort_upload_run_test.py
      - scripts/dev/cohort_upload_runner.py
      - scripts/dev/cohort_upload_runner_test.py
      - scripts/dev/realtime_secret_phase.py
      - scripts/dev/realtime_secret_phase_test.py
      - .github/workflows/dev-cohort-backup-upload.yml
      - scripts/dev/story_media_backup_cohort_finalize.py
      - scripts/dev/story_media_backup_cohort_finalize_test.py
      - .github/workflows/dev-media-backup-upload.yml
      - scripts/dev/story_media_backup_custody.py
      - scripts/dev/resource_fencing.py
      - scripts/dev/update_images.py
      - deploy/templates/story-media-*.yaml
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact selected product commit (publisher commit is separate)
        required: true
        default: 31a04a471c604488bedd5b442039dfdf0434f9c3
        type: string

permissions: {}

concurrency:
  group: dev-candidate-image-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: |
          python -B scripts/dev/publish_candidate_test.py
          python -B scripts/dev/story_media_template_test.py
          python -B scripts/dev/story_media_issuer_test.py
          python -B scripts/dev/media_initial_admission_test.py
          python -B scripts/dev/media_live_baseline_test.py
          python -B scripts/dev/media_operation_journal_test.py
          python -B scripts/dev/media_operation_guard_test.py
          python -B scripts/dev/media_backup_phase_test.py
          python -B scripts/dev/media_backup_upload_phase_test.py
          python -B scripts/dev/media_backup_upload_run_test.py
          python -B scripts/dev/media_backup_upload_runner_test.py
          python -B scripts/dev/media_backup_capture_operation_test.py
          python -B scripts/dev/media_backup_readback_test.py
          python -B scripts/dev/media_restore_journal_test.py
          python -B scripts/dev/frontend_runtime_adoption_test.py
          python -B scripts/dev/frontend_runtime_executor_test.py
          python -B scripts/dev/cohort_backup_phases_test.py
          python -B scripts/dev/cohort_backup_operation_test.py
          python -B scripts/dev/cohort_upload_phase_test.py
          python -B scripts/dev/cohort_upload_run_test.py
          python -B scripts/dev/cohort_upload_runner_test.py
          python -B scripts/dev/realtime_secret_phase_test.py
          python -B scripts/dev/story_media_backup_cohort_finalize_test.py

  publish:
    name: Publish exact DEV candidate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Poryadok/VoiceRoot' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.product_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify immutable candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_SHA: ${{ inputs.product_sha }}
          PUBLISHER_SHA: ${{ github.sha }}
        run: python -B publisher/scripts/dev/publish_candidate.py --product-root product --publisher-root publisher --output evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dev-candidate-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
