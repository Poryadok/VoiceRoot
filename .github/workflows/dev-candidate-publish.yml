          python -B scripts/dev/full_cohort_package_phase_test.py
          python -B scripts/dev/full_cohort_supervisor_test.py
          python -B scripts/dev/full_cohort_image_only_baseline_test.py
          python -B scripts/dev/full_cohort_chat_health_test.py
          python -B scripts/dev/realtime_jwks_publisher_oci_test.py
