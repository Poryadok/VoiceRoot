          python -B scripts/dev/full_cohort_go_migration_cut_test.py
          python -B scripts/dev/cohort_go_role_qualification_test.py
          python -B scripts/dev/full_cohort_config_custody_test.py
          python -B scripts/dev/cohort_unmanaged_actual_test.py
          python -B scripts/dev/full_cohort_inventory_phase_test.py
          python -B scripts/dev/full_cohort_namespace_census_test.py
          python -B scripts/dev/full_cohort_activation_plan_test.py
          python -B scripts/dev/full_cohort_affected_plan_test.py
          python -B scripts/dev/full_cohort_config_custody_test.py
          python -B scripts/dev/full_cohort_predecessor_phase_test.py
          python -B scripts/dev/realtime_secret_phase_test.py
          python -B scripts/dev/realtime_secret_provision_test.py
          python -B scripts/dev/realtime_migration_verify_test.py
          python -B scripts/dev/realtime_migration_job_test.py
          python -B scripts/dev/realtime_migration_cut_joint_test.py
