        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.changes.result == 'success' &&
          needs.changes.outputs.code == 'true' &&
          (
            needs.changes.outputs.compose == 'true' ||
            needs.changes.outputs.frontend == 'true' ||
            needs.changes.outputs.global == 'true' ||
            needs.changes.outputs.ci_global == 'true' ||
            needs.changes.outputs.admin == 'true' ||
            needs.changes.outputs.developer-portal == 'true'
          )
        )
      ) &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: voice-compose-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      VOICE_MINIO_IMAGE: ghcr.io/poryadok/voiceroot/minio:86b2017f06d0d471e8b43abc78031e86756defe3@sha256:ab7687bc47a84c3aec0d9706dabd47b4719b081683cde745f8a1b84c6c7681e0
      VOICE_MINIO_MC_IMAGE: ghcr.io/poryadok/voiceroot/minio-mc:86b2017f06d0d471e8b43abc78031e86756defe3@sha256:66a55c322fed37a3fefa0b815d195b01e7903d1bbffccd80d5a8af3cedf343f2
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
        id: compose_builder
      - name: Expose ephemeral BuildKit cache credentials
        uses: actions/github-script@v8
        with:
          script: |
            for (const key of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_URL"]) {
              const value = process.env[key];
              if (value) {
                core.setSecret(value);
                core.exportVariable(key, value);
              }
            }
      - name: Prepare compose env
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          USER_R2_ENDPOINT=http://host.docker.internal:9000
          USER_R2_REGION=us-east-1
          USER_R2_ACCESS_KEY_ID=voice-minio
          USER_R2_SECRET_ACCESS_KEY=voice-minio-dev
          USER_R2_BUCKET=voice-dev-avatars
          USER_R2_PUBLIC_BASE_URL=http://127.0.0.1:9000/voice-dev-avatars
          FILE_R2_ENDPOINT=http://host.docker.internal:9000
          FILE_R2_REGION=us-east-1
          FILE_R2_ACCESS_KEY_ID=voice-minio
          FILE_R2_SECRET_ACCESS_KEY=voice-minio-dev
          FILE_R2_BUCKET=voice-dev-files
          EOF
      - name: Log in to GHCR for pinned MinIO images
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify effective Compose MinIO images
        run: bash scripts/ci/verify-compose-minio-images.sh
      - name: Start compose infra
        run: docker compose up -d --wait postgres redis nats
      - name: Wait for postgres
        run: bash scripts/ci/wait-postgres-steady.sh "$GITHUB_WORKSPACE"
      - name: Migrate Go-owned databases
        run: make compose-migrate-all
      - name: Generate disposable media principal and TLS fixture
        env:
          PHASE0_MATCHSQUAD_FIXTURE_UID: "65532"
        run: |
          echo "PHASE0_FIXTURE_DIR=$RUNNER_TEMP/voice-space-media-phase0" >> "$GITHUB_ENV"
          python scripts/dev/generate-phase0-fixture.py "$RUNNER_TEMP/voice-space-media-phase0"
      - name: Build current app images with content-addressed preparation cache
        env:
          BUILDX_BUILDER: ${{ steps.compose_builder.outputs.name }}
        run: |
          python3 scripts/ci/compose_build_cache_test.py
          COMPOSE_PARALLEL_LIMIT=4 python3 scripts/ci/compose_build_cache.py \
            --scope voice-compose-linux-amd64-v1 --builder "$BUILDX_BUILDER" -- \
            docker compose -f docker-compose.yml -f docker-compose.voice-space-media.yml -f docker-compose.phase0.yml --profile app
      - name: Start app stack
        run: |
          if COMPOSE_PARALLEL_LIMIT=4 docker compose -f docker-compose.yml -f docker-compose.voice-space-media.yml -f docker-compose.phase0.yml --profile app up -d --no-build; then
            :
          else
            startup_status=$?
            python scripts/ci/t31-startup-diagnostics.py \
            --output "$RUNNER_TEMP/voice-compose-e2e-startup-diagnostics.json" \
            --startup-status "$startup_status" \
            --service voice \
            --include-space-startup \
            --compose docker compose -f docker-compose.yml -f docker-compose.voice-space-media.yml -f docker-compose.phase0.yml --profile app || true
            cat "$RUNNER_TEMP/voice-compose-e2e-startup-diagnostics.json"
            exit "$startup_status"
          fi
      - name: Wait for gateway health
        run: |
          for i in $(seq 1 72); do
            if curl -sf http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 5
          done
          python scripts/ci/t31-startup-diagnostics.py \
            --output "$RUNNER_TEMP/voice-compose-e2e-startup-diagnostics.json" \
            --startup-status 1 \
            --service voice \
            --include-space-startup \
            --compose docker compose -f docker-compose.yml -f docker-compose.voice-space-media.yml -f docker-compose.phase0.yml --profile app || true
          cat "$RUNNER_TEMP/voice-compose-e2e-startup-diagnostics.json"
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            src/backend/gateway/go.sum
            src/backend/notification/go.sum
            src/backend/pkg/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prefetch sqlite3mc native assets
        run: bash scripts/ci/flutter-linux-prefetch-sqlite3.sh host
      - name: Install LiveKit native dependencies for the media proof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopus-dev libopusfile-dev libsoxr-dev pkg-config
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install E2E manifest parser dependency
        run: python3 -m pip install -r scripts/ci/requirements-e2e.txt
      - name: Compose E2E smoke (all features)
        id: compose_e2e_smoke
        env:
          VOICE_RUN_LIVE_COMPOSE: "true"
          VOICE_API_BASE_URL: http://127.0.0.1:18080
          VOICE_AFFECTED_PATHS_JSON: ${{ needs.changes.outputs.affected_paths || '[]' }}
        run: |
          bash scripts/ci/compose-e2e-smoke.sh
          cd src/backend/gateway
          CGO_ENABLED=1 go test -tags=live -count=1 -parallel 1 -timeout 3m -run '^(TestComposeSpaceVoiceRoomBidirectionalAudio_live|TestRequestComposeSpaceVoiceRoomJoin.*|TestRequestComposeJoinToken.*)$' ./...
      - name: Collect sanitized Auth session-floor diagnostics
        id: auth_session_floor_diagnostics
        if: failure() && steps.compose_e2e_smoke.outcome == 'failure'
        run: |
          python3 scripts/ci/auth_session_floor_diagnostics.py \
            --output "$RUNNER_TEMP/voice-auth-session-floor-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/record.json" \
            --compose docker compose -f docker-compose.yml -f docker-compose.voice-space-media.yml -f docker-compose.phase0.yml --profile app
      - name: Upload sanitized Auth session-floor diagnostics
        uses: actions/upload-artifact@v6
        if: always() && steps.auth_session_floor_diagnostics.outcome == 'success'
        with:
          name: auth-session-floor-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voice-auth-session-floor-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/record.json
