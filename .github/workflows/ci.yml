  space-native-installer-integration:
    env:
      GOFLAGS: -mod=readonly
    needs: changes
    if: >-
      (github.event_name == 'pull_request' || ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true')) &&
      needs.changes.result == 'success' &&
      contains(fromJSON(needs.changes.outputs.integration_go_services), 'space')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice-native-installer-ci
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U voice -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Build source-bound Space installer
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          image="voice-ci-native-installer:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --build-arg SOURCE_REVISION="$CANDIDATE_SHA" \
            -f src/backend/space/Dockerfile.native-migrate -t "$image" .
          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/local/bin/native-migrate" "$RUNNER_TEMP/native-migrate"
          docker cp "$container:/usr/local/bin/migrate" "$RUNNER_TEMP/native-migrate-driver"
          chmod 755 "$RUNNER_TEMP/native-migrate" "$RUNNER_TEMP/native-migrate-driver"
          source_sha="$(cd src/backend && find . -type f -name '*.go' ! -name '*_test.go' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          driver_sha="$(sha256sum "$RUNNER_TEMP/native-migrate-driver" | cut -d' ' -f1)"
          cd src/backend/space
          go test ./internal/nativeinstaller/testdata/evidencefailure
          go build -p 2 -trimpath \
            -ldflags="-s -w -X voice/backend/space/internal/nativeinstaller.SourceRevision=$CANDIDATE_SHA -X voice/backend/space/internal/nativeinstaller.BuildSourceSHA256=$source_sha -X voice/backend/space/internal/nativeinstaller.MigrateSHA256=$driver_sha" \
            -o "$RUNNER_TEMP/native-installer-evidencefailure" ./internal/nativeinstaller/testdata/evidencefailure
      - name: Run Space native installer proof
        working-directory: src/backend/space
        env:
          CGO_ENABLED: '0'
          NATIVE_INSTALLER_TEST_ADMIN_URL: postgres://voice:voice-native-installer-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
          NATIVE_INSTALLER_TEST_BINARY: ${{ runner.temp }}/native-migrate
          NATIVE_INSTALLER_TEST_MIGRATE: ${{ runner.temp }}/native-migrate-driver
          NATIVE_INSTALLER_TEST_FAILURE_HELPER: ${{ runner.temp }}/native-installer-evidencefailure
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          go test -json -count=1 -timeout 5m -tags=integration -run '^(TestProductionFreshChainAndRetainedVerify|TestCommittedPhaseFailureNeverAutoResumes)$' ./internal/nativeinstaller > "$RUNNER_TEMP/space-native-installer-events.jsonl"
          result=$?
          set -e
          python3 ../../../scripts/ci/go_integration_matrix.py produce \
            --inventory ../../../scripts/ci/space_native_installer_required.json --service space \
            --candidate "$CANDIDATE_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --events "$RUNNER_TEMP/space-native-installer-events.jsonl" --exit-code "$result" \
            --output "$RUNNER_TEMP/space-native-installer-receipt.json" --reject-skips
      - name: Run Space native45 transition proof
        working-directory: src/backend/space
        env:
          CGO_ENABLED: '0'
          SPACE_NATIVE_ADMIN_URL: postgres://voice:voice-native-installer-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
          SPACE_BAN_TEST_DATABASE_URL: postgres://voice:voice-native-installer-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/space_db?sslmode=disable
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT COALESCE((SELECT oid FROM pg_database WHERE datname='space_db'),0)"
          [[ "$(psql -XAt -v ON_ERROR_STOP=1 "$SPACE_NATIVE_ADMIN_URL" -c "$query")" == 0 ]]
          set +e
          "$RUNNER_TEMP/native-installer-evidencefailure" -at migrated45 \
            -migrations-dir ../migrations/space_db -migrate "$RUNNER_TEMP/native-migrate-driver" \
            > "$RUNNER_TEMP/space-transition45-provision.jsonl" 2> "$RUNNER_TEMP/space-transition45-provision.stderr"
          provision_result=$?
