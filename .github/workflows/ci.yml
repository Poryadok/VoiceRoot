    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/developer-portal/package-lock.json
      - name: npm ci, lint, test
        working-directory: src/developer-portal
        env:
          VITE_OAUTH_CLIENT_ID: voice-developer-portal
          VITE_OAUTH_DISABLED: "false"
          VITE_RUNTIME_CONFIG_REQUIRED: "true"
          CHROME_BIN: google-chrome
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          node ../admin/browser/runtime-config.mjs dist portal
      # PR verification and selected master publication already compile in Docker.
      - name: Build developer-portal without Docker
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'push' || github.ref != 'refs/heads/master' ||
           needs.changes.outputs.run_developer_portal != 'true')
        working-directory: src/developer-portal
        env:
          VITE_OAUTH_CLIENT_ID: voice-developer-portal
          VITE_OAUTH_DISABLED: "false"
        run: npm run build
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          needs.changes.outputs.run_developer_portal == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image base (lowercase)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          needs.changes.outputs.run_developer_portal == 'true'
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build developer-portal image (PR verify)
        if: github.event_name == 'pull_request' || needs.changes.outputs.full_validation == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src/developer-portal
          file: ./src/developer-portal/Dockerfile
          push: false
          build-args: |
            VITE_RUNTIME_CONFIG_REQUIRED=true
            VITE_OAUTH_CLIENT_ID=voice-developer-portal
            VITE_OAUTH_DISABLED=false
          cache-from: type=gha,scope=developer-portal
          cache-to: type=gha,scope=developer-portal,mode=max,ignore-error=true
      - name: Build and push developer-portal image
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          needs.changes.outputs.run_developer_portal == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src/developer-portal
          file: ./src/developer-portal/Dockerfile
          push: true
          build-args: |
            VITE_RUNTIME_CONFIG_REQUIRED=true
            VITE_OAUTH_CLIENT_ID=voice-developer-portal
            VITE_OAUTH_DISABLED=false
          tags: ${{ steps.image.outputs.base }}/developer-portal:${{ github.sha }}
          cache-from: type=gha,scope=developer-portal
          cache-to: type=gha,scope=developer-portal,mode=max,ignore-error=true

  web:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.run_web == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Web image builds Flutter inside Dockerfile; no host SDK needed here.
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          (needs.changes.outputs.run_web == 'true' ||
           needs.changes.outputs.dev_web_publish == 'true')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image base (lowercase)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          (needs.changes.outputs.run_web == 'true' ||
           needs.changes.outputs.dev_web_publish == 'true')
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build web image (PR verify)
        if: github.event_name == 'pull_request' || needs.changes.outputs.full_validation == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: false
          build-args: |
            VOICE_RUNTIME_CONFIG_REQUIRED=true
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true
      - name: Build and push DEV web image
        id: build-dev-web
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          (needs.changes.outputs.run_web == 'true' ||
           needs.changes.outputs.dev_web_publish == 'true')
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          build-args: |
            VOICE_RUNTIME_CONFIG_REQUIRED=true
            SOURCE_REVISION=${{ github.sha }}
          # One build result, two distribution aliases. Promote the canonical
          # web@digest ref itself between environments, not a renamed ref.
          tags: |
            ${{ steps.image.outputs.base }}/web:${{ github.sha }}
            ${{ steps.image.outputs.base }}/dev-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true
      - name: Write DEV web image receipt
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          (needs.changes.outputs.run_web == 'true' ||
           needs.changes.outputs.dev_web_publish == 'true')
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILDX_DIGEST: ${{ steps.build-dev-web.outputs.digest }}
          IMAGE_REF: ${{ steps.image.outputs.base }}/web@${{ steps.build-dev-web.outputs.digest }}
          DISTRIBUTION_ALIAS: ${{ steps.image.outputs.base }}/dev-web@${{ steps.build-dev-web.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os

          receipt = {
              "source_sha": os.environ["SOURCE_SHA"],
              "image": os.environ["IMAGE_REF"],
              "distribution_alias": os.environ["DISTRIBUTION_ALIAS"],
              "buildx_digest": os.environ["BUILDX_DIGEST"],
              "configuration_contract": "voice-web-origin-bound-runtime-v1",
          }
          with open("dev-web-image.json", "w", encoding="utf-8") as output:
              json.dump(receipt, output, indent=2, sort_keys=True)
              output.write("\n")
          PY
      - uses: actions/upload-artifact@v6
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          (needs.changes.outputs.run_web == 'true' ||
           needs.changes.outputs.dev_web_publish == 'true')
        with:
          name: dev-web-image-${{ github.sha }}
          path: dev-web-image.json
          if-no-files-found: error
          retention-days: 14

