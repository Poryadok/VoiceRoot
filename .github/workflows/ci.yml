        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice-lfp-ci
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U voice -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run Story LFP proofs
        working-directory: src/backend/story
        env:
          CGO_ENABLED: '0'
          LFP_TEST_DATABASE_DSN: postgres://voice:voice-lfp-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          go test -json -count=1 -p 1 -timeout 10m ./internal/lfpconsentstore ./internal/lfpconsenttransport > "$RUNNER_TEMP/story-lfp-events.jsonl"
          result=$?
          set -e
          python3 ../../../scripts/ci/go_integration_matrix.py produce \
            --inventory ../../../scripts/ci/story_lfp_required.json --service story \
            --candidate "$CANDIDATE_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --events "$RUNNER_TEMP/story-lfp-events.jsonl" --exit-code "$result" \
            --output "$RUNNER_TEMP/story-lfp-receipt.json" --reject-skips
      - name: Upload Story LFP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-lfp-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/story-lfp-events.jsonl
            ${{ runner.temp }}/story-lfp-receipt.json
          if-no-files-found: warn
          retention-days: 14

