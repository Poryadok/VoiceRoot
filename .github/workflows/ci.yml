name: CI

on:
  pull_request:
    branches: [master, develop, codex/game-sdk-federation-docs, codex/appearance-settings-view, codex/settings-app-icon]
  push:
    branches: [master, develop]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: >-
          auto = path-filtered tier 1 (PR/push) or tier 2 on master push;
          tier3-only = nightly parity (make build-all + integration);
          full = all tiers, all services
        type: choice
        options:
          - auto
          - tier3-only
          - full
        default: auto

concurrency:
  # Nightly/manual checks must not cancel the push run authorizing a release.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  FLUTTER_VERSION: "3.41.7"
  BUF_VERSION: v1.50.0
  GOLANGCI_LINT_MOD: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.1

jobs:
  # --- Path detection (tier 1 / 2); skipped on nightly schedule and tier3-only dispatch ---
  changes:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.profile != 'tier3-only')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      global: ${{ steps.filter.outputs.global }}
      ci_global: ${{ steps.scope.outputs.ci_global }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      nats_renderer: ${{ steps.filter.outputs.nats_renderer }}
      a1_attachment_restart: ${{ steps.filter.outputs.a1_attachment_restart }}
      history_audit: ${{ steps.history.outputs.required }}
      match_squad_overlay: ${{ steps.filter.outputs.match_squad_overlay }}
      dev_web_publish: ${{ steps.filter.outputs.dev_web_publish }}
      a1_e2e: ${{ steps.filter.outputs.a1_e2e }}
      a1_t106_live: ${{ steps.filter.outputs.a1_t106_live }}
      protos: ${{ steps.filter.outputs.protos }}
      pkg: ${{ steps.filter.outputs.pkg }}
      frontend: ${{ steps.filter.outputs.frontend }}
      windows_desktop: ${{ steps.filter.outputs.windows_desktop }}
      auth: ${{ steps.filter.outputs.auth }}
      developer-portal: ${{ steps.filter.outputs.developer-portal }}
      admin: ${{ steps.filter.outputs.admin }}
      compose: ${{ steps.filter.outputs.compose }}
      staging_infra: ${{ steps.filter.outputs.staging_infra }}
      svc_analytics: ${{ steps.filter.outputs.svc_analytics }}
      code: ${{ steps.filter.outputs.code == 'true' || steps.fullrequest.outputs.requested == 'true' }}
      full_application_request: ${{ steps.fullrequest.outputs.requested }}
      go_services: ${{ steps.gomatrix.outputs.go_services }}
      docker_go_services: ${{ steps.gomatrix.outputs.docker_go_services }}
      integration_go_services: ${{ steps.gomatrix.outputs.integration_go_services }}
      run_pkg: ${{ steps.gomatrix.outputs.run_pkg }}
      run_go: ${{ steps.gomatrix.outputs.run_go }}
      build_services: ${{ steps.stagingmatrix.outputs.build_services }}
      build_go_services: ${{ steps.stagingmatrix.outputs.build_go_services }}
      promote_services: ${{ steps.stagingmatrix.outputs.promote_services }}
      all_services: ${{ steps.stagingmatrix.outputs.all_services }}
      needs_full_rollout: ${{ steps.stagingmatrix.outputs.needs_full_rollout }}
      needs_user_space_rollout: ${{ steps.stagingmatrix.outputs.needs_user_space_rollout }}
      ci_only_change: ${{ steps.stagingmatrix.outputs.ci_only_change }}
      run_auth: ${{ steps.stagingmatrix.outputs.run_auth }}
      run_web: ${{ steps.stagingmatrix.outputs.run_web }}
      run_admin: ${{ steps.stagingmatrix.outputs.run_admin }}
      run_developer_portal: ${{ steps.stagingmatrix.outputs.run_developer_portal }}
      run_flutter_tier2: ${{ steps.stagingmatrix.outputs.run_flutter_tier2 }}
      promote_from_sha: ${{ steps.stagingmatrix.outputs.promote_from_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/ci/path-filters.yml
          predicate-quantifier: some-with-excludes
      - name: Validate source-owned full application build request
        id: fullrequest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.filter.outputs.full_application_request == 'true'
        run: python3 scripts/ci/full_application_request.py
      - name: Resolve PR scope without narrowing master obligations
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_GLOBAL: ${{ steps.filter.outputs.ci_global }}
          CI_SCRIPTS: ${{ steps.filter.outputs.ci_scripts }}
        run: |
          if [[ "$EVENT_NAME" != pull_request && "$CI_SCRIPTS" == true ]]; then
            CI_GLOBAL=true
          fi
          echo "ci_global=${CI_GLOBAL}" >> "$GITHUB_OUTPUT"
      - name: Select historical provenance audit
        id: history
        env:
          FILTER_HISTORY: ${{ steps.filter.outputs.history_audit }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          required="${FILTER_HISTORY}"
          case "$PR_HEAD_REF" in
            codex/voice-master-release-*|codex/game-sdk-federation-docs) required=true ;;
          esac
          echo "required=${required}" >> "$GITHUB_OUTPUT"
      - name: Resolve Go service matrix
        id: gomatrix
        env:
          FILTER_JSON: ${{ toJson(steps.filter.outputs) }}
          CI_GLOBAL: ${{ steps.scope.outputs.ci_global }}
          FORCE_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || steps.fullrequest.outputs.requested == 'true' }}
        run: |
          FILTER_JSON="$(jq --arg value "$CI_GLOBAL" '.ci_global = $value' <<< "$FILTER_JSON")"
          export FILTER_JSON
          bash scripts/ci/resolve-go-matrix.sh
      - name: Log in to GHCR (promote manifest check)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve staging image matrix
        id: stagingmatrix
        env:
          FILTER_JSON: ${{ toJson(steps.filter.outputs) }}
          CI_GLOBAL: ${{ steps.scope.outputs.ci_global }}
          GO_SERVICES_JSON: ${{ steps.gomatrix.outputs.go_services }}
          FORCE_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || steps.fullrequest.outputs.requested == 'true' }}
          FILTER_CODE: ${{ steps.filter.outputs.code == 'true' || steps.fullrequest.outputs.requested == 'true' }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          STAGING_FORCE_FULL_ROLLOUT: ${{ vars.STAGING_FORCE_FULL_ROLLOUT }}
          MANIFEST_CHECK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          VOICE_IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          FILTER_JSON="$(jq --arg value "$CI_GLOBAL" '.ci_global = $value' <<< "$FILTER_JSON")"
          export FILTER_JSON
          bash scripts/ci/resolve-staging-matrix.sh

  ci-skip-gate:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only or non-code change; tier-1 CI skipped (see docs-link-check for docs)."

  # --- Tier 1: fast, path-filtered (PR + push) ---
  protobuf:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.protos == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install buf CLI
        run: |
          go install github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Immutable PR Buf baseline regressions
        run: python3 scripts/ci/buf-breaking-pr_test.py
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Buf lint
        run: buf lint
      - name: Buf format (check)
        run: buf format -d --exit-code
      - name: R23 protobuf contract gate
        run: make r23-contract-ci
      - name: Buf breaking (PR vs base)
        if: github.event_name == 'pull_request'
        env:
          VOICE_BUF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VOICE_BUF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VOICE_BUF_MERGE_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/ci/buf-breaking-pr.py
          --base "$VOICE_BUF_BASE_SHA" --head "$VOICE_BUF_HEAD_SHA"
          --merge "$VOICE_BUF_MERGE_SHA"
      - name: Check Auth proto copy sync
        run: bash scripts/ci/check-auth-proto-sync.sh
      - name: Check Go pb codegen drift
        run: bash scripts/ci/buf-go-pb-check.sh

  compose-config:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.compose == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Validate docker compose file
        run: docker compose config --quiet
      - name: Validate Prometheus alert rules
        shell: bash
        run: |
          set -euo pipefail
          rules_dir="$GITHUB_WORKSPACE/deploy/observability/prometheus/rules"
          full_profile="$GITHUB_WORKSPACE/deploy/observability/profiles/full/prometheus-rules.yaml"
          scratch="$RUNNER_TEMP/chat-list-alert-rules"
          mkdir -p "$scratch"
          {
            printf 'groups:\n  - name: voice_alerts_p2\n    rules:\n'
            sed -n '/^      - alert: ChatListEnrichmentFailures$/,/^      - alert:/p' "$rules_dir/alerts-p2.yaml" | sed '$d'
          } > "$scratch/k3s-chat-alerts.yaml"
          {
            printf 'groups:\n  - name: voice_alerts_p2\n    rules:\n'
            sed -n '/^        - alert: ChatListEnrichmentFailures$/,/^        - alert:/p' "$full_profile" | sed '$d; s/^  //'
          } > "$scratch/full-profile-chat-alerts.yaml"
          diff -u "$scratch/k3s-chat-alerts.yaml" "$scratch/full-profile-chat-alerts.yaml"
          docker run --rm --entrypoint /bin/promtool \
            --volume "$rules_dir:/rules:ro" \
            prom/prometheus:v2.54.1 check rules /rules/alerts-p2.yaml
          docker run --rm --entrypoint /bin/promtool \
            --volume "$scratch/full-profile-chat-alerts.yaml:/rules/chat-alerts.yaml:ro" \
            prom/prometheus:v2.54.1 check rules /rules/chat-alerts.yaml
          docker run --rm --entrypoint /bin/promtool \
            --volume "$rules_dir:/rules:ro" \
            --volume "$GITHUB_WORKSPACE/scripts/ci/testdata/chat-list-enrichment-alert-test.yml:/tests/chat-list-enrichment-alert-test.yml:ro" \
            prom/prometheus:v2.54.1 test rules /tests/chat-list-enrichment-alert-test.yml
      - name: Verify PostgreSQL TCP readiness healthcheck
        run: |
          docker pull postgres:18-alpine
          docker pull ghcr.io/jqlang/jq:1.7
          bash scripts/ci/compose-postgres-tcp-readiness_test.sh
      - name: Require NATS JetStream service in compose
        run: bash scripts/ci/compose-nats-jetstream-check.sh
      - name: Verify isolated Social privacy credential bootstrap
        run: bash scripts/ci/social-principal-bootstrap-check.sh
      - name: Staging image matrix unit tests
        run: bash scripts/ci/resolve-staging-matrix_test.sh

  ci-script-tests:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.global == 'true' ||
        needs.changes.outputs.ci_global == 'true' ||
        needs.changes.outputs.ci_scripts == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [policy, runtime, staging, proofs]
    env:
      VOICE_CONTRACT_PROFILE: current
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify compiled source build contract
        if: matrix.shard == 'policy'
        run: python3 scripts/ci/compiled_source_build_test.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Resolve Voice R22 scope base
        env:
          VOICE_CI_EVENT_NAME: ${{ github.event_name }}
          VOICE_CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VOICE_CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="$(bash scripts/ci/resolve-voice-r22-base.sh)"
          echo "VOICE_R22_BASE_SHA=${base_sha}" >> "${GITHUB_ENV}"
          echo "VOICE_CI_PUSH_BEFORE_SHA=${VOICE_CI_PUSH_BEFORE_SHA}" >> "${GITHUB_ENV}"
      - name: CI script regression tests
        run: make ci-script-tests-${{ matrix.shard }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: NATS non-JetStream leaf routing regression
        if: matrix.shard == 'staging'
        working-directory: scripts/staging/nats-leaf-routing-test
        run: go test -count=1 -timeout=90s ./...

  current-diff-contract:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate exact current PR merge and immutable migrations
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/current-diff"
          python3 scripts/ci/current-diff-contract.py --base "$PR_BASE_SHA" \
            --pr-head "$PR_HEAD_SHA" --target "$GITHUB_SHA" \
            > "$RUNNER_TEMP/current-diff/result.json" \
            2> "$RUNNER_TEMP/current-diff/diagnostics.log" || {
              cat "$RUNNER_TEMP/current-diff/diagnostics.log" >&2
              exit 1
            }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: current-diff-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-diff
          retention-days: 14

  voice-history-audit:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'pull_request' && needs.changes.outputs.history_audit == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Full historical provenance and synthetic negative fixtures
        env:
          VOICE_CI_EVENT_NAME: ${{ github.event_name }}
          VOICE_CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VOICE_CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
          VOICE_CONTRACT_PROFILE: full
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/voice-history-audit"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/voice-history-audit/source-sha.txt"
          export VOICE_R22_BASE_SHA="$(bash scripts/ci/resolve-voice-r22-base.sh)"
          bash scripts/ci/voice-db-runtime-provisioning-contract_test.sh \
            2>&1 | tee "$RUNNER_TEMP/voice-history-audit/audit.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: voice-history-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voice-history-audit
          if-no-files-found: error
          retention-days: 14

  match-squad-overlay:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.match_squad_overlay == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: MatchSquad DEV overlay contracts
        run: python3 -B -m unittest scripts.dev.match_squad_overlay_test scripts.dev.match_squad_runtime_overlay_test

  # Partition Flutter's default filesystem discovery by file, preserving
  # concurrency=1 isolation within each independent checkout.
  flutter-unit-plan:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.protos == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prefetch sqlite3mc native assets (host)
        run: bash scripts/ci/flutter-linux-prefetch-sqlite3.sh host
      - name: Prepare canonical Flutter test inventory
        working-directory: src/frontend
        run: |
          flutter pub get
          python3 ../../scripts/ci/flutter_test_shards_test.py
          python3 ../../scripts/ci/flutter_test_shards.py plan --plan "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@v6
        with:
          name: flutter-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error

  flutter-unit-tests:
    needs: [changes, flutter-unit-plan]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.flutter-unit-plan.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.protos == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'full'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prefetch sqlite3mc native assets (host)
        run: bash scripts/ci/flutter-linux-prefetch-sqlite3.sh host
      - uses: actions/download-artifact@v7
        with:
          name: flutter-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-plan
      - name: Flutter unit and widget tests
        working-directory: src/frontend
        run: |
          flutter pub get
          python3 ../../scripts/ci/flutter_test_shards_test.py
          /usr/bin/time -v python3 ../../scripts/ci/flutter_test_shards.py run --plan "$RUNNER_TEMP/flutter-plan/plan.json" --shard-index=${{ matrix.shard }} --receipt "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@v6
        with:
          name: flutter-receipt-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
      - name: Retain failing golden diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-golden-failures-${{ matrix.shard }}-${{ github.sha }}
          path: src/frontend/test/failures
          if-no-files-found: ignore
          retention-days: 7

  flutter-unit-receipts:
    needs: [flutter-unit-plan, flutter-unit-tests]
    if: always() && needs.flutter-unit-plan.result == 'success' && needs.flutter-unit-tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: flutter-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flutter-plan
      - uses: actions/download-artifact@v7
        with:
          pattern: flutter-receipt-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/flutter-receipts
      - name: Verify complete Flutter file partition
        run: python3 scripts/ci/flutter_test_shards.py verify --plan "$RUNNER_TEMP/flutter-plan/plan.json" --receipts "$RUNNER_TEMP/flutter-receipts"

  flutter:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.protos == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install buf CLI
        run: |
          go install github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install protoc_plugin
        run: |
          dart pub global activate protoc_plugin 25.0.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Check Dart protobuf codegen
        run: make buf-dart-check
      - name: Prefetch sqlite3mc native assets (host)
        run: bash scripts/ci/flutter-linux-prefetch-sqlite3.sh host
      - name: Axe web a11y landmark smoke
        run: make a11y-web-axe
      - name: Flutter analyze
        working-directory: src/frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Set up Node for Music decoder browser check
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture Music inline controls
        working-directory: src/frontend
        env:
          VOICE_MUSIC_CAPTURE_DIR: ${{ runner.temp }}/music-capture
        run: timeout 180s flutter test --no-pub --reporter expanded --concurrency=1 test/music_attachment_player_test.dart
      - name: Retain Music inline controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/music-capture/*.png
          if-no-files-found: error
      - name: Install FFmpeg for Music probe fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify Music codecs and E2E local playback in Chrome
        timeout-minutes: 10
        run: timeout 540s bash scripts/ci/music-playback-web.sh
      - name: Retain Music decoder result
        if: always()
        uses: actions/upload-artifact@v4
        with:
