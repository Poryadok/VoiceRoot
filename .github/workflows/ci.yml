            ${{ runner.temp }}/appearance-capture/appearance-v.png
          if-no-files-found: error
          retention-days: 7
      - name: Capture Channel Settings horizontal and vertical views
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/channel-policy-settings'
        working-directory: src/frontend
        env:
          VOICE_CHANNEL_SETTINGS_CAPTURE_DIR: ${{ runner.temp }}/channel-settings-capture
        run: timeout 300s flutter test --no-pub --reporter expanded --concurrency=1 test/channel_settings_capture_test.dart
      - name: Upload Channel Settings horizontal and vertical captures
