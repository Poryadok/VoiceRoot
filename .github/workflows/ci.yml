        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-migration-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/role-migration-events.jsonl
            ${{ runner.temp }}/role-migration-receipt.json
            ${{ runner.temp }}/role-bootstrap-events.jsonl
            ${{ runner.temp }}/role-bootstrap-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Go module source inputs
        if: always() && !cancelled()
        run: python3 scripts/ci/check_go_modules_clean.py

