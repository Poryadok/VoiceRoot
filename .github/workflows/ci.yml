          USER_ASSOCIATION_TEST_DSN: postgres://voice:voice-association-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
