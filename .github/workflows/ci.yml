  golangci:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.run_go == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true'))
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/backend/**/go.sum
      - name: Install golangci-lint
        env:
          GOFLAGS: ''
        run: go install ${{ env.GOLANGCI_LINT_MOD }}
      - name: Add GOBIN to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Resolve Go test dependencies (affected modules)
        run: |
          set -e
          mapfile -t modules < <(echo '${{ needs.changes.outputs.go_services }}' | jq -r '.[]')
          modules=("pkg" "${modules[@]}")
          declare -A seen=()
          for m in "${modules[@]}"; do
            [[ -n "${m}" && -z "${seen[$m]:-}" ]] || continue
            seen[$m]=1
            echo "== resolve ${m} =="
            (cd "src/backend/${m}" && go list -test ./... >/dev/null)
          done
      - name: Lint affected Go modules
        run: |
          set -e
          mapfile -t modules < <(echo '${{ needs.changes.outputs.go_services }}' | jq -r '.[]')
          modules=("pkg" "${modules[@]}")
          declare -A seen=()
          for m in "${modules[@]}"; do
            [[ -n "${m}" && -z "${seen[$m]:-}" ]] || continue
            seen[$m]=1
            echo "== ${m} =="
            (cd "src/backend/${m}" && golangci-lint run ./...)
          done

      - name: Verify Go module source inputs
        if: always() && !cancelled()
        run: python3 scripts/ci/check_go_modules_clean.py

  backend-go-pkg:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.run_pkg == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true'))
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Resolve Go test dependencies (pkg)
        working-directory: src/backend/pkg
        run: go list -test ./... >/dev/null
      - name: Go test shared pkg
        working-directory: src/backend/pkg
        run: go test ./...

      - name: Verify Go module source inputs
        if: always() && !cancelled()
        run: python3 scripts/ci/check_go_modules_clean.py

  nats-hub-config-renderer-image:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      ((github.event_name == 'pull_request' &&
        (needs.changes.outputs.nats_renderer == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.ci_global == 'true')) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.code == 'true') ||
       ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Image base (lowercase)
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build renderer image (PR verify)
        if: github.event_name == 'pull_request' || ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/backend/pkg/cmd/nats-hub-config-renderer/Dockerfile
          push: false
          cache-from: type=gha,scope=nats-hub-config-renderer
          cache-to: type=gha,scope=nats-hub-config-renderer,mode=max,ignore-error=true
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push renderer image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/backend/pkg/cmd/nats-hub-config-renderer/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.base }}/nats-hub-config-renderer:${{ github.sha }}
          cache-from: type=gha,scope=nats-hub-config-renderer
          cache-to: type=gha,scope=nats-hub-config-renderer,mode=max,ignore-error=true

  minio-server-image-publish:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      (needs.changes.outputs.global == 'true' || needs.changes.outputs.a1_e2e == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Image base (lowercase)
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified MinIO server image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/minio/minio.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.base }}/minio:${{ github.sha }}
          cache-from: type=gha,scope=minio-server
          cache-to: type=gha,scope=minio-server,mode=max,ignore-error=true
      - name: Record immutable image digest
        run: echo "Published ${{ steps.image.outputs.base }}/minio:${{ github.sha }} at digest \`${{ steps.build.outputs.digest }}\`." >> "$GITHUB_STEP_SUMMARY"

  backend-go:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.run_go == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true'))
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.go_services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Resolve Go test dependencies (${{ matrix.service }})
        working-directory: src/backend/${{ matrix.service }}
        run: go list -test ./... >/dev/null
      - name: Go test (${{ matrix.service }})
        working-directory: src/backend/${{ matrix.service }}
        env:
          CGO_ENABLED: "0"
        run: go test -short ./...
      - name: Space native maintenance window with real autovacuum
        if: matrix.service == 'space'
        working-directory: src/backend/space
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          cidfile=$(mktemp)
          rm -- "$cidfile"
          cleanup() {
            if [[ -s "$cidfile" ]]; then
              docker rm --force --volumes "$(cat "$cidfile")" >/dev/null
            fi
            rm -f -- "$cidfile"
          }
          trap cleanup EXIT
          docker run -d --cidfile "$cidfile" \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1::5432 \
            postgres@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67 \
            -c autovacuum_naptime=1s -c autovacuum_vacuum_cost_delay=20ms \
            -c autovacuum_vacuum_cost_limit=1 >/dev/null
          cid=$(cat "$cidfile")
          ready=false
          for attempt in {1..30}; do
            if docker exec "$cid" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]]
          port=$(docker port "$cid" 5432/tcp)
          port=${port##*:}
          [[ "$port" =~ ^[0-9]+$ ]]
          export NATIVE_INSTALLER_WINDOW_TEST_ADMIN_URL="postgres://postgres@127.0.0.1:${port}/postgres?sslmode=disable"
          go test -tags=integration ./internal/nativeinstaller -run '^TestMaintenanceWindowWithRealAutovacuum$' -count=1 -timeout=2m -v
      - name: Role native membership authority and invite decisions
        if: matrix.service == 'role'
        working-directory: src/backend/role
        env:
          CGO_ENABLED: "0"
          ROLE_NATIVE_SPACE_SOURCE_ROOT: ${{ github.workspace }}
        run: go test -tags role_space_native -run '^TestMemberAdmissionRole25ProtectedReceipt$' -count=1 -timeout=10m .
      - name: Gateway race detector
        if: matrix.service == 'gateway'
        working-directory: src/backend/gateway
        run: CGO_ENABLED=1 go test -race ./...
      - name: Docker build context and Dockerfile
        id: dockerctx
        if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.docker_go_services), matrix.service)
        shell: bash
        run: |
          S="${{ matrix.service }}"
          if grep -qx "$S" scripts/ci/backend-docker-context.txt; then
            echo "context=./src/backend" >> "$GITHUB_OUTPUT"
          else
            echo "context=./src/backend/$S" >> "$GITHUB_OUTPUT"
          fi
          echo "file=./src/backend/$S/Dockerfile" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.docker_go_services), matrix.service)
      - name: Build ${{ matrix.service }} image (PR verify)
        if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.docker_go_services), matrix.service)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dockerctx.outputs.context }}
          file: ${{ steps.dockerctx.outputs.file }}
          push: false
          cache-from: type=gha,scope=backend-${{ matrix.service }}
          cache-to: type=gha,scope=backend-${{ matrix.service }},mode=max,ignore-error=true

      - name: Verify Go module source inputs
        if: always() && !cancelled()
        run: python3 scripts/ci/check_go_modules_clean.py

  backend-go-integration-pr:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true')) &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.integration_go_services != '[]'
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.integration_go_services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Resolve Go test dependencies (${{ matrix.service }})
        working-directory: src/backend/${{ matrix.service }}
        run: go list -test ./... >/dev/null
      - name: Require Docker for Go integration
        run: docker info >/dev/null
      - name: Install File codec tools
        if: matrix.service == 'file'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg poppler-utils
      - name: Go integration test (${{ matrix.service }})
        working-directory: src/backend/${{ matrix.service }}
        env:
          CGO_ENABLED: "0"
          GIFPROC_REAL_CODEC: '1'
          SERVICE: ${{ matrix.service }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          go test -json -count=1 -timeout 20m ./... > "$RUNNER_TEMP/go-integration-events.jsonl"
          result=$?
          set -e
          python3 ../../../scripts/ci/go_integration_receipts.py \
            --events "$RUNNER_TEMP/go-integration-events.jsonl" --exit-code "$result" \
            --summary "$RUNNER_TEMP/go-integration-summary.json" --service "$SERVICE" \
            --candidate "$CANDIDATE_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Install Gateway live test libraries
        if: matrix.service == 'gateway'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopus-dev libopusfile-dev libsoxr-dev pkg-config
      - name: Gateway live leave diagnostic
        if: matrix.service == 'gateway'
        working-directory: src/backend/gateway
        env:
          CGO_ENABLED: '1'
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          go test -json -count=1 -timeout 5m -tags=live \
            -run '^TestComposeSpaceLeaveDiagnosticPreservesStrictStatus$' . \
            > "$RUNNER_TEMP/gateway-leave-diagnostic-events.jsonl"
          result=$?
          set -e
          python3 ../../../scripts/ci/go_integration_matrix.py produce \
            --inventory ../../../scripts/ci/gateway_leave_diagnostic_required.json --service gateway \
            --candidate "$CANDIDATE_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --events "$RUNNER_TEMP/gateway-leave-diagnostic-events.jsonl" --exit-code "$result" \
            --output "$RUNNER_TEMP/gateway-leave-diagnostic-receipt.json" --reject-skips
      - name: Upload Gateway live diagnostic evidence
        if: always() && matrix.service == 'gateway'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-leave-diagnostic-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gateway-leave-diagnostic-events.jsonl
            ${{ runner.temp }}/gateway-leave-diagnostic-receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Go integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-integration-${{ matrix.service }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-integration-events.jsonl
            ${{ runner.temp }}/go-integration-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Go module source inputs
        if: always() && !cancelled()
        run: python3 scripts/ci/check_go_modules_clean.py

  backend-go-integration-evidence:
    needs: [changes, backend-go-integration-pr]
    if: >-
      !cancelled() && (github.event_name == 'pull_request' || ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true')) &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.integration_go_services != '[]' &&
      needs.backend-go-integration-pr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: go-integration-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-integration-artifacts
      - name: Verify selected Go integration evidence
        env:
          SERVICES: ${{ needs.changes.outputs.integration_go_services }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 scripts/ci/go_integration_matrix.py verify-diagnostics \
            --inventory scripts/ci/go_integration_required.json --services "$SERVICES" \
            --exceptions scripts/ci/go_integration_exceptions.json --source-root "$GITHUB_WORKSPACE" \
            --candidate "$CANDIDATE_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --directory "$RUNNER_TEMP/go-integration-artifacts"

  staging-images-push:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.build_go_services != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.build_go_services) }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify compiled source build contract
        run: python3 scripts/ci/compiled_source_build_test.py
      - name: Docker build context and Dockerfile
        id: dockerctx
        shell: bash
        run: |
          S="${{ matrix.service }}"
          if grep -qx "$S" scripts/ci/backend-docker-context.txt; then
            echo "context=./src/backend" >> "$GITHUB_OUTPUT"
          else
            echo "context=./src/backend/$S" >> "$GITHUB_OUTPUT"
          fi
          echo "file=./src/backend/$S/Dockerfile" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image base (lowercase)
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dockerctx.outputs.context }}
          file: ${{ steps.dockerctx.outputs.file }}
          push: true
          build-args: ${{ contains(fromJSON('["user","realtime","notification"]'), matrix.service) && format('VOICE_SOURCE_SHA={0}', github.sha) || '' }}
          tags: ${{ steps.image.outputs.base }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.service }}
          cache-to: type=gha,scope=backend-${{ matrix.service }},mode=max,ignore-error=true

  staging-images-promote:
    needs: [changes, staging-images-push, full-validation-aggregation]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.full-validation-aggregation.result == 'success' &&
      (needs.staging-images-push.result == 'success' ||
       (needs.staging-images-push.result == 'skipped' && needs.changes.outputs.build_go_services == '[]')) &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.promote_services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.promote_services) }}
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote ${{ matrix.service }}
        env:
          VOICE_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        run: |
          set -eux
          REGISTRY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          BASE="${{ needs.changes.outputs.promote_from_sha }}"
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          export VOICE_IMAGE_REGISTRY="${REGISTRY}"
          export VOICE_IMAGE_BASE_TAG="${BASE}"
          export VOICE_IMAGE_HEAD_TAG="${{ github.sha }}"
          bash scripts/ci/promote-ghcr-images.sh "${{ matrix.service }}"

  staging-stack-lock:
    needs: [changes, staging-images-push, staging-images-promote, nats-hub-config-renderer-image]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.staging-images-push.result != 'failure' &&
      needs.staging-images-push.result != 'cancelled' &&
      needs.staging-images-promote.result != 'failure' &&
      needs.staging-images-promote.result != 'cancelled' &&
      needs.nats-hub-config-renderer-image.result != 'failure' &&
      needs.nats-hub-config-renderer-image.result != 'cancelled' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.ci_only_change != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check staging-go-services.txt drift
        run: |
          set -eux
          bash scripts/ci/generate-staging-go-services.sh
          git diff --exit-code scripts/ci/staging-go-services.txt
      - name: Check staging-image-catalog drift
        run: bash scripts/ci/check-image-catalog-drift.sh
      - name: Reject unexpected image-catalog environment exceptions
        run: python3 scripts/ci/check-image-catalog-drift_test.py
      - name: Render stack lock
        env:
          BUILT_SERVICES: ${{ needs.changes.outputs.build_services }}
          PROMOTED_SERVICES: ${{ needs.changes.outputs.promote_services }}
          VOICE_IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
          VOICE_IMAGE_HEAD_TAG: ${{ github.sha }}
        run: |
          set -eux
          REGISTRY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          export VOICE_IMAGE_REGISTRY="${REGISTRY}"
          export VOICE_IMAGE_HEAD_TAG="${{ github.sha }}"
          bash scripts/ci/render-stack-lock.sh stack.lock.yaml
      - uses: actions/upload-artifact@v6
        with:
          name: staging-stack-lock
          path: stack.lock.yaml
          retention-days: 14

  backend-auth:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.run_auth == 'true' ||
       needs.changes.outputs.auth == 'true' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.auth_test_impact == 'true') ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Node for Auth disposable mail transport fixture
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify disposable mail delivery states
        run: node --test docker/verification-stub/server.test.mjs
      - name: Maven test and Testcontainers report gate (auth)
        run: make auth-test-ci
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          needs.changes.outputs.run_auth == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image base (lowercase)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          needs.changes.outputs.run_auth == 'true'
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build auth image (load)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          needs.changes.outputs.run_auth == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/backend/auth/Dockerfile
          push: false
          load: true
          tags: voice-auth:ci
          build-args: |
            VOICE_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-auth
          cache-to: type=gha,scope=backend-auth,mode=max,ignore-error=true
      - name: Auth container smoke
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          needs.changes.outputs.run_auth == 'true'
        run: bash scripts/ci/auth-container-smoke.sh "$GITHUB_WORKSPACE"
      - name: Push auth image to GHCR
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          needs.changes.outputs.run_auth == 'true'
        run: |
          docker tag voice-auth:ci "${{ steps.image.outputs.base }}/auth:${{ github.sha }}"
          docker push "${{ steps.image.outputs.base }}/auth:${{ github.sha }}"

  backend-auth-image:
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'pull_request' || ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true')) &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.run_auth == 'true' ||
       needs.changes.outputs.auth == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build auth image (PR verify)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/backend/auth/Dockerfile
          push: false
          cache-from: type=gha,scope=backend-auth
          cache-to: type=gha,scope=backend-auth,mode=max,ignore-error=true

  developer-portal:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.changes.outputs.run_developer_portal == 'true' ||
       needs.changes.outputs.developer-portal == 'true' ||
       needs.changes.outputs.global == 'true' ||
       needs.changes.outputs.ci_global == 'true' ||
       ((github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || needs.changes.outputs.full_validation == 'true'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
