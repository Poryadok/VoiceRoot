            --candidate "$CANDIDATE_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --events "$RUNNER_TEMP/user-association-events.jsonl" --exit-code "$result" \
            --output "$RUNNER_TEMP/user-association-receipt.json" --reject-skips
