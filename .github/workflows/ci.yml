        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U voice -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
