name: Compose E2E Live

on:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  FLUTTER_VERSION: "3.41.7"

jobs:
  compose-e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: flutter --version

      - name: Prefetch sqlite3mc native assets
        run: bash scripts/ci/flutter-linux-prefetch-sqlite3.sh host

      - name: Prepare compose avatar store
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          USER_R2_ENDPOINT=http://host.docker.internal:9000
          USER_R2_REGION=us-east-1
          USER_R2_ACCESS_KEY_ID=voice-minio
          USER_R2_SECRET_ACCESS_KEY=voice-minio-dev
          USER_R2_BUCKET=voice-dev-avatars
          USER_R2_PUBLIC_BASE_URL=http://127.0.0.1:9000/voice-dev-avatars
          EOF

      - name: Compose app up
        run: make compose-app-up

      - name: Compose E2E live (full feature coverage)
        run: make compose-e2e-live
