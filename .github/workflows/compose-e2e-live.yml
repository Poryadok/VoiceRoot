name: Compose E2E Live

on:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  FLUTTER_VERSION: "3.41.7"

jobs:
  compose-e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      VOICE_MINIO_IMAGE: ghcr.io/poryadok/voiceroot/minio:86b2017f06d0d471e8b43abc78031e86756defe3@sha256:ab7687bc47a84c3aec0d9706dabd47b4719b081683cde745f8a1b84c6c7681e0
      VOICE_MINIO_MC_IMAGE: ghcr.io/poryadok/voiceroot/minio-mc:86b2017f06d0d471e8b43abc78031e86756defe3@sha256:66a55c322fed37a3fefa0b815d195b01e7903d1bbffccd80d5a8af3cedf343f2
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR for pinned MinIO images
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: flutter --version

      - name: Prefetch sqlite3mc native assets
        run: bash scripts/ci/flutter-linux-prefetch-sqlite3.sh host

      - name: Prepare compose avatar store
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          USER_R2_ENDPOINT=http://host.docker.internal:9000
          USER_R2_REGION=us-east-1
          USER_R2_ACCESS_KEY_ID=voice-minio
          USER_R2_SECRET_ACCESS_KEY=voice-minio-dev
          USER_R2_BUCKET=voice-dev-avatars
          USER_R2_PUBLIC_BASE_URL=http://127.0.0.1:9000/voice-dev-avatars
          EOF

      - name: Compose app up
        run: make compose-app-up

      - name: Compose E2E live (full feature coverage)
        run: make compose-e2e-live
