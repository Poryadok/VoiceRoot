name: Production deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (git SHA or semver release tag; required)"
        required: true
      deploy_mode:
        description: full | app-only | images-only
        required: false
        default: full
      changed_services:
        description: JSON array of changed image names (selective / images-only)
        required: false
        default: "[]"
      needs_full_rollout:
        description: Run full ordered rollout-app-tier (vs selective)
        required: false
        default: "false"
      needs_user_space_rollout:
        description: Run user/space ordered tier rollout
        required: false
        default: "false"
      skip_voice_history_audit:
        description: Explicitly skip the production Voice history audit
        type: boolean
        required: false
        default: false
      skip_voice_history_reason:
        description: Required reason when skipping the Voice history audit
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.image_tag }}
          fetch-depth: 0

      - name: Validate Voice history audit override
        env:
          SKIP_AUDIT: ${{ inputs.skip_voice_history_audit }}
          SKIP_REASON: ${{ inputs.skip_voice_history_reason }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          skip = os.environ['SKIP_AUDIT'] == 'true'
          reason = os.environ['SKIP_REASON'].strip()
          if skip and (not reason or len(reason) > 500 or any(ord(c) < 32 for c in reason)):
              sys.exit('A single-line reason of at most 500 characters is required to skip the audit.')
          if not skip and reason:
              sys.exit('A skip reason requires skip_voice_history_audit to be enabled.')
          if skip:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
                  out.write('### Voice history audit manually skipped\n\n' + reason + '\n')
              print('Voice history audit explicitly skipped; reason recorded in the run summary.')
          PY

      - name: Select Voice history audit
        id: voice_history
        if: ${{ !inputs.skip_voice_history_audit }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          export VOICE_HISTORY_TARGET_SHA="$(git rev-parse HEAD)"
          git show "$GITHUB_SHA:scripts/ci/voice_history_baseline.py" > "$RUNNER_TEMP/voice_history_baseline.py"
          python3 "$RUNNER_TEMP/voice_history_baseline.py"

      - name: Audit production Voice history
        if: ${{ !inputs.skip_voice_history_audit && steps.voice_history.outputs.run_audit != 'false' }}
        env:
          VOICE_CI_EVENT_NAME: workflow_dispatch
          VOICE_CONTRACT_PROFILE: full
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/production-voice-history"
          git rev-parse HEAD > "$RUNNER_TEMP/production-voice-history/source-sha.txt"
          export VOICE_R22_BASE_SHA="$(bash scripts/ci/resolve-voice-r22-base.sh)"
          bash scripts/ci/voice-db-runtime-provisioning-contract_test.sh \
            2>&1 | tee "$RUNNER_TEMP/production-voice-history/audit.log"

      - uses: actions/upload-artifact@v6
        if: ${{ always() && !inputs.skip_voice_history_audit && steps.voice_history.outputs.run_audit != 'false' }}
        with:
          name: production-voice-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-voice-history
          if-no-files-found: error

      - name: Resolve image tag
        id: tag
        run: |
          set -eux
          TAG="${{ inputs.image_tag }}"
          if [ -z "${TAG}" ]; then
            echo "image_tag is required (no default latest on production)." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: azure/setup-kubectl@v5

      - name: Verify production manifest invariants
        run: python3 scripts/prod/prod_infra_invariants_test.py

      - name: Configure kubeconfig
        run: |
          set -eux
          mkdir -p ~/.kube
          echo "${{ secrets.PROD_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify production images in GHCR
        id: verify_image
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          CHANGED_SERVICES_JSON: ${{ inputs.changed_services }}
        run: |
          set -eux
          REGISTRY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          export VOICE_IMAGE_REGISTRY="${REGISTRY}"
          export VOICE_IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export PROD_STACK_LOCK_OUT="${RUNNER_TEMP}/voice-prod-stack.lock.yaml"
          if [ -f "${GITHUB_WORKSPACE}/deploy/prod/stack.lock.yaml" ]; then
            export STACK_LOCK_FILE="${GITHUB_WORKSPACE}/deploy/prod/stack.lock.yaml"
          fi
          bash scripts/prod/verify-prod-images.sh

      - name: Preserve verified production stack lock
        uses: actions/upload-artifact@v6
        with:
          name: production-stack-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.verify_image.outputs.stack_lock_file }}
          if-no-files-found: error

      - name: Apply production manifests
        env:
          PROD_APP_SECRETS_YAML_B64: ${{ secrets.PROD_APP_SECRETS_YAML }}
          PROD_STAFF_TOKEN: ${{ secrets.PROD_STAFF_TOKEN }}
          VOICE_DEVELOPER_PORTAL_INGRESS_HOST: ${{ vars.VOICE_PROD_DEVELOPER_PORTAL_INGRESS_HOST }}
          VOICE_GATEWAY_INGRESS_HOST: ${{ vars.VOICE_PROD_GATEWAY_INGRESS_HOST }}
          VOICE_STORAGE_INGRESS_HOST: ${{ vars.VOICE_PROD_STORAGE_INGRESS_HOST }}
          VOICE_STORAGE_TLS_SECRET: ${{ vars.VOICE_PROD_STORAGE_TLS_SECRET }}
          VOICE_S3_SIGNING_ENDPOINT: ${{ vars.VOICE_PROD_S3_SIGNING_ENDPOINT }}
          VOICE_WEB_INGRESS_HOST: ${{ vars.VOICE_PROD_WEB_INGRESS_HOST }}
          VOICE_ADMIN_INGRESS_HOST: ${{ vars.VOICE_PROD_ADMIN_INGRESS_HOST }}
          VOICE_LIVEKIT_INGRESS_HOST: ${{ vars.VOICE_PROD_LIVEKIT_INGRESS_HOST }}
          VOICE_LIVEKIT_NODE_IP: ${{ vars.VOICE_PROD_LIVEKIT_NODE_IP }}
          VOICE_GATEWAY_TLS_SECRET: ${{ vars.VOICE_PROD_GATEWAY_TLS_SECRET }}
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_PROD_K8S_NAMESPACE }}
          VOICE_IMAGE_PULL_SECRET: ${{ vars.VOICE_PROD_IMAGE_PULL_SECRET }}
          VOICE_APPLY_OBSERVABILITY: ${{ vars.VOICE_PROD_APPLY_OBSERVABILITY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          NOTIFICATIONS_ENABLED: ${{ vars.PROD_ALERTMANAGER_NOTIFICATIONS_ENABLED }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          NEEDS_USER_SPACE_ROLLOUT: ${{ inputs.needs_user_space_rollout }}
          CHANGED_SERVICES: ${{ steps.verify_image.outputs.changed_services }}
        run: |
          set -eux
          source scripts/prod/load-prod-domains.sh
          source scripts/prod/map-prod-env.sh
          REGISTRY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${{ steps.verify_image.outputs.deploy_tag }}"
          if [ -z "${TAG}" ]; then
            TAG="${{ steps.tag.outputs.tag }}"
          fi
          export VOICE_IMAGE_REGISTRY="${REGISTRY}"
          export VOICE_IMAGE_TAG="${TAG}"
          export VOICE_K8S_NAMESPACE="${{ vars.VOICE_PROD_K8S_NAMESPACE }}"
          export DEPLOY_MODE="${{ inputs.deploy_mode }}"
          bash scripts/prod/render-and-apply-prod.sh

      - name: Production smoke (optional)
        if: vars.PROD_SMOKE_ENABLED == 'true'
        env:
          VOICE_GATEWAY_INGRESS_HOST: ${{ vars.VOICE_PROD_GATEWAY_INGRESS_HOST }}
          VOICE_STORAGE_INGRESS_HOST: ${{ vars.VOICE_PROD_STORAGE_INGRESS_HOST }}
          VOICE_S3_SIGNING_ENDPOINT: ${{ vars.VOICE_PROD_S3_SIGNING_ENDPOINT }}
          VOICE_WEB_INGRESS_HOST: ${{ vars.VOICE_PROD_WEB_INGRESS_HOST }}
          VOICE_DEVELOPER_PORTAL_INGRESS_HOST: ${{ vars.VOICE_PROD_DEVELOPER_PORTAL_INGRESS_HOST }}
          VOICE_ADMIN_INGRESS_HOST: ${{ vars.VOICE_PROD_ADMIN_INGRESS_HOST }}
          VOICE_LIVEKIT_INGRESS_HOST: ${{ vars.VOICE_PROD_LIVEKIT_INGRESS_HOST }}
          PROD_STAFF_TOKEN: ${{ secrets.PROD_STAFF_TOKEN }}
        run: |
          set -eux
          source scripts/prod/map-prod-env.sh
          bash scripts/prod/smoke-prod.sh
