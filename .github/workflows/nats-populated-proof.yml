name: NATS populated proof

on:
  pull_request:
    paths:
      - scripts/staging/nats-populated-proof/**
      - .github/workflows/nats-populated-proof.yml
      - deploy/nats/acl-intent.yaml
      - deploy/staging/infra.yaml
      - deploy/staging/services.yaml
      - deploy/nats/leaf-sidecar.template.yaml
      - src/backend/pkg/cmd/nats-hub-config-renderer/**
      - deploy/templates/nats-realtime-bootstrap.yaml
  push:
    branches: [master]
    paths:
      - scripts/staging/nats-populated-proof/**
      - .github/workflows/nats-populated-proof.yml
      - deploy/nats/acl-intent.yaml
      - deploy/staging/infra.yaml
      - deploy/staging/services.yaml
      - deploy/nats/leaf-sidecar.template.yaml
      - src/backend/pkg/cmd/nats-hub-config-renderer/**
      - deploy/templates/nats-realtime-bootstrap.yaml

permissions:
  contents: read

concurrency:
  group: nats-populated-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-populated-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: scripts/staging/nats-populated-proof
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: scripts/staging/nats-populated-proof/go.sum
      - name: Opaque inputs, exact grants, populated delivery and denial checks
        run: go test -count=1 -timeout=90s ./...
      - name: Pinned Docker boundary, retained source and failure cleanup proof
        run: go test -tags=dockerproof -run TestDockerPopulatedProof -count=1 -timeout=4m ./...
