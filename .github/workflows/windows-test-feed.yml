name: Windows test feed tooling

on:
  pull_request:
    paths:
      - 'scripts/release/windows-test-feed/**'
      - '.github/workflows/windows-test-feed.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/release/windows-test-feed/**'
      - '.github/workflows/windows-test-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Test feed tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: scripts/release/windows-test-feed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/release/windows-test-feed/go.mod
          cache: false
      - name: Synthetic package integrity tests (no native installation)
        run: go test ./...
      - name: Static checks
        run: go vet ./...
