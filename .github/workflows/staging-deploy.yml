name: Staging deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: Git SHA image tag
        required: true
        type: string
      deploy_mode:
        description: full | app-only | images-only
        required: false
        type: string
        default: app-only
      changed_services:
        description: JSON array of changed image names
        required: false
        type: string
        default: "[]"
      needs_full_rollout:
        required: false
        type: string
        default: "false"
      needs_user_space_rollout:
        required: false
        type: string
        default: "false"
      nats_storage_class:
        description: "NATS PVC storage class"
        required: false
        type: string
        default: local-path
      nats_storage_size:
        description: "NATS PVC requested capacity"
        required: false
        type: string
        default: 20Gi
      run_smoke:
        description: "Run the staging HTTP smoke after deployment"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (git SHA from CI; required)"
        required: true
      deploy_mode:
        description: full | app-only | images-only
        required: false
        default: app-only
      changed_services:
        description: JSON array of changed image names
        required: false
        default: "[]"
      needs_full_rollout:
        required: false
        default: "false"
      needs_user_space_rollout:
        required: false
        default: "false"
      nats_storage_class:
        description: "NATS PVC storage class"
        required: false
        type: string
        default: local-path
      nats_storage_size:
        description: "NATS PVC requested capacity"
        required: false
        type: string
        default: 20Gi
      run_smoke:
        description: "Run the staging HTTP smoke after deployment"
        required: false
        type: boolean
        default: false

      nats_probe_only:
        description: "Run only a read-only Search NATS JetStream diagnostic"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.nats_probe_only != true
    # Home staging: set STAGING_RUNNER_LABELS=["self-hosted","Linux","X64","voice-staging"]
    # and install the runner on the k3s node (scripts/staging/setup-github-runner.sh).
    runs-on: ${{ vars.STAGING_RUNNER_LABELS != '' && fromJson(vars.STAGING_RUNNER_LABELS) || 'ubuntu-latest' }}
    environment: staging
    steps:
      - name: Download exact staging source archive
        env:
          STAGING_SOURCE_SHA: ${{ inputs.image_tag }}
        shell: bash
        run: &download_staging_source |
          set +x
          set -euo pipefail
          source_sha="${STAGING_SOURCE_SHA:-}"
          if [[ ! "$source_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_INVALID_SHA'
            exit 1
          fi
          source_sha="${source_sha,,}"
          workspace="${GITHUB_WORKSPACE:-}"
          runner_workspace="${RUNNER_WORKSPACE:-}"
          if [[ -z "$workspace" || -z "$runner_workspace" || ! -d "$workspace" || "$workspace" == "/" || "$runner_workspace" == "/" ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_WORKSPACE'
            exit 1
          fi
          workspace="$(cd -- "$workspace" && pwd -P)"
          runner_workspace="$(cd -- "$runner_workspace" && pwd -P)"
          home="$(cd -- "${HOME:-/}" && pwd -P)"
          if [[ "$workspace" == "$runner_workspace" || "$workspace" == "$home" || \
            "$workspace" != "$runner_workspace/"* || "$runner_workspace" == "$home" ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_WORKSPACE'
            exit 1
          fi
          tmp="$(mktemp -d "${RUNNER_TEMP:-/tmp}/voice-staging-source.XXXXXX")"
          trap 'rm -rf -- "$tmp"' EXIT
          tmp="$(cd -- "$tmp" && pwd -P)"
          if [[ "$tmp" == "$workspace" || "$tmp" == "$workspace/"* ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_TEMP_PATH'
            exit 1
          fi
          api="https://api.github.com/repos/Poryadok/VoiceRoot"
          if ! curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 5 --max-time 30 --output "$tmp/commit.json" "$api/commits/$source_sha"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_COMMIT_API'
            exit 1
          fi
          commit_sha="$(jq -er '.sha | select(type == "string")' "$tmp/commit.json" 2>/dev/null || true)"
          tree_sha="$(jq -er '.commit.tree.sha | select(type == "string")' "$tmp/commit.json" 2>/dev/null || true)"
          if [[ "$commit_sha" != "$source_sha" || ! "$tree_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_COMMIT_IDENTITY'
            exit 1
          fi
          if ! curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 5 --max-time 120 --max-filesize 104857600 \
            --output "$tmp/source.tar.gz" "https://codeload.github.com/Poryadok/VoiceRoot/tar.gz/$source_sha"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_DOWNLOAD'
            exit 1
          fi
          expected_root="VoiceRoot-${source_sha}/"
          if ! tar -tzf "$tmp/source.tar.gz" >"$tmp/archive-paths"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE'
            exit 1
          fi
          while IFS= read -r archive_path; do
            if [[ "$archive_path" != "$expected_root"* ]]; then
              echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE_PATH'
              exit 1
            fi
            relative_path="${archive_path#"$expected_root"}"
            if [[ "$relative_path" == *\\* || "$relative_path" == .. || "$relative_path" == ../* || \
              "$relative_path" == */.. || "$relative_path" == */../* ]]; then
              echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE_PATH'
              exit 1
            fi
            case "/$relative_path/" in */.git/*)
              echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE_PATH'
              exit 1
              ;;
            esac
          done <"$tmp/archive-paths"
          if ! tar -tvzf "$tmp/source.tar.gz" >"$tmp/archive-types" || \
            awk 'substr($0, 1, 1) != "-" && substr($0, 1, 1) != "d" { invalid = 1 } END { exit !invalid }' "$tmp/archive-types"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE_TYPE'
            exit 1
          fi
          mkdir "$tmp/source"
          if ! tar -xzf "$tmp/source.tar.gz" -C "$tmp/source" --strip-components=1 --no-same-owner --no-same-permissions; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_EXTRACT'
            exit 1
          fi
          if ! git init -q "$tmp/source"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_TREE_CHECK'
            exit 1
          fi
          preserve_exec_mode="$(git -C "$tmp/source" config --bool core.filemode)"
          if ! (
            cd "$tmp/source"
            while IFS= read -r -d '' file; do
              relative_path="${file#./}"
              blob_sha="$(git hash-object -w --no-filters -- "$file")" || exit 1
              file_mode=100644
              if [[ "$preserve_exec_mode" == true && -x "$file" ]]; then file_mode=100755; fi
              printf '%s %s\t%s\0' "$file_mode" "$blob_sha" "$relative_path"
            done < <(find . -path './.git' -prune -o -type f -print0)
          ) | git -C "$tmp/source" update-index -z --index-info; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_TREE_CHECK'
            exit 1
          fi
          actual_tree="$(git -C "$tmp/source" write-tree 2>/dev/null || true)"
          if [[ "$actual_tree" != "$tree_sha" ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_TREE_MISMATCH'
            exit 1
          fi
          rm -rf -- "$tmp/source/.git"
          find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a -- "$tmp/source/." "$workspace/"
          echo 'STAGING_SOURCE_ARCHIVE=PASS'

      - name: Download stack lock artifact
        if: github.event_name == 'workflow_call'
        uses: actions/download-artifact@v6
        with:
          name: staging-stack-lock
          path: .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: azure/setup-kubectl@v5

      - name: Configure kubectl (direct or SSH tunnel)
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
        run: bash scripts/staging/configure-kubectl-ci.sh

      - name: Verify staging images in GHCR
        id: verify_image
        run: |
          set -eux
          REGISTRY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          export VOICE_IMAGE_REGISTRY="${REGISTRY}"
          export VOICE_IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -f "${GITHUB_WORKSPACE}/stack.lock.yaml" ]; then
            export STACK_LOCK_FILE="${GITHUB_WORKSPACE}/stack.lock.yaml"
          fi
          bash scripts/staging/verify-staging-images.sh

      - name: Preflight staging NATS storage
        if: inputs.deploy_mode == 'full'
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          VOICE_NATS_STORAGE_CLASS: ${{ inputs.nats_storage_class }}
          VOICE_NATS_STORAGE_SIZE: ${{ inputs.nats_storage_size }}
        run: |
          set -euo pipefail
          bash scripts/staging/preflight-nats-pvc.sh

      - name: Ensure MinIO credentials
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          STAGING_MINIO_ROOT_USER: ${{ secrets.STAGING_MINIO_ROOT_USER }}
          STAGING_MINIO_ROOT_PASSWORD: ${{ secrets.STAGING_MINIO_ROOT_PASSWORD }}
        run: bash scripts/staging/ensure-minio-credentials.sh

      - name: Restore principal secrets
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          STAGING_PRINCIPAL_SECRETS_B64: ${{ secrets.STAGING_PRINCIPAL_SECRETS_B64 }}
        run: bash scripts/staging/restore-principal-secrets.sh

      - name: Restore NATS activation secrets
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          STAGING_NATS_SECRETS_B64: ${{ secrets.STAGING_NATS_SECRETS_B64 }}
        run: bash scripts/staging/restore-nats-secrets.sh

      - name: Ensure User search cursor key
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          STAGING_USER_SEARCH_CURSOR_HMAC_KEY: ${{ secrets.STAGING_USER_SEARCH_CURSOR_HMAC_KEY }}
        run: bash scripts/staging/ensure-user-search-projection-secret.sh

      - name: Apply staging manifests
        env:
          STAGING_APP_SECRETS_YAML_B64: ${{ secrets.STAGING_APP_SECRETS_YAML }}
          STAGING_STAFF_TOKEN: ${{ secrets.STAGING_STAFF_TOKEN }}
          VOICE_DEVELOPER_PORTAL_INGRESS_HOST: ${{ vars.VOICE_DEVELOPER_PORTAL_INGRESS_HOST }}
          VOICE_GATEWAY_INGRESS_HOST: ${{ vars.VOICE_GATEWAY_INGRESS_HOST }}
          VOICE_WEB_INGRESS_HOST: ${{ vars.VOICE_WEB_INGRESS_HOST }}
          VOICE_ADMIN_INGRESS_HOST: ${{ vars.VOICE_ADMIN_INGRESS_HOST }}
          VOICE_LIVEKIT_INGRESS_HOST: ${{ vars.VOICE_LIVEKIT_INGRESS_HOST }}
          VOICE_GATEWAY_TLS_SECRET: ${{ vars.VOICE_GATEWAY_TLS_SECRET }}
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          VOICE_IMAGE_PULL_SECRET: ${{ vars.VOICE_IMAGE_PULL_SECRET }}
          VOICE_APPLY_OBSERVABILITY: ${{ vars.VOICE_APPLY_OBSERVABILITY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          NOTIFICATIONS_ENABLED: ${{ vars.STAGING_ALERTMANAGER_NOTIFICATIONS_ENABLED }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          VOICE_NATS_STORAGE_CLASS: ${{ inputs.nats_storage_class }}
          VOICE_NATS_STORAGE_SIZE: ${{ inputs.nats_storage_size }}
          VOICE_NATS_FRESH_INSTALL: "false"
          NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          NEEDS_USER_SPACE_ROLLOUT: ${{ inputs.needs_user_space_rollout }}
        run: |
          set -eux
          source scripts/staging/load-staging-domains.sh
          REGISTRY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${{ steps.verify_image.outputs.deploy_tag }}"
          if [ -z "${TAG}" ] && [ -f "${GITHUB_WORKSPACE}/stack.lock.yaml" ]; then
            TAG="$(grep '^tag:' "${GITHUB_WORKSPACE}/stack.lock.yaml" | awk '{print $2}')"
          fi
          if [ -z "${TAG}" ]; then
            TAG="${{ inputs.image_tag }}"
          fi
          export VOICE_IMAGE_REGISTRY="${REGISTRY}"
          export VOICE_IMAGE_TAG="${TAG}"
          export VOICE_K8S_NAMESPACE="${{ vars.VOICE_K8S_NAMESPACE }}"
          export DEPLOY_MODE="${{ inputs.deploy_mode }}"
          CHANGED_JSON='${{ inputs.changed_services }}'
          export CHANGED_SERVICES="$(echo "${CHANGED_JSON}" | jq -r 'join(",")')"
          # Ordered user/space tier: always for app-only/full; for images-only when user or space changed.
          if [ "${NEEDS_USER_SPACE_ROLLOUT:-false}" != "true" ]; then
            if [ "${DEPLOY_MODE}" != "images-only" ]; then
              export NEEDS_USER_SPACE_ROLLOUT=true
            elif echo ",${CHANGED_SERVICES}," | grep -qE ',user,|,space,'; then
              export NEEDS_USER_SPACE_ROLLOUT=true
            fi
          fi
          bash scripts/staging/render-and-apply.sh

      - name: Staging smoke (optional)
        if: vars.STAGING_SMOKE_ENABLED == 'true' || inputs.run_smoke
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          VOICE_GATEWAY_INGRESS_HOST: ${{ vars.VOICE_GATEWAY_INGRESS_HOST }}
          VOICE_WEB_INGRESS_HOST: ${{ vars.VOICE_WEB_INGRESS_HOST }}
          VOICE_DEVELOPER_PORTAL_INGRESS_HOST: ${{ vars.VOICE_DEVELOPER_PORTAL_INGRESS_HOST }}
          VOICE_ADMIN_INGRESS_HOST: ${{ vars.VOICE_ADMIN_INGRESS_HOST }}
          VOICE_LIVEKIT_INGRESS_HOST: ${{ vars.VOICE_LIVEKIT_INGRESS_HOST }}
          STAGING_STAFF_TOKEN: ${{ secrets.STAGING_STAFF_TOKEN }}
        run: |
          set -eux
          source scripts/staging/load-staging-domains.sh
          export VOICE_STAGING_URL="https://${VOICE_GATEWAY_INGRESS_HOST}"
          bash scripts/staging/smoke-staging.sh

      - name: Observability smoke (optional)
        if: vars.STAGING_OBSERVABILITY_SMOKE_ENABLED == 'true'
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: bash scripts/staging/smoke-observability.sh

  nats-search-jetstream-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.nats_probe_only == true
    runs-on: ${{ vars.STAGING_RUNNER_LABELS != '' && fromJson(vars.STAGING_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 8
    environment: staging
    steps:
      - name: Check staging runner can reach GitHub before checkout
        shell: bash
        run: |
          set +x
          set -euo pipefail
          route=direct
          if [[ -n "${HTTPS_PROXY:-}${https_proxy:-}${ALL_PROXY:-}${all_proxy:-}${HTTP_PROXY:-}${http_proxy:-}" ]]; then
            route=proxy
          fi
          echo "STAGING_RUNNER_GITHUB_ROUTE=${route}"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          required_failed=0
          check_endpoint() {
            local label="$1"
            shift
            local status
            if status="$(curl --silent --show-error --connect-timeout 5 --max-time 12 --output /dev/null --write-out '%{http_code}' "$@" 2>"$error_file")"; then
              echo "STAGING_RUNNER_ENDPOINT_${label}=HTTP_${status}"
              return
            fi
            local failure
            if grep -qiE 'could not resolve proxy|failed to resolve proxy' "$error_file"; then
              failure=PROXY_DNS
            elif grep -qiE 'could not resolve host|failed to resolve host' "$error_file"; then
              failure=GITHUB_DNS
            elif grep -qiE 'timed out|timeout' "$error_file"; then
              failure=TIMEOUT
            elif grep -qi 'failed to connect' "$error_file"; then
              failure=TCP_CONNECT
            else
              failure=TLS_OR_CURL
            fi
            echo "STAGING_RUNNER_ENDPOINT_${label}=FAIL_${failure}"
            if [[ "$label" == API || "$label" == SOURCE_ARCHIVE ]]; then
              required_failed=1
            fi
          }
          # github.com git transport is informational; source acquisition uses
          # the fixed-host immutable codeload archive directly.
          check_endpoint GITHUB_DEFAULT https://github.com/
          check_endpoint GITHUB_IPV4 --ipv4 https://github.com/
          check_endpoint API "https://api.github.com/repos/Poryadok/VoiceRoot/commits/${GITHUB_SHA}"
          check_endpoint RAW "https://raw.githubusercontent.com/Poryadok/VoiceRoot/${GITHUB_SHA}/.gitignore"
          check_endpoint SOURCE_ARCHIVE --head "https://codeload.github.com/Poryadok/VoiceRoot/tar.gz/${GITHUB_SHA}"
          if [[ "$required_failed" == 0 ]]; then
            echo "STAGING_RUNNER_SOURCE_ARCHIVE_CONNECTIVITY=PASS"
          else
            echo "STAGING_RUNNER_SOURCE_ARCHIVE_CONNECTIVITY=FAIL"
            exit 1
          fi

      - name: Download exact staging source archive
        env:
          STAGING_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: *download_staging_source

      - uses: azure/setup-kubectl@v5

      - name: Configure kubectl (direct or SSH tunnel)
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
        run: bash scripts/staging/configure-kubectl-ci.sh

      - name: Probe Search JetStream INFO permission (read-only)
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          PROBE_JOB_NAME: voice-nats-search-probe-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +x
          set -euo pipefail
          kctl() { kubectl --request-timeout=8s "$@"; }
          fail_probe() {
            printf 'NATS_SEARCH_JS_INFO=FAIL STAGE_%s\n' "$1"
            exit 1
          }
          namespace="${VOICE_K8S_NAMESPACE:-voice-staging}"
          [ "$namespace" = voice-staging ] || fail_probe NAMESPACE_INPUT
          [[ "$PROBE_JOB_NAME" =~ ^voice-nats-search-probe-[0-9]+-[0-9]+$ ]] || fail_probe JOB_NAME_INPUT

          kctl get namespace voice-staging >/dev/null 2>&1 || fail_probe NAMESPACE_LOOKUP
          kctl get secret voice-nats-service-credentials -n voice-staging --output=name >/dev/null 2>&1 || fail_probe SEARCH_SECRET_LOOKUP
          kctl get service voice-nats -n voice-staging -o json 2>/dev/null | \
            jq -e 'any(.spec.ports[]?; .name == "client" and .port == 4222 and .targetPort == 4222)' >/dev/null 2>&1 || fail_probe HUB_SERVICE_CLIENT_PORT
          kctl get networkpolicy voice-nats-hub-ingress -n voice-staging -o json 2>/dev/null | \
            jq -e 'any(.spec.ingress[]?; any(.from[]?.podSelector.matchExpressions[]?; .key == "app" and .operator == "In" and any(.values[]?; . == "voice-nats-search-bootstrap")) and any(.ports[]?; .protocol == "TCP" and .port == 4222))' >/dev/null 2>&1 || fail_probe HUB_NETWORK_POLICY
          kctl get deployment voice-search -n voice-staging -o json 2>/dev/null | \
            jq -e '
              .spec.template.spec as $pod |
              any($pod.containers[]?;
                .name == "nats-leaf" and .image == "nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb" and
                .args == ["-c", "/etc/nats/leaf.conf"] and
                any(.env[]?; .name == "NATS_CREDS" and .value == "/var/run/nats/creds/search.creds") and
                any(.volumeMounts[]?; .mountPath == "/var/run/nats/creds/search.creds" and .subPath == "search.creds" and .readOnly == true) and
                any(.volumeMounts[]?; .mountPath == "/etc/nats/leaf.conf" and .subPath == "leaf.conf" and .readOnly == true) and
                any(.volumeMounts[]?; .mountPath == "/etc/nats/tls/ca.crt" and .subPath == "ca.crt" and .readOnly == true)
              ) and
              any($pod.volumes[]?; .name == "nats-service-creds" and .secret.secretName == "voice-nats-service-credentials" and any(.secret.items[]?; .key == "search.creds" and .path == "search.creds")) and
              any($pod.volumes[]?; .name == "nats-hub-tls" and .secret.secretName == "voice-nats-hub-tls" and any(.secret.items[]?; .key == "ca.crt" and .path == "ca.crt")) and
              any($pod.volumes[]?; .name == "nats-leaf-config" and .configMap.name == "voice-nats-leaf-config")
            ' >/dev/null 2>&1 || fail_probe SEARCH_LEAF_DEPLOYMENT

          cleanup() {
            trap - EXIT
            if kctl delete job "$PROBE_JOB_NAME" -n voice-staging --ignore-not-found=true --wait=true --timeout=30s >/dev/null 2>&1; then
              printf '%s\n' 'NATS_SEARCH_JS_CLEANUP=PASS'
            else
              printf '%s\n' 'NATS_SEARCH_JS_CLEANUP=FAIL'
              exit 1
            fi
          }
          trap cleanup EXIT

          kctl create -f - >/dev/null 2>&1 <<EOF || fail_probe JOB_CREATE
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $PROBE_JOB_NAME
            namespace: voice-staging
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 90
            ttlSecondsAfterFinished: 600
            template:
              metadata:
                labels:
                  app: voice-nats-search-bootstrap
                  voice.nats/probe: search-jetstream-info
              spec:
                automountServiceAccountToken: false
                restartPolicy: Never
                containers:
                  - name: probe
                    image: natsio/nats-box:0.18.0
                    command: ["/bin/sh", "-ceu"]
                    args:
                      - |
                        set +x
                        umask 077
                        tmp="$(mktemp -d)"
                        trap 'rm -rf "$tmp"' EXIT
                        response="$tmp/response.json"
                        stderr="$tmp/stderr.txt"
                        if nats --server nats://voice-nats:4222 --creds /var/run/nats/creds/search.creds --inbox-prefix _INBOX.voice.search req --raw --timeout 5s '$JS.API.CONSUMER.INFO.message_events.search-indexer-message-v1' '' >"$response" 2>"$stderr"; then
                          if jq -e '(.error | not) and .config.durable_name == "search-indexer-message-v1"' "$response" >/dev/null 2>&1; then
                            echo "NATS_SEARCH_JS_INFO=PASS"
                            exit 0
                          fi
                        fi
                        details="$(jq -r '.error.description // empty' "$response" 2>/dev/null || true) $(<"$stderr")"
                        if printf '%s' "$details" | grep -Eqi 'jetstream[^[:cntrl:]]*(not enabled|disabled)|not enabled[^[:cntrl:]]*jetstream'; then
                          category=JETSTREAM_DISABLED
                        elif printf '%s' "$details" | grep -Eqi 'permission|authorization|not authorized|unauthorized|forbidden'; then
                          category=PERMISSION_DENIED
                        elif printf '%s' "$details" | grep -Eqi 'timed out|timeout|no responders'; then
                          category=TIMEOUT
                        else
                          category=OTHER
                        fi
                        printf 'NATS_SEARCH_JS_INFO=FAIL %s\n' "$category"
                        exit 1
                    volumeMounts:
                      - name: search-service-creds
                        mountPath: /var/run/nats/creds/search.creds
                        subPath: search.creds
                        readOnly: true
                volumes:
                  - name: search-service-creds
                    secret:
                      secretName: voice-nats-service-credentials
                      defaultMode: 0400
                      items:
                        - key: search.creds
                          path: search.creds
          EOF

          conditions=""
          probe_complete=false
          for attempt in $(seq 1 60); do
            conditions="$(kctl get job "$PROBE_JOB_NAME" -n voice-staging -o json 2>/dev/null | jq -r '[.status.conditions[]? | select((.type == "Complete" or .type == "Failed") and .status == "True") | .type] | first // empty' 2>/dev/null || true)"
            if [ "$conditions" = Complete ] || [ "$conditions" = Failed ]; then
              probe_complete=true
              break
            fi
            sleep 2
          done
          [ "$probe_complete" = true ] || fail_probe JOB_TIMEOUT
          result="$(kctl logs "job/$PROBE_JOB_NAME" -n voice-staging -c probe --tail=1 2>/dev/null || true)"
          case "$result" in
            NATS_SEARCH_JS_INFO=PASS)
              [ "$conditions" = Complete ] || fail_probe JOB_STATUS_MISMATCH
              printf '%s\n' "$result"
              ;;
            "NATS_SEARCH_JS_INFO=FAIL JETSTREAM_DISABLED"|"NATS_SEARCH_JS_INFO=FAIL PERMISSION_DENIED"|"NATS_SEARCH_JS_INFO=FAIL TIMEOUT"|"NATS_SEARCH_JS_INFO=FAIL OTHER")
              [ "$conditions" = Failed ] || fail_probe JOB_STATUS_MISMATCH
              printf '%s\n' "$result"
              exit 1
              ;;
            *)
              fail_probe JOB_RESULT
              ;;
          esac
