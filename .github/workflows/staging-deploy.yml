name: Staging deploy

on:
  workflow_call:
    inputs:
      rollback_operation:
        description: Latest successful images-only operation to roll back with a fresh cut
        required: false
        type: string
        default: ""
      image_tag:
        description: Git SHA image tag
        required: true
        type: string
      deploy_mode:
        description: full | app-only | images-only
        required: false
        type: string
        default: app-only
      changed_services:
        description: JSON array of changed image names
        required: false
        type: string
        default: "[]"
      needs_full_rollout:
        required: false
        type: string
        default: "false"
      needs_user_space_rollout:
        required: false
        type: string
        default: "false"
      nats_storage_class:
        description: "NATS PVC storage class"
        required: false
        type: string
        default: local-path
      nats_storage_size:
        description: "NATS PVC requested capacity"
        required: false
        type: string
        default: 20Gi
      run_smoke:
        description: "Run the staging HTTP smoke after deployment"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rollback_operation:
        description: Latest successful images-only operation to roll back with a fresh cut
        required: false
        type: string
        default: ""
      image_tag:
        description: "Image tag (git SHA from CI; required)"
        required: true
      deploy_mode:
        description: full | app-only | images-only
        required: false
        default: app-only
      changed_services:
        description: JSON array of changed image names
        required: false
        default: "[]"
      needs_full_rollout:
        required: false
        default: "false"
      needs_user_space_rollout:
        required: false
        default: "false"
      nats_storage_class:
        description: "NATS PVC storage class"
        required: false
        type: string
        default: local-path
      nats_storage_size:
        description: "NATS PVC requested capacity"
        required: false
        type: string
        default: 20Gi
      run_smoke:
        description: "Run the staging HTTP smoke after deployment"
        required: false
        type: boolean
        default: false

      nats_probe_only:
        description: "Run only a read-only Search NATS JetStream diagnostic"
        required: false
        type: boolean
        default: false

      validate_app_secret_only:
        description: "Validate the uploaded staging app Secret without cluster access"
        required: false
        type: boolean
        default: false

      mail_only:
        description: "Patch only Auth mail fields and restart Auth"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: voice-staging-maintenance
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || (inputs.nats_probe_only != true && inputs.validate_app_secret_only != true && inputs.mail_only != true)
    # Home staging: set STAGING_RUNNER_LABELS=["self-hosted","Linux","X64","voice-staging"]
    # and install the runner on the k3s node (scripts/staging/setup-github-runner.sh).
    runs-on: [self-hosted, Linux, X64, voice-staging]
    environment: staging
    steps:
      - name: Download exact staging source archive
        env:
          STAGING_SOURCE_SHA: ${{ inputs.image_tag }}
        shell: bash
        run: &download_staging_source |
          set +x
          set -euo pipefail
          source_sha="${STAGING_SOURCE_SHA:-}"
          if [[ ! "$source_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_INVALID_SHA'
            exit 1
          fi
          source_sha="${source_sha,,}"
          workspace="${GITHUB_WORKSPACE:-}"
          runner_workspace="${RUNNER_WORKSPACE:-}"
          if [[ -z "$workspace" || -z "$runner_workspace" || ! -d "$workspace" || "$workspace" == "/" || "$runner_workspace" == "/" ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_WORKSPACE'
            exit 1
          fi
          workspace="$(cd -- "$workspace" && pwd -P)"
          runner_workspace="$(cd -- "$runner_workspace" && pwd -P)"
          home="$(cd -- "${HOME:-/}" && pwd -P)"
          if [[ "$workspace" == "$runner_workspace" || "$workspace" == "$home" || \
            "$workspace" != "$runner_workspace/"* || "$runner_workspace" == "$home" ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_WORKSPACE'
            exit 1
          fi
          tmp="$(mktemp -d "${RUNNER_TEMP:-/tmp}/voice-staging-source.XXXXXX")"
          trap 'rm -rf -- "$tmp"' EXIT
          tmp="$(cd -- "$tmp" && pwd -P)"
          if [[ "$tmp" == "$workspace" || "$tmp" == "$workspace/"* ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_TEMP_PATH'
            exit 1
          fi
          api="https://api.github.com/repos/Poryadok/VoiceRoot"
          if ! curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 5 --max-time 30 --output "$tmp/commit.json" "$api/commits/$source_sha"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_COMMIT_API'
            exit 1
          fi
          commit_sha="$(jq -er '.sha | select(type == "string")' "$tmp/commit.json" 2>/dev/null || true)"
          tree_sha="$(jq -er '.commit.tree.sha | select(type == "string")' "$tmp/commit.json" 2>/dev/null || true)"
          if [[ "$commit_sha" != "$source_sha" || ! "$tree_sha" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_COMMIT_IDENTITY'
            exit 1
          fi
          if ! curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 5 --max-time 120 --max-filesize 104857600 \
            --output "$tmp/source.tar.gz" "https://codeload.github.com/Poryadok/VoiceRoot/tar.gz/$source_sha"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_DOWNLOAD'
            exit 1
          fi
          expected_root="VoiceRoot-${source_sha}/"
          if ! tar -tzf "$tmp/source.tar.gz" >"$tmp/archive-paths"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE'
            exit 1
          fi
          while IFS= read -r archive_path; do
            if [[ "$archive_path" != "$expected_root"* ]]; then
              echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE_PATH'
              exit 1
            fi
            relative_path="${archive_path#"$expected_root"}"
            if [[ "$relative_path" == *\\* || "$relative_path" == .. || "$relative_path" == ../* || \
              "$relative_path" == */.. || "$relative_path" == */../* ]]; then
              echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE_PATH'
              exit 1
            fi
            case "/$relative_path/" in */.git/*)
              echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE_PATH'
              exit 1
              ;;
            esac
          done <"$tmp/archive-paths"
          if ! tar -tvzf "$tmp/source.tar.gz" >"$tmp/archive-types" || \
            awk 'substr($0, 1, 1) != "-" && substr($0, 1, 1) != "d" { invalid = 1 } END { exit !invalid }' "$tmp/archive-types"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_ARCHIVE_TYPE'
            exit 1
          fi
          mkdir "$tmp/source"
          if ! tar -xzf "$tmp/source.tar.gz" -C "$tmp/source" --strip-components=1 --no-same-owner --no-same-permissions; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_EXTRACT'
            exit 1
          fi
          if ! git init -q "$tmp/source"; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_TREE_CHECK'
            exit 1
          fi
          preserve_exec_mode="$(git -C "$tmp/source" config --bool core.filemode)"
          if ! (
            cd "$tmp/source"
            while IFS= read -r -d '' file; do
              relative_path="${file#./}"
              blob_sha="$(git hash-object -w --no-filters -- "$file")" || exit 1
              file_mode=100644
              if [[ "$preserve_exec_mode" == true && -x "$file" ]]; then file_mode=100755; fi
              printf '%s %s\t%s\0' "$file_mode" "$blob_sha" "$relative_path"
            done < <(find . -path './.git' -prune -o -type f -print0)
          ) | git -C "$tmp/source" update-index -z --index-info; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_TREE_CHECK'
            exit 1
          fi
          actual_tree="$(git -C "$tmp/source" write-tree 2>/dev/null || true)"
          if [[ "$actual_tree" != "$tree_sha" ]]; then
            echo 'STAGING_SOURCE_ARCHIVE=FAIL_TREE_MISMATCH'
            exit 1
          fi
          rm -rf -- "$tmp/source/.git"
          find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a -- "$tmp/source/." "$workspace/"
          echo 'STAGING_SOURCE_ARCHIVE=PASS'

      - name: Download stack lock artifact
        if: github.event_name == 'workflow_call'
        uses: actions/download-artifact@v6
        with:
          name: staging-stack-lock
          path: .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: azure/setup-kubectl@v5

      - name: Prepare cold backup and isolated proof using installed root bridge
        id: preservation
        env:
          VOICE_NATS_ROLLOUT_OPERATION: ""
          ROLLOUT_ROLLBACK_OPERATION: ${{ inputs.rollback_operation }}
          VOICE_IMAGE_REGISTRY: ghcr.io/poryadok/voiceroot
          VOICE_IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          ROLLOUT_CHANGED_JSON: ${{ inputs.changed_services }}
          ROLLOUT_NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          ROLLOUT_BOUND_CHANGED_SERVICES: ""
          VOICE_NATS_ACL_PROOF_SHA: ${{ vars.VOICE_NATS_ACL_PROOF_SHA }}
          VOICE_NATS_ACL_PROOF_GENERATION: ${{ vars.VOICE_NATS_ACL_PROOF_GENERATION }}
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLOUT_ARTIFACT_ID: ""
          ROLLOUT_CLAIM_RV: ""
          ROLLOUT_ACTION: --bridge-prepare
        run: &protected_rollout_runner |
          set +x
          set -euo pipefail
          export CHANGED_SERVICES="$(printf '%s' "$ROLLOUT_CHANGED_JSON" | jq -er 'if type == "array" and all(.[]; type == "string" and test("^[a-z0-9-]+$")) then join(",") else error("invalid") end')"
          if [[ -n "${VOICE_NATS_ROLLOUT_OPERATION:-}" ]]; then export CHANGED_SERVICES="${ROLLOUT_BOUND_CHANGED_SERVICES}"; fi
          python3 -I -S - <<'PY'
          import hashlib, json, os, pathlib, re, runpy, stat, sys
          op=os.environ.get('VOICE_NATS_ROLLOUT_OPERATION','')
          action=os.environ['ROLLOUT_ACTION']
          bridge_action=action.startswith('--bridge-')
          if not bridge_action and not re.fullmatch(r'[a-f0-9]{12}',op):raise SystemExit('NATS_ROLLOUT=AUTHORIZATION_REQUIRED')
          code=pathlib.Path('/var/lib/voice-nats-preservation')/('installed' if bridge_action else 'rollout-'+op)/'code'
          for directory in (*code.parents[::-1],code):
              st=directory.lstat()
              if not stat.S_ISDIR(st.st_mode) or st.st_uid!=0 or st.st_mode&0o022:raise SystemExit('NATS_ROLLOUT=UNTRUSTED_CODE')
          def read(path,limit):
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  st=os.fstat(fd)
                  if not stat.S_ISREG(st.st_mode) or st.st_uid!=0 or st.st_mode&0o022 or st.st_nlink!=1 or not 1<=st.st_size<=limit:raise SystemExit('NATS_ROLLOUT=UNTRUSTED_CODE')
                  raw=os.read(fd,st.st_size+1)
                  if len(raw)!=st.st_size:raise SystemExit('NATS_ROLLOUT=CHANGED_CODE')
                  return raw
              finally:os.close(fd)
          manifest=json.loads(read(code/'capture-manifest.json',65536))
          if not isinstance(manifest,dict) or not 1<=len(manifest)<=64:raise SystemExit('NATS_ROLLOUT=UNTRUSTED_CODE')
          for relative,wanted in manifest.items():
              part=pathlib.Path(relative)
              if part.is_absolute() or '..' in part.parts or not isinstance(wanted,str) or not re.fullmatch(r'[a-f0-9]{64}',wanted):raise SystemExit('NATS_ROLLOUT=UNTRUSTED_CODE')
              path=code/part
              for directory in (path.parent,*path.parent.parents):
                  st=directory.lstat()
                  if not stat.S_ISDIR(st.st_mode) or st.st_uid!=0 or st.st_mode&0o022:raise SystemExit('NATS_ROLLOUT=UNTRUSTED_CODE')
                  if directory==code:break
              if hashlib.sha256(read(path,16<<20)).hexdigest()!=wanted:raise SystemExit('NATS_ROLLOUT=CHANGED_CODE')
          entry='nats-rollout-preservation/bridge_client.py' if bridge_action else 'nats-rollout-preservation/workflow_entry.py'
          if entry not in manifest:raise SystemExit('NATS_ROLLOUT=UNTRUSTED_CODE')
          if action=='--bridge-prepare':
              prior=os.environ.get('ROLLOUT_ROLLBACK_OPERATION','')
              mode=os.environ['DEPLOY_MODE']
              changed=set(filter(None,os.environ['CHANGED_SERVICES'].split(',')))
              if mode=='app-only' and os.environ.get('ROLLOUT_NEEDS_FULL_ROLLOUT')=='false' and changed and changed<={'web','admin','developer-portal'}:mode='images-only'
              arguments=['prepare-rollback',prior,os.environ['GITHUB_RUN_ID']] if prior else ['prepare',mode,os.environ['CHANGED_SERVICES'],os.environ['VOICE_IMAGE_TAG'],os.environ['GITHUB_RUN_ID']]
          elif action=='--bridge-authorize':arguments=['authorize',op,os.environ['ROLLOUT_ARTIFACT_ID']]
          elif action=='--bridge-finish':arguments=['finish',op,os.environ['ROLLOUT_CLAIM_RV']]
          elif action=='--bridge-status':arguments=['status',op]
          elif bridge_action:raise SystemExit('NATS_ROLLOUT=ACTION_INVALID')
          else:arguments=[action]
          sys.argv=[str(code/entry),*arguments]
          runpy.run_path(str(code/entry),run_name='__main__')
          PY

      - name: Upload encrypted backup to off-node GitHub custody
        id: encrypted_backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.preservation.outputs.artifact_name }}
          path: ${{ steps.preservation.outputs.cipher_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Verify complete off-node ciphertext readback and authorize paused apply
        env:
          VOICE_NATS_ROLLOUT_OPERATION: ${{ steps.preservation.outputs.operation }}
          ROLLOUT_ROLLBACK_OPERATION: ${{ inputs.rollback_operation }}
          VOICE_IMAGE_REGISTRY: ghcr.io/poryadok/voiceroot
          VOICE_IMAGE_TAG: ${{ steps.preservation.outputs.source_sha || inputs.image_tag }}
          DEPLOY_MODE: ${{ steps.preservation.outputs.deploy_mode || inputs.deploy_mode }}
          ROLLOUT_CHANGED_JSON: ${{ inputs.changed_services }}
          ROLLOUT_NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          ROLLOUT_BOUND_CHANGED_SERVICES: ${{ steps.preservation.outputs.changed_services }}
          VOICE_NATS_ACL_PROOF_SHA: ${{ vars.VOICE_NATS_ACL_PROOF_SHA }}
          VOICE_NATS_ACL_PROOF_GENERATION: ${{ vars.VOICE_NATS_ACL_PROOF_GENERATION }}
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLOUT_ARTIFACT_ID: ${{ steps.encrypted_backup.outputs.artifact-id }}
          ROLLOUT_CLAIM_RV: ""
          ROLLOUT_ACTION: --bridge-authorize
        run: *protected_rollout_runner

      - name: Configure kubectl using protected captured code
        env:
          VOICE_NATS_ROLLOUT_OPERATION: ${{ steps.preservation.outputs.operation }}
          ROLLOUT_ROLLBACK_OPERATION: ${{ inputs.rollback_operation }}
          VOICE_IMAGE_REGISTRY: ghcr.io/poryadok/voiceroot
          VOICE_IMAGE_TAG: ${{ steps.preservation.outputs.source_sha || inputs.image_tag }}
          DEPLOY_MODE: ${{ steps.preservation.outputs.deploy_mode || inputs.deploy_mode }}
          ROLLOUT_CHANGED_JSON: ${{ inputs.changed_services }}
          ROLLOUT_NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          ROLLOUT_BOUND_CHANGED_SERVICES: ${{ steps.preservation.outputs.changed_services }}
          VOICE_NATS_ACL_PROOF_SHA: ${{ vars.VOICE_NATS_ACL_PROOF_SHA }}
          VOICE_NATS_ACL_PROOF_GENERATION: ${{ vars.VOICE_NATS_ACL_PROOF_GENERATION }}
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLOUT_ARTIFACT_ID: ${{ steps.encrypted_backup.outputs.artifact-id }}
          ROLLOUT_CLAIM_RV: ""
          ROLLOUT_ACTION: --configure
        run: *protected_rollout_runner

      - name: Verify root-established preservation authorization
        env:
          VOICE_NATS_ROLLOUT_OPERATION: ${{ steps.preservation.outputs.operation }}
          ROLLOUT_ROLLBACK_OPERATION: ${{ inputs.rollback_operation }}
          VOICE_IMAGE_REGISTRY: ghcr.io/poryadok/voiceroot
          VOICE_IMAGE_TAG: ${{ steps.preservation.outputs.source_sha || inputs.image_tag }}
          DEPLOY_MODE: ${{ steps.preservation.outputs.deploy_mode || inputs.deploy_mode }}
          ROLLOUT_CHANGED_JSON: ${{ inputs.changed_services }}
          ROLLOUT_NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          ROLLOUT_BOUND_CHANGED_SERVICES: ${{ steps.preservation.outputs.changed_services }}
          VOICE_NATS_ACL_PROOF_SHA: ${{ vars.VOICE_NATS_ACL_PROOF_SHA }}
          VOICE_NATS_ACL_PROOF_GENERATION: ${{ vars.VOICE_NATS_ACL_PROOF_GENERATION }}
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLOUT_ARTIFACT_ID: ${{ steps.encrypted_backup.outputs.artifact-id }}
          ROLLOUT_CLAIM_RV: ""
          ROLLOUT_ACTION: --preflight
        run: *protected_rollout_runner

      - name: Apply exact frozen target while all consumers remain paused
        id: paused_apply
        env:
          VOICE_NATS_ROLLOUT_OPERATION: ${{ steps.preservation.outputs.operation }}
          ROLLOUT_ROLLBACK_OPERATION: ${{ inputs.rollback_operation }}
          VOICE_IMAGE_REGISTRY: ghcr.io/poryadok/voiceroot
          VOICE_IMAGE_TAG: ${{ steps.preservation.outputs.source_sha || inputs.image_tag }}
          DEPLOY_MODE: ${{ steps.preservation.outputs.deploy_mode || inputs.deploy_mode }}
          ROLLOUT_CHANGED_JSON: ${{ inputs.changed_services }}
          ROLLOUT_NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          ROLLOUT_BOUND_CHANGED_SERVICES: ${{ steps.preservation.outputs.changed_services }}
          VOICE_NATS_ACL_PROOF_SHA: ${{ vars.VOICE_NATS_ACL_PROOF_SHA }}
          VOICE_NATS_ACL_PROOF_GENERATION: ${{ vars.VOICE_NATS_ACL_PROOF_GENERATION }}
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLOUT_ARTIFACT_ID: ${{ steps.encrypted_backup.outputs.artifact-id }}
          ROLLOUT_CLAIM_RV: ""
          ROLLOUT_ACTION: --apply
        run: *protected_rollout_runner

      - name: Prove unchanged store and resume through installed root bridge
        env:
          VOICE_NATS_ROLLOUT_OPERATION: ${{ steps.preservation.outputs.operation }}
          ROLLOUT_ROLLBACK_OPERATION: ${{ inputs.rollback_operation }}
          VOICE_IMAGE_REGISTRY: ghcr.io/poryadok/voiceroot
          VOICE_IMAGE_TAG: ${{ steps.preservation.outputs.source_sha || inputs.image_tag }}
          DEPLOY_MODE: ${{ steps.preservation.outputs.deploy_mode || inputs.deploy_mode }}
          ROLLOUT_CHANGED_JSON: ${{ inputs.changed_services }}
          ROLLOUT_NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          ROLLOUT_BOUND_CHANGED_SERVICES: ${{ steps.preservation.outputs.changed_services }}
          VOICE_NATS_ACL_PROOF_SHA: ${{ vars.VOICE_NATS_ACL_PROOF_SHA }}
          VOICE_NATS_ACL_PROOF_GENERATION: ${{ vars.VOICE_NATS_ACL_PROOF_GENERATION }}
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLOUT_ARTIFACT_ID: ${{ steps.encrypted_backup.outputs.artifact-id }}
          ROLLOUT_CLAIM_RV: ${{ steps.paused_apply.outputs.claim_rv }}
          ROLLOUT_ACTION: --bridge-finish
        run: *protected_rollout_runner

      - name: Record exact operation status after failure
        if: failure() && steps.preservation.outputs.operation != ''
        env:
          VOICE_NATS_ROLLOUT_OPERATION: ${{ steps.preservation.outputs.operation }}
          ROLLOUT_ROLLBACK_OPERATION: ${{ inputs.rollback_operation }}
          VOICE_IMAGE_REGISTRY: ghcr.io/poryadok/voiceroot
          VOICE_IMAGE_TAG: ${{ steps.preservation.outputs.source_sha || inputs.image_tag }}
          DEPLOY_MODE: ${{ steps.preservation.outputs.deploy_mode || inputs.deploy_mode }}
          ROLLOUT_CHANGED_JSON: ${{ inputs.changed_services }}
          ROLLOUT_NEEDS_FULL_ROLLOUT: ${{ inputs.needs_full_rollout }}
          ROLLOUT_BOUND_CHANGED_SERVICES: ${{ steps.preservation.outputs.changed_services }}
          VOICE_NATS_ACL_PROOF_SHA: ${{ vars.VOICE_NATS_ACL_PROOF_SHA }}
          VOICE_NATS_ACL_PROOF_GENERATION: ${{ vars.VOICE_NATS_ACL_PROOF_GENERATION }}
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLOUT_ARTIFACT_ID: ${{ steps.encrypted_backup.outputs.artifact-id }}
          ROLLOUT_CLAIM_RV: ${{ steps.paused_apply.outputs.claim_rv }}
          ROLLOUT_ACTION: --bridge-status
        run: *protected_rollout_runner

  nats-search-jetstream-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.nats_probe_only == true && inputs.validate_app_secret_only != true && inputs.mail_only != true
    runs-on: ${{ vars.STAGING_RUNNER_LABELS != '' && fromJson(vars.STAGING_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 8
    environment: staging
    steps:
      - name: Check staging runner can reach GitHub before checkout
        shell: bash
        run: |
          set +x
          set -euo pipefail
          route=direct
          if [[ -n "${HTTPS_PROXY:-}${https_proxy:-}${ALL_PROXY:-}${all_proxy:-}${HTTP_PROXY:-}${http_proxy:-}" ]]; then
            route=proxy
          fi
          echo "STAGING_RUNNER_GITHUB_ROUTE=${route}"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          required_failed=0
          check_endpoint() {
            local label="$1"
            shift
            local status
            if status="$(curl --silent --show-error --connect-timeout 5 --max-time 12 --output /dev/null --write-out '%{http_code}' "$@" 2>"$error_file")"; then
              echo "STAGING_RUNNER_ENDPOINT_${label}=HTTP_${status}"
              return
            fi
            local failure
            if grep -qiE 'could not resolve proxy|failed to resolve proxy' "$error_file"; then
              failure=PROXY_DNS
            elif grep -qiE 'could not resolve host|failed to resolve host' "$error_file"; then
              failure=GITHUB_DNS
            elif grep -qiE 'timed out|timeout' "$error_file"; then
              failure=TIMEOUT
            elif grep -qi 'failed to connect' "$error_file"; then
              failure=TCP_CONNECT
            else
              failure=TLS_OR_CURL
            fi
            echo "STAGING_RUNNER_ENDPOINT_${label}=FAIL_${failure}"
            if [[ "$label" == API || "$label" == SOURCE_ARCHIVE ]]; then
              required_failed=1
            fi
          }
          # github.com git transport is informational; source acquisition uses
          # the fixed-host immutable codeload archive directly.
          check_endpoint GITHUB_DEFAULT https://github.com/
          check_endpoint GITHUB_IPV4 --ipv4 https://github.com/
          check_endpoint API "https://api.github.com/repos/Poryadok/VoiceRoot/commits/${GITHUB_SHA}"
          check_endpoint RAW "https://raw.githubusercontent.com/Poryadok/VoiceRoot/${GITHUB_SHA}/.gitignore"
          check_endpoint SOURCE_ARCHIVE --head "https://codeload.github.com/Poryadok/VoiceRoot/tar.gz/${GITHUB_SHA}"
          if [[ "$required_failed" == 0 ]]; then
            echo "STAGING_RUNNER_SOURCE_ARCHIVE_CONNECTIVITY=PASS"
          else
            echo "STAGING_RUNNER_SOURCE_ARCHIVE_CONNECTIVITY=FAIL"
            exit 1
          fi

      - name: Download exact staging source archive
        env:
          STAGING_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: *download_staging_source

      - uses: azure/setup-kubectl@v5

      - name: Configure kubectl (direct or SSH tunnel)
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
        run: bash scripts/staging/configure-kubectl-ci.sh

      - name: Probe Search JetStream INFO permission (read-only)
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          PROBE_JOB_NAME: voice-nats-search-probe-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +x
          set -euo pipefail
          kctl() { kubectl --request-timeout=8s "$@"; }
          fail_probe() {
            printf 'NATS_SEARCH_JS_INFO=FAIL STAGE_%s\n' "$1"
            exit 1
          }
          namespace="${VOICE_K8S_NAMESPACE:-voice-staging}"
          [ "$namespace" = voice-staging ] || fail_probe NAMESPACE_INPUT
          [[ "$PROBE_JOB_NAME" =~ ^voice-nats-search-probe-[0-9]+-[0-9]+$ ]] || fail_probe JOB_NAME_INPUT

          kctl get namespace voice-staging >/dev/null 2>&1 || fail_probe NAMESPACE_LOOKUP
          kctl get secret voice-nats-service-credentials -n voice-staging --output=name >/dev/null 2>&1 || fail_probe SEARCH_SECRET_LOOKUP
          kctl get service voice-nats -n voice-staging -o json 2>/dev/null | \
            jq -e 'any(.spec.ports[]?; .name == "client" and .port == 4222 and .targetPort == 4222)' >/dev/null 2>&1 || fail_probe HUB_SERVICE_CLIENT_PORT
          kctl get networkpolicy voice-nats-hub-ingress -n voice-staging -o json 2>/dev/null | \
            jq -e 'any(.spec.ingress[]?; any(.from[]?.podSelector.matchExpressions[]?; .key == "app" and .operator == "In" and any(.values[]?; . == "voice-nats-search-bootstrap")) and any(.ports[]?; .protocol == "TCP" and .port == 4222))' >/dev/null 2>&1 || fail_probe HUB_NETWORK_POLICY
          search_deployment="$(kctl get deployment voice-search -n voice-staging -o json 2>/dev/null)" || fail_probe SEARCH_LEAF_DEPLOYMENT
          search_service_secret="$(printf '%s' "$search_deployment" | jq -er '
            .spec.template.spec as $pod |
            ([$pod.volumes[]? | select(.name == "nats-service-creds") | .secret.secretName] | first // "")
          ' 2>/dev/null)" || fail_probe SEARCH_SERVICE_SECRET
          [[ "$search_service_secret" =~ ^voice-nats-service-credentials(-r[0-9]{8}[a-z0-9]{0,8})?$ ]] || fail_probe SEARCH_SERVICE_SECRET
          printf '%s' "$search_deployment" | jq -e '
              .spec.template.spec as $pod |
              ([$pod.volumes[]? | select(.name == "nats-service-creds") | .secret.secretName] | first // "") as $serviceSecret |
              ([$pod.volumes[]? | select(.name == "nats-hub-tls") | .secret.secretName] | first // "") as $tlsSecret |
              (($serviceSecret == "voice-nats-service-credentials" and $tlsSecret == "voice-nats-hub-tls") or
                ((try ($serviceSecret | capture("^voice-nats-service-credentials(?<g>-r[0-9]{8}[a-z0-9]{0,8})$").g) catch "") as $g |
                  ($g != "" and $tlsSecret == ("voice-nats-hub-tls" + $g)))) and
              any($pod.containers[]?;
                .name == "nats-leaf" and .image == "nats:2.12.12-alpine@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb" and
                .args == ["-c", "/etc/nats/leaf.conf"] and
                any(.env[]?; .name == "NATS_CREDS" and .value == "/var/run/nats/creds/search.creds") and
                any(.volumeMounts[]?; .mountPath == "/var/run/nats/creds/search.creds" and .subPath == "search.creds" and .readOnly == true) and
                any(.volumeMounts[]?; .mountPath == "/etc/nats/leaf.conf" and .subPath == "leaf.conf" and .readOnly == true) and
                any(.volumeMounts[]?; .mountPath == "/etc/nats/tls/ca.crt" and .subPath == "ca.crt" and .readOnly == true)
              ) and
              any($pod.volumes[]?; .name == "nats-service-creds" and .secret.secretName == $serviceSecret and any(.secret.items[]?; .key == "search.creds" and .path == "search.creds")) and
              any($pod.volumes[]?; .name == "nats-hub-tls" and .secret.secretName == $tlsSecret and any(.secret.items[]?; .key == "ca.crt" and .path == "ca.crt")) and
              any($pod.volumes[]?; .name == "nats-leaf-config" and .configMap.name == "voice-nats-leaf-config")
            ' >/dev/null 2>&1 || fail_probe SEARCH_LEAF_DEPLOYMENT

          cleanup() {
            trap - EXIT
            if kctl delete job "$PROBE_JOB_NAME" -n voice-staging --ignore-not-found=true --wait=true --timeout=30s >/dev/null 2>&1; then
              printf '%s\n' 'NATS_SEARCH_JS_CLEANUP=PASS'
            else
              printf '%s\n' 'NATS_SEARCH_JS_CLEANUP=FAIL'
              exit 1
            fi
          }
          trap cleanup EXIT

          sed -e "s/__PROBE_JOB_NAME__/${PROBE_JOB_NAME}/" \
            -e "s/__SEARCH_SERVICE_SECRET__/${search_service_secret}/" <<'EOF' | kctl create -f - >/dev/null 2>&1 || fail_probe JOB_CREATE
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: __PROBE_JOB_NAME__
            namespace: voice-staging
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 90
            ttlSecondsAfterFinished: 600
            template:
              metadata:
                labels:
                  app: voice-nats-search-bootstrap
                  voice.nats/probe: search-jetstream-info
              spec:
                automountServiceAccountToken: false
                restartPolicy: Never
                containers:
                  - name: probe
                    image: natsio/nats-box:0.18.0
                    command: ["/bin/sh", "-ceu"]
                    args:
                      - |
                        set +x
                        umask 077
                        creds=/var/run/nats/creds/search.creds
                        if [ ! -r "$creds" ]; then
                          echo 'NATS_SEARCH_JS_INFO=FAIL CREDS_UNREADABLE CODE_0 ERR_0'
                          exit 1
                        fi
                        if ! getent hosts voice-nats >/dev/null 2>&1; then
                          echo 'NATS_SEARCH_JS_INFO=FAIL DNS_FAILURE CODE_0 ERR_0'
                          exit 1
                        fi
                        if ! nc -z -w 3 voice-nats 4222 >/dev/null 2>&1; then
                          echo 'NATS_SEARCH_JS_INFO=FAIL TCP_FAILURE CODE_0 ERR_0'
                          exit 1
                        fi
                        tmp="$(mktemp -d)"
                        trap 'rm -rf "$tmp"' EXIT
                        response="$tmp/response.json"
                        stderr="$tmp/stderr.txt"
                        nats_status=0
                        if nats --server nats://voice-nats:4222 --creds "$creds" --inbox-prefix _INBOX.voice.search req --raw --timeout 5s '$JS.API.CONSUMER.INFO.message_events.search-indexer-message-v1' '' >"$response" 2>"$stderr"; then
                          if jq -e '(.error | not) and .config.durable_name == "search-indexer-message-v1"' "$response" >/dev/null 2>&1; then
                            echo "NATS_SEARCH_JS_INFO=PASS"
                            exit 0
                          fi
                        else
                          nats_status=$?
                        fi
                        code="$(jq -r '.error.code // 0 | if type == "number" then floor else 0 end' "$response" 2>/dev/null || true)"
                        err_code="$(jq -r '.error.err_code // 0 | if type == "number" then floor else 0 end' "$response" 2>/dev/null || true)"
                        case "$code" in ''|*[!0-9]*) code=0 ;; esac
                        case "$err_code" in ''|*[!0-9]*) err_code=0 ;; esac
                        details="$(jq -r '.error.description // empty' "$response" 2>/dev/null || true) $(cat "$stderr")"
                        if printf '%s' "$details" | grep -Eqi 'jetstream[^[:cntrl:]]*(not enabled|disabled)|not enabled[^[:cntrl:]]*jetstream'; then
                          category=JETSTREAM_DISABLED
                        elif printf '%s' "$details" | grep -Eqi 'permission|authorization|not authorized|unauthorized|forbidden'; then
                          category=PERMISSION_DENIED
                        elif printf '%s' "$details" | grep -Eqi 'authentication|credentials|invalid token'; then
                          category=AUTHENTICATION_FAILED
                        elif printf '%s' "$details" | grep -Eqi 'tls|x509|certificate'; then
                          category=TLS_ERROR
                        elif printf '%s' "$details" | grep -Eqi 'timed out|timeout|no responders'; then
                          category=TIMEOUT
                        elif printf '%s' "$details" | grep -Eqi 'no servers available|failed to connect|connection refused|network is unreachable|connection reset|broken pipe'; then
                          category=CONNECT_ERROR
                        elif [ "$code" = 404 ]; then
                          category=NOT_FOUND
                        elif [ "$nats_status" -ne 0 ]; then
                          category=CLI_ERROR
                        elif ! jq -e . "$response" >/dev/null 2>&1; then
                          category=INVALID_RESPONSE
                        else
                          category=OTHER
                        fi
                        printf 'NATS_SEARCH_JS_INFO=FAIL %s CODE_%s ERR_%s\n' "$category" "$code" "$err_code"
                        exit 1
                    volumeMounts:
                      - name: search-service-creds
                        mountPath: /var/run/nats/creds/search.creds
                        subPath: search.creds
                        readOnly: true
                volumes:
                  - name: search-service-creds
                    secret:
                      secretName: __SEARCH_SERVICE_SECRET__
                      defaultMode: 0400
                      items:
                        - key: search.creds
                          path: search.creds
          EOF

          conditions=""
          probe_complete=false
          for attempt in $(seq 1 60); do
            conditions="$(kctl get job "$PROBE_JOB_NAME" -n voice-staging -o json 2>/dev/null | jq -r '[.status.conditions[]? | select((.type == "Complete" or .type == "Failed") and .status == "True") | .type] | first // empty' 2>/dev/null || true)"
            if [ "$conditions" = Complete ] || [ "$conditions" = Failed ]; then
              probe_complete=true
              break
            fi
            sleep 2
          done
          [ "$probe_complete" = true ] || fail_probe JOB_TIMEOUT
          result="$(kctl logs "job/$PROBE_JOB_NAME" -n voice-staging -c probe --tail=1 2>/dev/null || true)"
          case "$result" in
            NATS_SEARCH_JS_INFO=PASS)
              [ "$conditions" = Complete ] || fail_probe JOB_STATUS_MISMATCH
              printf '%s\n' "$result"
              ;;
            *)
              [[ "$result" =~ ^NATS_SEARCH_JS_INFO=FAIL\ (CREDS_UNREADABLE|DNS_FAILURE|TCP_FAILURE|JETSTREAM_DISABLED|PERMISSION_DENIED|AUTHENTICATION_FAILED|TLS_ERROR|TIMEOUT|CONNECT_ERROR|NOT_FOUND|CLI_ERROR|INVALID_RESPONSE|OTHER)\ CODE_[0-9]+\ ERR_[0-9]+$ ]] || fail_probe JOB_RESULT
              [ "$conditions" = Failed ] || fail_probe JOB_STATUS_MISMATCH
              printf '%s\n' "$result"
              exit 1
              ;;
          esac

  validate-app-secret:
    if: github.event_name == 'workflow_dispatch' && inputs.validate_app_secret_only == true && inputs.mail_only != true
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Check uploaded Auth mail fields
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          STAGING_APP_SECRETS_YAML_B64: ${{ secrets.STAGING_APP_SECRETS_YAML }}
        run: |
          set -euo pipefail
          printf '%s' "${STAGING_APP_SECRETS_YAML_B64}" | base64 -d |
            python3 scripts/staging/mail-only-patch.py "${VOICE_K8S_NAMESPACE:-voice-staging}" --yaml-check
      - name: Validate uploaded staging app Secret
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          STAGING_APP_SECRETS_YAML_B64: ${{ secrets.STAGING_APP_SECRETS_YAML }}
          STAGING_SECRET_OFFLINE_PARSE: '1'
        run: |
          set -euo pipefail
          if [ -z "${STAGING_APP_SECRETS_YAML_B64}" ]; then
            echo 'ERROR: staging app Secret upload is missing' >&2
            exit 1
          fi
          bash scripts/staging/preflight-resend-key.sh

  mail-only:
    if: github.event_name == 'workflow_dispatch' && inputs.mail_only == true && inputs.validate_app_secret_only != true && inputs.nats_probe_only != true
    runs-on: ${{ vars.STAGING_RUNNER_LABELS != '' && fromJson(vars.STAGING_RUNNER_LABELS) || 'ubuntu-latest' }}
    environment: staging
    steps:
      - name: Download exact staging source archive
        env:
          STAGING_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: *download_staging_source
      - uses: azure/setup-kubectl@v5
      - name: Configure kubectl for Auth-only update
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_VIA_SSH: ${{ vars.STAGING_DEPLOY_VIA_SSH }}
        run: bash scripts/staging/configure-kubectl-ci.sh
      - name: Update Auth mail fields only
        env:
          VOICE_K8S_NAMESPACE: ${{ vars.VOICE_K8S_NAMESPACE }}
          STAGING_APP_SECRETS_YAML_B64: ${{ secrets.STAGING_APP_SECRETS_YAML }}
        run: bash scripts/staging/mail-only-resend.sh
