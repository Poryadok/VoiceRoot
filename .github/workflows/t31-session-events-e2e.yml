name: T31 HTTPS session events E2E

on:
  pull_request:
    paths:
      - ".github/workflows/t31-session-events-e2e.yml"
      - "docker-compose.yml"
      - "docker-compose.phase0.yml"
      - "docker-compose.t31-session-events-e2e.yml"
      - "docs/testing/game-integrations-acceptance.md"
      - "docs/testing/game-integrations-exec-plan.md"
      - "scripts/ci/t31-session-event-compose-bootstrap.py"
      - "scripts/dev/generate-phase0-fixture.py"
      - "scripts/dev/t31-session-event-gateway.conf"
      - "src/backend/auth/**"
      - "src/backend/chat/**"
      - "src/backend/controlledgame/**"
      - "src/backend/gameintegration/**"
      - "src/backend/gateway/**"
      - "src/backend/migrations/game_integration_db/**"
      - "src/backend/role/**"
      - "src/backend/voice/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  T31_COMPOSE_PROJECT: voice-t31-session-events-${{ github.run_id }}

concurrency:
  group: t31-session-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-https-claim-inbox-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Docker Compose and fixture prerequisites
        run: |
          docker compose version
          openssl version
          python3 --version

      - name: Generate isolated Phase0 and HTTPS certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/phase0-t31-ci-fixture tmp/t31-session-event-e2e/tls
          python3 scripts/dev/generate-phase0-fixture.py tmp/phase0-t31-ci-fixture/credentials
          printf 'PHASE0_FIXTURE_DIR=%s/tmp/phase0-t31-ci-fixture/credentials\n' "$GITHUB_WORKSPACE" > tmp/phase0-t31-ci-fixture/fixture.env
          TLS_DIR="$GITHUB_WORKSPACE/tmp/t31-session-event-e2e/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$TLS_DIR/ca.key" -out "$TLS_DIR/ca.crt" \
            -subj "/CN=Voice T31 isolated HTTPS fixture CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$TLS_DIR/gateway.key" -out "$TLS_DIR/gateway.csr" \
            -subj "/CN=t31-gateway.test" >/dev/null 2>&1
          printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:t31-gateway.test\n' > "$TLS_DIR/gateway.ext"
          openssl x509 -req -in "$TLS_DIR/gateway.csr" -CA "$TLS_DIR/ca.crt" \
            -CAkey "$TLS_DIR/ca.key" -CAcreateserial -days 2 \
            -extfile "$TLS_DIR/gateway.ext" -out "$TLS_DIR/gateway.crt" >/dev/null 2>&1
          chmod 600 "$TLS_DIR/ca.key" "$TLS_DIR/gateway.key"
          rm "$TLS_DIR/ca.key" "$TLS_DIR/gateway.csr" "$TLS_DIR/gateway.ext" "$TLS_DIR/ca.srl"
          cat > tmp/t31-session-event-e2e/compose.env <<EOF
          T31_E2E_TLS_DIR=$TLS_DIR
          T31_APPLICATION_ID=00000000-0000-4000-8000-000000000001
          T31_ENVIRONMENT_ID=00000000-0000-4000-8000-000000000002
          T31_GAME_SERVER_CREDENTIAL=bootstrap-pending
          T31_OTHER_APPLICATION_ID=00000000-0000-4000-8000-000000000003
          T31_OTHER_ENVIRONMENT_ID=00000000-0000-4000-8000-000000000004
          T31_OTHER_GAME_SERVER_CREDENTIAL=bootstrap-pending
          T31_EXPECTED_EVENT_ID=00000000-0000-4000-8000-000000000005
          EOF
          chmod 600 tmp/t31-session-event-e2e/compose.env

      - name: Validate isolated Compose overlay
        run: |
          docker compose --env-file tmp/phase0-t31-ci-fixture/fixture.env \
            --env-file tmp/t31-session-event-e2e/compose.env --profile app \
            -f docker-compose.yml -f docker-compose.phase0.yml \
            -f docker-compose.t31-session-events-e2e.yml \
            -p "$T31_COMPOSE_PROJECT" config --quiet

      - name: Start Phase0 owners, Gateway TLS ingress, and separate receiver DB
        run: |
          docker compose --env-file tmp/phase0-t31-ci-fixture/fixture.env \
            --env-file tmp/t31-session-event-e2e/compose.env --profile app \
            -f docker-compose.yml -f docker-compose.phase0.yml \
            -f docker-compose.t31-session-events-e2e.yml \
            -p "$T31_COMPOSE_PROJECT" up -d --build --wait \
            gateway t31-session-event-receiver-db

      - name: Rebuild Gateway from this T31 worktree
        run: |
          docker compose --env-file tmp/phase0-t31-ci-fixture/fixture.env \
            --env-file tmp/t31-session-event-e2e/compose.env --profile app \
            -f docker-compose.yml -f docker-compose.phase0.yml \
            -f docker-compose.t31-session-events-e2e.yml \
            -p "$T31_COMPOSE_PROJECT" up -d --no-deps --build --force-recreate gateway

      - name: Start TLS ingress after Gateway image is current
        run: |
          docker compose --env-file tmp/phase0-t31-ci-fixture/fixture.env \
            --env-file tmp/t31-session-event-e2e/compose.env --profile app \
            -f docker-compose.yml -f docker-compose.phase0.yml \
            -f docker-compose.t31-session-events-e2e.yml \
            -p "$T31_COMPOSE_PROJECT" up -d --no-deps --wait t31-session-event-gateway-tls

      - name: Bootstrap verified owners and scoped game credentials over public API
        run: |
          python3 scripts/ci/t31-session-event-compose-bootstrap.py \
            --project "$T31_COMPOSE_PROJECT" \
            --phase0-env tmp/phase0-t31-ci-fixture/fixture.env \
            --compose-env tmp/t31-session-event-e2e/compose.env \
            --tls-dir tmp/t31-session-event-e2e/tls \
            --result tmp/t31-session-event-e2e/bootstrap-result.json

      - name: Exercise HTTPS claim, isolated inbox/effect, reclaim, and ACK replay
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file tmp/phase0-t31-ci-fixture/fixture.env \
            --env-file tmp/t31-session-event-e2e/compose.env --profile app \
            -f docker-compose.yml -f docker-compose.phase0.yml \
            -f docker-compose.t31-session-events-e2e.yml \
            -p "$T31_COMPOSE_PROJECT" run --rm --no-deps \
            t31-session-event-runner 2>&1 | tee tmp/t31-session-event-e2e/acceptance.log

      - name: Save sanitized T31 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t31-session-events-e2e-${{ github.run_id }}
          path: |
            tmp/t31-session-event-e2e/bootstrap-result.json
            tmp/t31-session-event-e2e/acceptance.log
          if-no-files-found: ignore

      - name: Remove this run's isolated Compose project and fixtures
        if: always()
        shell: bash
        run: |
          docker compose --env-file tmp/phase0-t31-ci-fixture/fixture.env \
            --env-file tmp/t31-session-event-e2e/compose.env --profile app \
            -f docker-compose.yml -f docker-compose.phase0.yml \
            -f docker-compose.t31-session-events-e2e.yml \
            -p "$T31_COMPOSE_PROJECT" down --volumes --remove-orphans || true
          rm -rf tmp/phase0-t31-ci-fixture tmp/t31-session-event-e2e
