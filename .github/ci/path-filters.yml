# Path filters for CI tier 1 (PR / push). Sync service paths with Makefile GO_SERVICES.
# Global / shared paths widen blast radius (run all Go services, full flutter, etc.).

global:
  - scripts/dev/generate-phase0-fixture.py
  - docker/phase0/**
  - src/backend/scripts/docker-go-mod-download.sh
  - scripts/staging/**
  - scripts/prod/**
  - docker-compose.yml
  - docker-compose*.yml
  - .env.example
  - buf.yaml
  - buf.lock
  - buf.gen*.yaml

# Changes to CI wiring run broad checks but are not deployment inputs.
ci_global:
  - scripts/release/capability_manifest*.py
  - scripts/release/client_compatibility.py
  - scripts/release/client_compatibility_test.py
  - Makefile
  - .golangci.yml
  - .github/workflows/**
  - .github/ci/**
  - scripts/ci/**
  # Audited independent jobs/diagnostics still run the complete script shards.
  # Unknown CI files retain the conservative broad fallback above.
  - '!.github/workflows/gateway-media-build.yml'
  - '!.github/workflows/t31-session-events-e2e.yml'
  - '!.github/workflows/t16-cross-service-acceptance.yml'
  - '!.github/workflows/space-tree-proof.yml'
  - '!.github/workflows/space-audit-read-proof.yml'
  - '!scripts/ci/auth_session_floor_diagnostics.py'
  - '!scripts/ci/auth_session_floor_diagnostics_test.py'
  - '!scripts/ci/space_media_admission_diagnostics.py'
  - '!scripts/ci/space_media_admission_diagnostics_test.py'
  - '!scripts/ci/t31-startup-diagnostics.py'
  - '!scripts/ci/t31-startup-diagnostics_test.py'
  - '!scripts/ci/gate-latency.py'
  - '!scripts/ci/gate-latency_test.py'

ci_scripts:
  - scripts/ci/**
  - scripts/release/capability_manifest*.py
  - scripts/release/client_compatibility*.py
  - Makefile
  - .golangci.yml
  - .github/workflows/**
  - .github/ci/**

# Every image can consume generated peer modules and shared context rules.
go_build_shared:
  - src/backend/**/pb/**
  - src/backend/**/go.mod
  - src/backend/**/go.sum
  - src/backend/.dockerignore
  - .dockerignore

# PR-only selection; master retains publishing the renderer for every code SHA.
nats_renderer:
  - src/backend/pkg/**
  - src/backend/user/pb/**
  - src/backend/analytics/pb/**
  - src/backend/messaging/pb/**
  - src/backend/chat/pb/**
  - .dockerignore

# Changes to the historical validator require its complete fixtures on the PR.
# The full audit is also mandatory for release branches and master pushes.
history_audit:
  - scripts/ci/voice-db-runtime-provisioning-contract_test.sh
  - scripts/ci/voice-r22-runtime-scope*
  - scripts/ci/resolve-voice-r22-base.sh

# The DEV overlay applicator has its own focused required Linux contract job.
match_squad_overlay:
  - scripts/dev/match_squad_overlay.py
  - scripts/dev/match_squad_overlay_test.py
  - scripts/dev/match_squad_runtime_overlay.py
  - scripts/dev/match_squad_runtime_overlay_test.py
  - deploy/dev/match-squad-trust-overlay/**

a1_t106_live:
  # Retain the existing output name; both targeted live test edits require A1.
  - src/frontend/test/t055_profile_switch_reconnect_inbox_e2e_live_test.dart
  - src/frontend/test/t106_account_soft_delete_e2e_live_test.dart

a1_e2e:
