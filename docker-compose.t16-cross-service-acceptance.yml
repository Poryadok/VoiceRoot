# Disposable hosted Linux acceptance fixture for Auth -> GIS -> Messaging.
services:
  # T16 never exercises User object storage. Keep the base User dependency graph
  # healthy without pulling MinIO from an external registry; Postgres is already
  # required by this disposable stack. Avatar/object-storage writes are out of
  # scope for this acceptance.
  minio:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command: ["while :; do sleep 3600; done"]
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 5s
      timeout: 2s
      retries: 3

  minio-init:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c", "exit 0"]

  auth:
    environment:
      AUTH_SDK_AUTHORIZATION_ENABLED: "true"
      AUTH_SDK_AUTHORIZATION_GAME_INTEGRATION_BASE_URL: http://gameintegration:8080
      AUTH_SDK_AUTHORIZATION_ALLOW_INTERNAL_HTTP: "true"
      AUTH_SDK_IDENTITY_ENABLED: "true"
      AUTH_SDK_IDENTITY_APPLICATIONS_0_APPLICATION_ID: "00000000-0000-4000-8000-000000000016"
      AUTH_SDK_IDENTITY_APPLICATIONS_0_ENVIRONMENT_ID: "00000000-0000-4000-8000-000000000017"
      AUTH_SDK_IDENTITY_APPLICATIONS_0_CLIENT_ID: voice-t16.synthetic
      AUTH_SDK_IDENTITY_APPLICATIONS_0_GAME_PUBLIC_JWK: '${T16_GAME_PUBLIC_JWK:?required}'
      AUTH_PRINCIPAL_SIGNING_KEYS_DIR: /run/t16/auth-principal
      AUTH_PRINCIPAL_ACTIVE_KID: current
      AUTH_USER_PRINCIPAL_GRPC_ADDR: user:9094
      AUTH_USER_PRINCIPAL_TLS_CA_FILE: /run/t16/user-ca/ca.crt
      AUTH_USER_PRINCIPAL_TLS_SERVER_NAME: user
      AUTH_GAME_BINDING_MTLS_PORT: "9443"
      AUTH_GAME_BINDING_MTLS_SERVER_CERT_FILE: /run/t16/auth-server.crt
      AUTH_GAME_BINDING_MTLS_SERVER_KEY_FILE: /run/t16/auth-server.key
      AUTH_GAME_BINDING_MTLS_CLIENT_CA_FILE: /run/t16/ca.crt
      AUTH_GAME_BINDING_MTLS_TRUSTSTORE_FILE: /run/t16/auth-client-ca.p12
      AUTH_GAME_BINDING_MTLS_TRUSTSTORE_PASSWORD: ${T16_AUTH_CLIENT_TRUSTSTORE_PASSWORD:?required}
      AUTH_GAME_BINDING_MTLS_ALLOWED_CLIENT_URI_SAN: spiffe://voice/service/gameintegration
      AUTH_GAME_MESSAGE_EXECUTION_PERMIT_ALLOWED_CLIENT_URI_SAN: spiffe://voice/service/messaging
      GAME_INTEGRATION_AUTH_WORKLOAD_KEY_B64: ${T16_AUTH_WORKLOAD_KEY_B64:?required}
    volumes:
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/auth-principal:/run/t16/auth-principal:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/ca.crt:/run/t16/ca.crt:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/auth-client-ca.p12:/run/t16/auth-client-ca.p12:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/auth-server.crt:/run/t16/auth-server.crt:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/auth-server.key:/run/t16/auth-server.key:ro
      - social_principal_ca:/run/t16/user-ca:ro
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19443:9443"

  t16-auth-principal-ca-bundle:
    profiles: ["app"]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command: ["cat /base/ca.crt /run/t16/ca.crt > /bundle/ca.crt && chmod 644 /bundle/ca.crt"]
    volumes:
      - social_principal_ca:/base:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/ca.crt:/run/t16/ca.crt:ro
      - t16_auth_principal_ca:/bundle
    depends_on:
      social-principal-init:
        condition: service_completed_successfully

  auth-principal-jwks:
    profiles: ["app"]
    image: node:24-alpine
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: "service:auth"
    command: ["node", "/run/t16/t16-auth-principal-jwks-proxy.mjs"]
    volumes:
      - ./scripts/ci/t16-auth-principal-jwks-proxy.mjs:/run/t16/t16-auth-principal-jwks-proxy.mjs:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/auth-principal-jwks.crt:/run/t16/auth-principal-jwks.crt:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/auth-principal-jwks.key:/run/t16/auth-principal-jwks.key:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/ca.crt:/run/t16/ca.crt:ro
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const fs=require('node:fs'),https=require('node:https');const r=https.get({hostname:'auth',port:9444,path:'/health',ca:fs.readFileSync('/run/t16/ca.crt')},s=>process.exit(s.statusCode===200?0:1));r.on('error',()=>process.exit(1));"
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 2s

  gameintegration:
    environment:
      T16_ACCEPTANCE_DIAGNOSTICS: "1"
      GAME_INTEGRATION_AUTH_WORKLOAD_KEY_B64: ${T16_AUTH_WORKLOAD_KEY_B64:?required}
      GIS_AUTH_GAME_BINDING_BASE_URL: https://auth:9443
      GIS_AUTH_GAME_BINDING_CA_FILE: /run/t16/ca.crt
      GIS_AUTH_GAME_BINDING_CLIENT_CERT_FILE: /run/t16/gameintegration-client.crt
      GIS_AUTH_GAME_BINDING_CLIENT_KEY_FILE: /run/t16/gameintegration-client.key
      GAME_INTEGRATION_MESSAGING_LISTEN_ADDR: :8443
      GAME_INTEGRATION_MESSAGING_TLS_CERT_FILE: /run/t16/gis-server.crt
      GAME_INTEGRATION_MESSAGING_TLS_KEY_FILE: /run/t16/gis-server.key
      GAME_INTEGRATION_MESSAGING_CLIENT_CA_FILE: /run/t16/ca.crt
      GAME_INTEGRATION_MESSAGING_WORKLOAD_KEY_B64: ${T16_MESSAGING_WORKLOAD_KEY_B64:?required}
    volumes:
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/ca.crt:/run/t16/ca.crt:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/gis-server.crt:/run/t16/gis-server.crt:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/gis-server.key:/run/t16/gis-server.key:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/gameintegration-client.crt:/run/t16/gameintegration-client.crt:ro
      - ${T16_FIXTURE_DIR:?generate T16 fixtures first}/tls/gameintegration-client.key:/run/t16/gameintegration-client.key:ro
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:18443:8443"

  user:
    environment:
      USER_AUTH_PRINCIPAL_GRPC_LISTEN: :9094
      USER_AUTH_PRINCIPAL_TLS_CERT_FILE: /etc/voice/principal/tls/tls.crt
      USER_AUTH_PRINCIPAL_TLS_KEY_FILE: /etc/voice/principal/tls/tls.key
      USER_AUTH_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
      S2S_JWKS_URLS_JSON: '{"social":"https://social:8443/.well-known/jwks.json","file":"https://file:8443/.well-known/jwks.json","search":"https://search:8443/.well-known/jwks.json","auth":"https://auth:9444/api/v1/auth/.well-known/principal-jwks.json"}'
      S2S_JWKS_CA_FILE: /run/t16/principal-ca/ca.crt
    volumes:
      - t16_auth_principal_ca:/run/t16/principal-ca:ro
    depends_on:
      t16-auth-principal-ca-bundle:
        condition: service_completed_successfully
      auth-principal-jwks:
        condition: service_healthy

volumes:
  social_principal_ca: {}
  t16_auth_principal_ca: {}
