<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Voice a11y landmark contract</title>
    <!--
      Static ARIA contract for docs/features/accessibility.md §Screen Reader (Web).
      Flutter widget semantics cover the app tree; this fixture gates landmark / label /
      live-region expectations in CI via axe-core (beyond flutter test widgets).
    -->
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #1e1e1e;
        color: #f0f0f0;
      }
      :focus-visible {
        outline: 2px solid #7ec8e3;
        outline-offset: 2px;
      }
      .shell {
        display: grid;
        grid-template-columns: 56px 320px 1fr;
        min-height: 100vh;
      }
      button,
      input {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav aria-label="Navigation">
        <button type="button" aria-label="Chats">Chats</button>
        <button type="button" aria-label="Friends">Friends</button>
        <button type="button" aria-label="Open settings">Settings</button>
      </nav>

      <section aria-label="Chat list">
        <h1>Chats</h1>
        <ul>
          <li>
            <button type="button" aria-label="Alice, 3 unread">
              <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Avatar Alice" width="32" height="32" />
              Alice
              <span>online</span>
              <span>3 unread</span>
            </button>
          </li>
        </ul>
      </section>

      <main aria-label="Conversation">
        <header>
          <h2>Alice</h2>
          <span>online</span>
        </header>
        <div aria-live="polite" aria-relevant="additions" id="message-live">
          <p>Hey — are you free for a match?</p>
        </div>
        <form aria-label="Compose message">
          <label for="composer">Message</label>
          <input id="composer" name="message" type="text" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>
  </body>
</html>
