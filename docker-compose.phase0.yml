# Opt-in LOCAL/CI fixture only. Generate PHASE0_FIXTURE_DIR before using it.
services:
  gateway:
    user: "0:0"
    environment:
      GATEWAY_PRINCIPAL_SIGNING_KEYS_DIR: /run/phase0/gateway
      GATEWAY_PRINCIPAL_ACTIVE_KID: current
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/gateway:/run/phase0/gateway:ro
  space:
    user: "0:0"
    environment:
      SPACE_PRINCIPAL_SIGNING_KEYS_DIR: /run/phase0/space
      SPACE_PRINCIPAL_ACTIVE_KID: current
      ROLE_PRINCIPAL_GRPC_ADDR: role:9091
      ROLE_PRINCIPAL_TLS_CA_FILE: /run/phase0/ca.crt
      SPACE_ROLE_CLIENT_CERT_FILE: /run/phase0/space-role-client.crt
      SPACE_ROLE_CLIENT_KEY_FILE: /run/phase0/space-role-client.key
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/space:/run/phase0/space:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/space-client.crt:/run/phase0/space-role-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/space-client.key:/run/phase0/space-role-client.key:ro
  gameintegration:
    user: "0:0"
    expose: ["8443"]
    environment:
      GAME_INTEGRATION_PRINCIPAL_PRIVATE_KEY_FILE: /run/phase0/gameintegration/current.pem
      GAME_INTEGRATION_PRINCIPAL_KID: current
      GAME_INTEGRATION_PRINCIPAL_NEXT_PRIVATE_KEY_FILE: /run/phase0/gameintegration/next.pem
      GAME_INTEGRATION_PRINCIPAL_NEXT_KID: next
      GAME_INTEGRATION_PRINCIPAL_JWKS_TLS_CERT_FILE: /run/phase0/gameintegration-jwks.crt
      GAME_INTEGRATION_PRINCIPAL_JWKS_TLS_KEY_FILE: /run/phase0/gameintegration-jwks.key
      GAME_INTEGRATION_PRINCIPAL_JWKS_LISTEN_ADDR: :8443
      GAME_INTEGRATION_CREDENTIAL_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NATS_URL: nats://nats:4222
      GIS_CHAT_GRPC_ADDR: chat:9091
      GIS_CHAT_TLS_CA_FILE: /run/phase0/ca.crt
      GIS_CHAT_CLIENT_CERT_FILE: /run/phase0/gameintegration-chat-client.crt
      GIS_CHAT_CLIENT_KEY_FILE: /run/phase0/gameintegration-chat-client.key
      GIS_VOICE_GRPC_ADDR: voice:9091
      GIS_VOICE_TLS_CA_FILE: /run/phase0/ca.crt
      GIS_VOICE_CLIENT_CERT_FILE: /run/phase0/gameintegration-voice-client.crt
      GIS_VOICE_CLIENT_KEY_FILE: /run/phase0/gameintegration-voice-client.key
      GIS_ROLE_GRPC_ADDR: role:9091
      GIS_ROLE_TLS_CA_FILE: /run/phase0/ca.crt
      GIS_ROLE_CLIENT_CERT_FILE: /run/phase0/gameintegration-client.crt
      GIS_ROLE_CLIENT_KEY_FILE: /run/phase0/gameintegration-client.key
    depends_on:
      role:
        condition: service_healthy
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/gameintegration/current.pem:/run/phase0/gameintegration/current.pem:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/gameintegration/next.pem:/run/phase0/gameintegration/next.pem:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-jwks.crt:/run/phase0/gameintegration-jwks.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-jwks.key:/run/phase0/gameintegration-jwks.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-client.crt:/run/phase0/gameintegration-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-client.key:/run/phase0/gameintegration-client.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-chat-client.crt:/run/phase0/gameintegration-chat-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-chat-client.key:/run/phase0/gameintegration-chat-client.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-voice-client.crt:/run/phase0/gameintegration-voice-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gameintegration-voice-client.key:/run/phase0/gameintegration-voice-client.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
  voice:
    user: "0:0"
    expose: ["8443"]
    environment:
      VOICE_PRINCIPAL_PRIVATE_KEY_FILE: /run/phase0/voice/current.pem
      VOICE_PRINCIPAL_KID: current
      VOICE_PRINCIPAL_NEXT_PRIVATE_KEY_FILE: /run/phase0/voice/next.pem
      VOICE_PRINCIPAL_NEXT_KID: next
      VOICE_PRINCIPAL_JWKS_TLS_CERT_FILE: /run/phase0/voice-jwks.crt
      VOICE_PRINCIPAL_JWKS_TLS_KEY_FILE: /run/phase0/voice-jwks.key
      VOICE_PRINCIPAL_JWKS_LISTEN_ADDR: :8443
      VOICE_GAME_PRINCIPAL_GRPC_LISTEN: :9091
      VOICE_GAME_PRINCIPAL_TLS_CERT_FILE: /run/phase0/voice-game-grpc.crt
      VOICE_GAME_PRINCIPAL_TLS_KEY_FILE: /run/phase0/voice-game-grpc.key
      VOICE_GAME_PRINCIPAL_CLIENT_CA_FILE: /run/phase0/gameintegration-client-ca.crt
      VOICE_GAME_PRINCIPAL_JWKS_URL: https://gameintegration:8443/internal/v1/principal/jwks.json
      VOICE_GAME_PRINCIPAL_JWKS_CA_FILE: /run/phase0/ca.crt
      VOICE_GAME_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
      VOICE_ROLE_GRPC_ADDR: role:9091
      VOICE_ROLE_TLS_CA_FILE: /run/phase0/ca.crt
      VOICE_ROLE_CLIENT_CERT_FILE: /run/phase0/voice-client.crt
      VOICE_ROLE_CLIENT_KEY_FILE: /run/phase0/voice-client.key
    depends_on:
      role:
        condition: service_healthy
      gameintegration:
        condition: service_started
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/voice/current.pem:/run/phase0/voice/current.pem:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/voice/next.pem:/run/phase0/voice/next.pem:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-jwks.crt:/run/phase0/voice-jwks.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-jwks.key:/run/phase0/voice-jwks.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-game-grpc.crt:/run/phase0/voice-game-grpc.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-game-grpc.key:/run/phase0/voice-game-grpc.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-client.crt:/run/phase0/voice-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-client.key:/run/phase0/voice-client.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/gameintegration-client-ca.crt:/run/phase0/gameintegration-client-ca.crt:ro
  role:
    user: "0:0"
    expose: ["9091"]
    environment:
      ROLE_PRINCIPAL_GRPC_LISTEN: :9091
      ROLE_PRINCIPAL_TLS_CERT_FILE: /run/phase0/role.crt
      ROLE_PRINCIPAL_TLS_KEY_FILE: /run/phase0/role.key
      ROLE_PRINCIPAL_CLIENT_CA_FILE: /run/phase0/ca.crt
      ROLE_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
      S2S_JWKS_URLS_JSON: '{"space":"https://phase0-jwks:8443/space/jwks.json","gameintegration":"https://gameintegration:8443/internal/v1/principal/jwks.json","voice":"https://voice:8443/internal/v1/principal/jwks.json"}'
      S2S_JWKS_CA_FILE: /run/phase0/ca.crt
    depends_on:
      redis:
        condition: service_healthy
      phase0-jwks:
        condition: service_started
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/role.crt:/run/phase0/role.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/role.key:/run/phase0/role.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
  chat:
    user: "0:0"
    expose: ["9091"]
    environment:
      CHAT_GIS_GRPC_LISTEN: :9091
      CHAT_GIS_TLS_CERT_FILE: /run/phase0/chat-gis-grpc.crt
      CHAT_GIS_TLS_KEY_FILE: /run/phase0/chat-gis-grpc.key
      CHAT_GIS_CLIENT_CA_FILE: /run/phase0/gameintegration-client-ca.crt
      GAME_INTEGRATION_PRINCIPAL_JWKS_URL: https://gameintegration:8443/internal/v1/principal/jwks.json
      GAME_INTEGRATION_PRINCIPAL_JWKS_CA_FILE: /run/phase0/ca.crt
      GAME_INTEGRATION_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
    depends_on:
      gameintegration:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/chat-gis-grpc.crt:/run/phase0/chat-gis-grpc.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/chat-gis-grpc.key:/run/phase0/chat-gis-grpc.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/gameintegration-client-ca.crt:/run/phase0/gameintegration-client-ca.crt:ro
  auth:
    user: "0:0"
    expose: ["9091"]
    environment:
      AUTH_PRINCIPAL_GRPC_PORT: "9091"
      AUTH_GRPC_TLS_CERT_FILE: /run/phase0/auth.crt
      AUTH_GRPC_TLS_KEY_FILE: /run/phase0/auth.key
      S2S_JWKS_URLS_JSON: '{"gateway":"https://phase0-jwks:8443/gateway/jwks.json","space":"https://phase0-jwks:8443/space/jwks.json"}'
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/phase0/truststore.p12 -Djavax.net.ssl.trustStorePassword=phase0-fixture -Djavax.net.ssl.trustStoreType=PKCS12
    depends_on:
      phase0-jwks:
        condition: service_started
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/auth.crt:/run/phase0/auth.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/auth.key:/run/phase0/auth.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/truststore.p12:/run/phase0/truststore.p12:ro
  phase0-jwks:
    profiles: ["app"]
    image: nginx:1.28-alpine
    user: "0:0"
    expose: ["8443"]
    volumes:
      - ./docker/phase0/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/proxy.crt:/run/phase0/proxy.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/proxy.key:/run/phase0/proxy.key:ro
