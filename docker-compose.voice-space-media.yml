services:
  matchmaking:
    user: "0:0"
    environment:
      MATCHMAKING_MATCH_SQUAD_CHAT_GRPC_ADDR: chat:9092
      MATCHMAKING_MATCH_SQUAD_VOICE_GRPC_ADDR: voice:9094
      MATCHMAKING_MATCH_SQUAD_CHAT_CA_FILE: /run/phase0/ca.crt
      MATCHMAKING_MATCH_SQUAD_VOICE_CA_FILE: /run/phase0/ca.crt
      MATCHMAKING_MATCH_SQUAD_CLIENT_CERT_FILE: /run/phase0/matchmaking-client.crt
      MATCHMAKING_MATCH_SQUAD_CLIENT_KEY_FILE: /run/phase0/matchmaking-client.key
      MATCHMAKING_MATCH_SQUAD_CHAT_SERVER_NAME: chat
      MATCHMAKING_MATCH_SQUAD_VOICE_SERVER_NAME: voice
      MATCHMAKING_PRINCIPAL_SIGNING_KEYS_DIR: /run/phase0/matchmaking
      MATCHMAKING_PRINCIPAL_ACTIVE_KID: current
    depends_on:
      phase0-jwks:
        condition: service_started
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/matchmaking:/run/phase0/matchmaking:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/matchmaking-client.crt:/run/phase0/matchmaking-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/matchmaking-client.key:/run/phase0/matchmaking-client.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro

  chat:
    user: "0:0"
    expose: ["9092"]
    environment:
      CHAT_MATCH_SQUAD_PRINCIPAL_GRPC_LISTEN: :9092
      CHAT_MATCH_SQUAD_PRINCIPAL_TLS_CERT_FILE: /run/phase0/chat-match-squad-grpc.crt
      CHAT_MATCH_SQUAD_PRINCIPAL_TLS_KEY_FILE: /run/phase0/chat-match-squad-grpc.key
      CHAT_MATCH_SQUAD_PRINCIPAL_CLIENT_CA_FILE: /run/phase0/ca.crt
      CHAT_MATCH_SQUAD_PRINCIPAL_JWKS_URL: https://phase0-jwks:8443/matchmaking/jwks.json
      CHAT_MATCH_SQUAD_PRINCIPAL_JWKS_CA_FILE: /run/phase0/ca.crt
      CHAT_MATCH_SQUAD_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
      CHAT_MATCH_SQUAD_PRINCIPAL_REPLAY_REDIS_PASSWORD: ""
    depends_on:
      phase0-jwks:
        condition: service_started
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/chat-match-squad-grpc.crt:/run/phase0/chat-match-squad-grpc.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/chat-match-squad-grpc.key:/run/phase0/chat-match-squad-grpc.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro

  space:
    environment:
      # Disposable local/CI credential for the existing canonical resolver.
      SPACE_VOICE_S2S_TOKEN: phase0-space-voice-fixture

  auth:
    user: "0:0"
    expose: ["9091", "9092"]
    environment:
      AUTH_PRINCIPAL_GRPC_PORT: "9091"
      AUTH_SESSION_FLOOR_GRPC_PORT: "9092"
      AUTH_GRPC_TLS_CERT_FILE: /run/phase0/auth.crt
      AUTH_GRPC_TLS_KEY_FILE: /run/phase0/auth.key
      AUTH_SESSION_FLOOR_TLS_CLIENT_CA_FILE: /run/phase0/ca.crt
      S2S_JWKS_URLS_JSON: '{"gateway":"https://phase0-jwks:8443/gateway/jwks.json","space":"https://phase0-jwks:8443/space/jwks.json","voice":"https://voice:8443/internal/v1/principal/jwks.json"}'
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/phase0/truststore.p12 -Djavax.net.ssl.trustStorePassword=phase0-fixture -Djavax.net.ssl.trustStoreType=PKCS12
    depends_on:
      phase0-jwks:
        condition: service_started
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/auth.crt:/run/phase0/auth.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/auth.key:/run/phase0/auth.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/truststore.p12:/run/phase0/truststore.p12:ro

  gateway:
    user: "0:0"
    environment:
      GATEWAY_PRINCIPAL_SIGNING_KEYS_DIR: /run/phase0/gateway
      GATEWAY_PRINCIPAL_ACTIVE_KID: current
      GATEWAY_VOICE_USER_GRPC_ADDR: voice:9093
      GATEWAY_VOICE_USER_TLS_CA_FILE: /run/phase0/ca.crt
      GATEWAY_VOICE_USER_TLS_SERVER_NAME: voice
      GATEWAY_VOICE_USER_CLIENT_CERT_FILE: /run/phase0/gateway-client.crt
      GATEWAY_VOICE_USER_CLIENT_KEY_FILE: /run/phase0/gateway-client.key
    depends_on:
      # Voice loads Gateway's signed-principal JWKS during startup. Do not make
      # Gateway wait for Voice health or the first JWKS request deadlocks.
      voice:
        condition: service_started
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/gateway:/run/phase0/gateway:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gateway-client.crt:/run/phase0/gateway-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/gateway-client.key:/run/phase0/gateway-client.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro

  voice:
    user: "0:0"
    expose: ["8443", "9092", "9093", "9094"]
    environment:
      SPACE_VOICE_S2S_TOKEN: phase0-space-voice-fixture
      # SDK control calls run inside Compose; host media peers use the test
      # helper's VOICE_LIVEKIT_PUBLIC_URL mapping.
      LIVEKIT_URL: ws://livekit:7880
      VOICE_PRINCIPAL_PRIVATE_KEY_FILE: /run/phase0/voice/current.pem
      VOICE_PRINCIPAL_KID: current
      VOICE_PRINCIPAL_NEXT_PRIVATE_KEY_FILE: /run/phase0/voice/next.pem
      VOICE_PRINCIPAL_NEXT_KID: next
      VOICE_PRINCIPAL_JWKS_TLS_CERT_FILE: /run/phase0/voice-jwks.crt
      VOICE_PRINCIPAL_JWKS_TLS_KEY_FILE: /run/phase0/voice-jwks.key
      VOICE_PRINCIPAL_JWKS_LISTEN_ADDR: :8443
      VOICE_USER_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
      VOICE_USER_PRINCIPAL_TLS_CERT_FILE: /run/phase0/voice-game-grpc.crt
      VOICE_USER_PRINCIPAL_TLS_KEY_FILE: /run/phase0/voice-game-grpc.key
      VOICE_USER_PRINCIPAL_CLIENT_CA_FILE: /run/phase0/ca.crt
      # Phase0's separate Space lifecycle listener retains port 9092.
      VOICE_USER_PRINCIPAL_GRPC_LISTEN: :9093
      VOICE_SPACE_LIFECYCLE_PRINCIPAL_GRPC_LISTEN: :9092
      VOICE_SPACE_LIFECYCLE_PRINCIPAL_TLS_CERT_FILE: /run/phase0/voice-game-grpc.crt
      VOICE_SPACE_LIFECYCLE_PRINCIPAL_TLS_KEY_FILE: /run/phase0/voice-game-grpc.key
      VOICE_SPACE_LIFECYCLE_PRINCIPAL_CLIENT_CA_FILE: /run/phase0/space-lifecycle-client-ca.crt
      VOICE_SPACE_LIFECYCLE_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
      VOICE_MATCH_SQUAD_PRINCIPAL_GRPC_LISTEN: :9094
      VOICE_MATCH_SQUAD_PRINCIPAL_TLS_CERT_FILE: /run/phase0/voice-match-squad-grpc.crt
      VOICE_MATCH_SQUAD_PRINCIPAL_TLS_KEY_FILE: /run/phase0/voice-match-squad-grpc.key
      VOICE_MATCH_SQUAD_PRINCIPAL_CLIENT_CA_FILE: /run/phase0/ca.crt
      VOICE_MATCH_SQUAD_PRINCIPAL_JWKS_URL: https://phase0-jwks:8443/matchmaking/jwks.json
      VOICE_MATCH_SQUAD_PRINCIPAL_JWKS_CA_FILE: /run/phase0/ca.crt
      VOICE_MATCH_SQUAD_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
      VOICE_MATCH_SQUAD_PRINCIPAL_REPLAY_REDIS_PASSWORD: ""
      VOICE_ROLE_GRPC_ADDR: role:9091
      VOICE_ROLE_TLS_CA_FILE: /run/phase0/ca.crt
      VOICE_ROLE_CLIENT_CERT_FILE: /run/phase0/voice-client.crt
      VOICE_ROLE_CLIENT_KEY_FILE: /run/phase0/voice-client.key
      VOICE_AUTH_SESSION_FLOOR_GRPC_ADDR: auth:9092
      VOICE_AUTH_SESSION_FLOOR_TLS_CA_FILE: /run/phase0/ca.crt
      VOICE_AUTH_SESSION_FLOOR_TLS_SERVER_NAME: auth
      VOICE_AUTH_SESSION_FLOOR_CLIENT_CERT_FILE: /run/phase0/voice-client.crt
      VOICE_AUTH_SESSION_FLOOR_CLIENT_KEY_FILE: /run/phase0/voice-client.key
      S2S_JWKS_URLS_JSON: '{"space":"https://phase0-jwks:8443/space/jwks.json","gateway":"https://phase0-jwks:8443/gateway/jwks.json"}'
      S2S_JWKS_CA_FILE: /run/phase0/ca.crt
      S2S_JWKS_CLIENT_CERT_FILE: /run/phase0/voice-client.crt
      S2S_JWKS_CLIENT_KEY_FILE: /run/phase0/voice-client.key
    depends_on:
      phase0-jwks:
        condition: service_started
      role:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/voice/current.pem:/run/phase0/voice/current.pem:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/voice/next.pem:/run/phase0/voice/next.pem:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-jwks.crt:/run/phase0/voice-jwks.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-jwks.key:/run/phase0/voice-jwks.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-game-grpc.crt:/run/phase0/voice-game-grpc.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-game-grpc.key:/run/phase0/voice-game-grpc.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-match-squad-grpc.crt:/run/phase0/voice-match-squad-grpc.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-match-squad-grpc.key:/run/phase0/voice-match-squad-grpc.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-client.crt:/run/phase0/voice-client.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/voice-client.key:/run/phase0/voice-client.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/space-lifecycle-client-ca.crt:/run/phase0/space-lifecycle-client-ca.crt:ro

  role:
    user: "0:0"
    expose: ["9091"]
    environment:
      ROLE_PRINCIPAL_GRPC_LISTEN: :9091
      ROLE_PRINCIPAL_TLS_CERT_FILE: /run/phase0/role.crt
      ROLE_PRINCIPAL_TLS_KEY_FILE: /run/phase0/role.key
      ROLE_PRINCIPAL_CLIENT_CA_FILE: /run/phase0/ca.crt
      ROLE_PRINCIPAL_REPLAY_REDIS_ADDR: redis:6379
      S2S_JWKS_URLS_JSON: '{"space":"https://phase0-jwks:8443/space/jwks.json","gameintegration":"https://gameintegration:8443/internal/v1/principal/jwks.json","voice":"https://voice:8443/internal/v1/principal/jwks.json"}'
      S2S_JWKS_CA_FILE: /run/phase0/ca.crt
    depends_on:
      redis:
        condition: service_healthy
      phase0-jwks:
        condition: service_started
    volumes:
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/role.crt:/run/phase0/role.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/role.key:/run/phase0/role.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro

  phase0-jwks:
    profiles: ["app"]
    image: nginx:1.28-alpine
    user: "0:0"
    expose: ["8443"]
    depends_on:
      social-principal-init:
        condition: service_completed_successfully
    volumes:
      - ./docker/phase0/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/jwks/matchmaking/jwks.json:/run/phase0/matchmaking/jwks.json:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/proxy.crt:/run/phase0/proxy.crt:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/tls/proxy.key:/run/phase0/proxy.key:ro
      - ${PHASE0_FIXTURE_DIR:?generate a local Phase0 fixture first}/ca/ca.crt:/run/phase0/ca.crt:ro
      # Media-only Compose keeps Space's base certificate and its issuing CA.
      # The full Phase0 overlay supplies a nested file mount when it replaces
      # Space's certificate with the generated fixture certificate instead.
      - social_principal_ca:/run/phase0/space-ca:ro
