# buf lint: профиль STANDARD без исключений (имена RPC / Request / Response).
# См. docs/REPOSITORIES.md — раздел Protobuf.
# При добавлении buf.mod.yaml с внешними deps (googleapis и т.д.) зафиксировать buf.lock через buf dep update.
version: v1
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # java_package / java_multiple_files are Java codegen metadata only; wire/JSON stays compatible.
  # Added so Auth (Java) can generate stubs from shared user/common protos.
  except:
    - FILE_SAME_JAVA_PACKAGE
    - FILE_SAME_JAVA_MULTIPLE_FILES
