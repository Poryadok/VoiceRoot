syntax = "proto3";

package voice.calls.v1;

import "google/protobuf/timestamp.proto";
import "voice/chat/v1/chat.proto";
import "voice/common/v1/space_lifecycle.proto";
import "voice/space/v1/space.proto";

option go_package = "voice.app/voice/calls/v1;callsv1";

// Canonical values for room_type strings (StartCallRequest, CallSession).
enum VoiceSessionKind {
  VOICE_SESSION_KIND_UNSPECIFIED = 0;
  VOICE_SESSION_KIND_CALL = 1;
  VOICE_SESSION_KIND_GROUP_VOICE = 2;
  VOICE_SESSION_KIND_VOICE_ROOM = 3;
}

enum GameSessionResourceKind {
  GAME_SESSION_RESOURCE_KIND_UNSPECIFIED = 0;
  GAME_SESSION_RESOURCE_KIND_PARTY = 1;
  GAME_SESSION_RESOURCE_KIND_MATCH = 2;
  GAME_SESSION_RESOURCE_KIND_FLEET_SESSION = 3;
}
enum CallMediaKind {
  CALL_MEDIA_KIND_UNSPECIFIED = 0;
  CALL_MEDIA_KIND_AUDIO = 1;
  CALL_MEDIA_KIND_VIDEO = 2;
}

enum CallStatus {
  CALL_STATUS_UNSPECIFIED = 0;
  CALL_STATUS_RINGING = 1;
  CALL_STATUS_ACTIVE = 2;
  CALL_STATUS_DECLINED = 3;
  CALL_STATUS_MISSED = 4;
  CALL_STATUS_ENDED = 5;
}

enum VoiceRoomLifecycleMethod {
  VOICE_ROOM_LIFECYCLE_METHOD_UNSPECIFIED = 0;
  VOICE_ROOM_LIFECYCLE_METHOD_JOIN = 1;
  VOICE_ROOM_LIFECYCLE_METHOD_LEAVE = 2;
  VOICE_ROOM_LIFECYCLE_METHOD_SELF_MOVE = 3;
  VOICE_ROOM_LIFECYCLE_METHOD_MODERATOR_MOVE = 4;
}

enum VoiceRoomLifecycleOutcome {
  VOICE_ROOM_LIFECYCLE_OUTCOME_UNSPECIFIED = 0;
  VOICE_ROOM_LIFECYCLE_OUTCOME_JOINED = 1;
  VOICE_ROOM_LIFECYCLE_OUTCOME_LEFT = 2;
  VOICE_ROOM_LIFECYCLE_OUTCOME_MOVED = 3;
  VOICE_ROOM_LIFECYCLE_OUTCOME_NO_OP = 4;
}

// GIS-only room provisioning. Register this service only on the private listener.
service GameSessionProvisioningService {
  rpc ProvisionGameSessionRoom(ProvisionGameSessionRoomRequest) returns (ProvisionGameSessionRoomResponse);
  rpc CloseGameSessionRoom(CloseGameSessionRoomRequest) returns (CloseGameSessionRoomResponse);
  // @voice.security=protected;callers=service:gameintegration
  rpc ApplyGameSessionRoster(ApplyGameSessionRosterRequest) returns (ApplyGameSessionRosterResponse);
  // @voice.security=protected;callers=service:gameintegration
  rpc FenceSdkConversion(FenceSdkConversionRequest) returns (FenceSdkConversionResponse);
  // @voice.security=protected;callers=service:gameintegration
  rpc CompleteSdkConversionActivation(CompleteSdkConversionActivationRequest) returns (CompleteSdkConversionActivationResponse);
}

// Match-squad operations are served only by the dedicated protected
// MatchSquadVoiceService listener, never by the ordinary VoiceService listener.
service MatchSquadVoiceService {
  // @voice.security=protected;callers=service:matchmaking
  rpc CreateMatchSquadRoom(CreateMatchSquadRoomRequest) returns (CreateMatchSquadRoomResponse);
  // @voice.security=protected;callers=service:matchmaking
  rpc TeardownMatchSquadRoom(TeardownMatchSquadRoomRequest) returns (TeardownMatchSquadRoomResponse);
}

// Voice / LiveKit orchestration. HTTP: /api/v1/voice/**.
// Package voice.calls.v1 avoids path stutter voice/voice/v1; service name matches docs.
service VoiceService {
  rpc StartCall(StartCallRequest) returns (StartCallResponse);
  rpc AcceptCall(AcceptCallRequest) returns (AcceptCallResponse);
  rpc DeclineCall(DeclineCallRequest) returns (DeclineCallResponse);
  rpc JoinCall(JoinCallRequest) returns (JoinCallResponse);
  rpc LeaveCall(LeaveCallRequest) returns (LeaveCallResponse);
  rpc EndCall(EndCallRequest) returns (EndCallResponse);

  rpc JoinVoiceRoom(JoinVoiceRoomRequest) returns (JoinVoiceRoomResponse);
  rpc LeaveVoiceRoom(LeaveVoiceRoomRequest) returns (LeaveVoiceRoomResponse);
  rpc MoveToVoiceRoom(MoveToVoiceRoomRequest) returns (MoveToVoiceRoomResponse);
  rpc MoveVoiceRoomParticipant(MoveVoiceRoomParticipantRequest) returns (MoveVoiceRoomParticipantResponse);

  rpc GetJoinToken(GetJoinTokenRequest) returns (GetJoinTokenResponse);

  rpc UpdateVoiceState(UpdateVoiceStateRequest) returns (UpdateVoiceStateResponse);
  rpc GetVoiceStates(GetVoiceStatesRequest) returns (GetVoiceStatesResponse);
  rpc GetActiveCall(GetActiveCallRequest) returns (GetActiveCallResponse);

  rpc StartScreenShare(StartScreenShareRequest) returns (StartScreenShareResponse);
  rpc StopScreenShare(StopScreenShareRequest) returns (StopScreenShareResponse);

  rpc SetCommanderMode(SetCommanderModeRequest) returns (SetCommanderModeResponse);
  rpc SetBroadcasting(SetBroadcastingRequest) returns (SetBroadcastingResponse);

  rpc RaiseHand(RaiseHandRequest) returns (RaiseHandResponse);
  rpc LowerHand(LowerHandRequest) returns (LowerHandResponse);
  rpc GrantFloor(GrantFloorRequest) returns (GrantFloorResponse);
  rpc RevokeFloor(RevokeFloorRequest) returns (RevokeFloorResponse);

  // @voice.security=protected;callers=service:space
  rpc ApplySpaceLifecycleFence(voice.calls.v1.ApplySpaceLifecycleFenceRequest) returns (voice.calls.v1.ApplySpaceLifecycleFenceResponse);

  // @voice.security=protected;callers=service:space
  rpc PurgeSpace(voice.calls.v1.PurgeSpaceRequest) returns (voice.calls.v1.PurgeSpaceResponse);
}

// Opaque GIS resource identity. Voice never interprets external keys as user or owner IDs.
message GameSessionResourceRef {
  GameSessionResourceKind kind = 1;
  string external_resource_key = 2;
}

// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message ProvisionGameSessionRoomRequest {
  string operation_id = 1;
  string application_id = 2;
  string environment_id = 3;
  GameSessionResourceRef resource = 4;
  string chat_id = 5;
  // Chat create receipt identity is its original operation_id.
  string chat_creation_operation_id = 6;
  // GIS session identity used by Role grants and Voice admission checks.
  string session_id = 7;
}

// Matchmaking owns the participant manifest. UUIDs are canonical lower-case,
// unique, and ordered by UUID bytes; its digest covers concatenated fixed-width
// 16-byte UUID values. Digest fields contain raw SHA-256 bytes.
// operation_id is also the protected principal request-id binding. Hashes
// cover deterministic serialization of the complete typed request.
// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message CreateMatchSquadRoomRequest {
  uint32 protocol_version = 1;
  string operation_id = 2;
  string match_id = 3;
  repeated voice.chat.v1.MatchSquadParticipant participants = 4;
  bytes participant_manifest_sha256 = 5;
  voice.chat.v1.MatchSquadChatReceipt chat_creation_receipt = 6;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message MatchSquadRoomReceipt {
  uint32 protocol_version = 1;
  string receipt_id = 2;
  string operation_id = 3;
  string match_id = 4;
  string room_id = 5;
  string chat_id = 6;
  string chat_creation_receipt_id = 7;
  bytes chat_creation_receipt_sha256 = 8;
  bytes participant_manifest_sha256 = 9;
  bytes request_sha256 = 10;
  google.protobuf.Timestamp created_at = 11;
}

message CreateMatchSquadRoomResponse {
  MatchSquadRoomReceipt receipt = 1;
}

// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message TeardownMatchSquadRoomRequest {
  uint32 protocol_version = 1;
  string teardown_operation_id = 2;
  string match_id = 3;
  string room_id = 4;
  string creation_receipt_id = 5;
  bytes participant_manifest_sha256 = 6;
  bytes creation_request_sha256 = 7;
}

enum MatchSquadTeardownStatus {
  MATCH_SQUAD_TEARDOWN_STATUS_UNSPECIFIED = 0;
  MATCH_SQUAD_TEARDOWN_STATUS_COMPLETED = 1;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message MatchSquadRoomTeardownReceipt {
  uint32 protocol_version = 1;
  string receipt_id = 2;
  string teardown_operation_id = 3;
  string match_id = 4;
  string room_id = 5;
  string creation_receipt_id = 6;
  bytes participant_manifest_sha256 = 7;
  bytes request_sha256 = 8;
  MatchSquadTeardownStatus status = 9;
  google.protobuf.Timestamp completed_at = 10;
}

message TeardownMatchSquadRoomResponse {
  MatchSquadRoomTeardownReceipt receipt = 1;
}

message ProvisionGameSessionRoomResponse {
  string operation_id = 1;
  string application_id = 2;
  string environment_id = 3;
  GameSessionResourceRef resource = 4;
  string chat_id = 5;
  string chat_creation_operation_id = 6;
  string room_id = 7;
  string livekit_room_name = 8;
  string voice_creation_receipt_id = 9;
  bytes request_hash = 10;
  google.protobuf.Timestamp created_at = 11;
  string session_id = 12;
}

// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message CloseGameSessionRoomRequest {
  string operation_id = 1;
  string application_id = 2;
  string environment_id = 3;
  GameSessionResourceRef resource = 4;
  string chat_id = 5;
  // Chat create receipt identity is its original operation_id.
  string chat_creation_operation_id = 6;
  // Must equal the immutable GIS session identity stored at provisioning.
  string session_id = 7;
}

message CloseGameSessionRoomResponse {
  string operation_id = 1;
  string application_id = 2;
  string environment_id = 3;
  GameSessionResourceRef resource = 4;
  string chat_id = 5;
  string chat_creation_operation_id = 6;
  string session_id = 7;
  string room_id = 8;
  string status = 9;
  string close_receipt_id = 10;
  bytes request_hash = 11;
  google.protobuf.Timestamp closing_at = 12;
  google.protobuf.Timestamp media_fenced_at = 13;
  google.protobuf.Timestamp closed_at = 14;
}

// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message ApplyGameSessionRosterRequest {
  string operation_id = 1;
  string application_id = 2;
  string environment_id = 3;
  string session_id = 4;
  string voice_room_id = 5;
  uint64 roster_revision = 6;
  // Complete, sorted profile UUID set. Empty is a valid complete roster.
  repeated string profile_ids = 7;
  // GIS database commit time plus the fixed lease duration.
  google.protobuf.Timestamp lease_expires_at = 8;
}

message ApplyGameSessionRosterResponse {
  string operation_id = 1;
  string application_id = 2;
  string environment_id = 3;
  string session_id = 4;
  string voice_room_id = 5;
  string receipt_id = 6;
  bytes request_hash = 7;
  uint64 accepted_revision = 8;
  google.protobuf.Timestamp lease_expires_at = 9;
}

// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message FenceSdkConversionRequest {
  string operation_id = 1;
  string binding_id = 2;
  string source_account_id = 3;
  string source_actor_id = 4;
  string source_profile_id = 5;
  string target_account_id = 6;
  string target_profile_id = 7;
  uint64 frozen_authority_epoch = 8;
  string freeze_receipt_id = 9;
}

// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message FenceSdkConversionResponse {
  string operation_id = 1;
  string binding_id = 2;
  string source_account_id = 3;
  string source_actor_id = 4;
  string target_account_id = 5;
  string target_profile_id = 6;
  uint64 frozen_authority_epoch = 7;
  string freeze_receipt_id = 8;
  string receipt_id = 9;
  bytes request_hash = 10;
  bool target_session_conflict = 11;
  string source_room_id = 12;
  uint64 media_generation = 13;
  google.protobuf.Timestamp observed_ejection_at = 14;
  google.protobuf.Timestamp committed_at = 15;
  string source_profile_id = 16;
}

// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message CompleteSdkConversionActivationRequest {
  string operation_id = 1;
  string binding_id = 2;
  uint64 frozen_authority_epoch = 3;
  string freeze_receipt_id = 4;
  string voice_receipt_id = 5;
  string activation_receipt_id = 6;
}

// @voice.unknown_fields=reject
// @voice.hash=deterministic_protobuf_sha256
message CompleteSdkConversionActivationResponse {
  string operation_id = 1;
  string binding_id = 2;
  uint64 frozen_authority_epoch = 3;
  string voice_receipt_id = 4;
  string activation_receipt_id = 5;
  string receipt_id = 6;
  bytes request_hash = 7;
  string state = 8;
  google.protobuf.Timestamp committed_at = 9;
}
message StartCallRequest {
  string room_type = 1; // call | group_voice | voice_room; prefer room_type_enum when set
  optional voice.chat.v1.ChatRef linked_chat = 2;
  optional string voice_room_id = 3;
  optional voice.space.v1.SpaceRef space = 4;
  optional VoiceSessionKind room_type_enum = 5;
  optional string callee_profile_id = 6;
  optional CallMediaKind media_kind = 7;
}

message AcceptCallRequest {
  string room_id = 1;
}

message DeclineCallRequest {
  string room_id = 1;
}

message JoinCallRequest {
  string room_id = 1;
}

message LeaveCallRequest {
  string room_id = 1;
}

message EndCallRequest {
  string room_id = 1;
}

message CallSession {
  string room_id = 1;
  string livekit_room_name = 2;
  string room_type = 3; // prefer room_type_enum when set
  optional voice.chat.v1.ChatRef linked_chat = 4;
  optional string voice_room_id = 5;
  google.protobuf.Timestamp started_at = 6;
  optional VoiceSessionKind room_type_enum = 7;
  string initiator_profile_id = 8;
  string callee_profile_id = 9;
  CallMediaKind media_kind = 10;
  CallStatus status = 11;
  google.protobuf.Timestamp expires_at = 12;
  google.protobuf.Timestamp ended_at = 13;
  // Persisted room locator, not a current authorization grant. Absent for legacy/incomplete bindings.
  optional string space_id = 14;
}

message JoinVoiceRoomRequest {
  string voice_room_id = 1;
  voice.space.v1.SpaceRef space = 2;
  string operation_id = 3;
}

message LeaveVoiceRoomRequest {
  string voice_room_id = 1;
  voice.space.v1.SpaceRef space = 2;
  string operation_id = 3;
}

message MoveToVoiceRoomRequest {
  string from_voice_room_id = 1;
  string to_voice_room_id = 2;
  voice.space.v1.SpaceRef space = 3;
  string operation_id = 4;
}

message MoveVoiceRoomParticipantRequest {
  string from_voice_room_id = 1;
  string to_voice_room_id = 2;
  voice.space.v1.SpaceRef space = 3;
  string participant_profile_id = 4;
  string operation_id = 5;
}

message VoiceSession {
  string room_id = 1;
  string livekit_room_name = 2;
  string voice_room_id = 3;
  // Server-resolved Space persisted when joining this voice room.
  optional string space_id = 4;
}

// Immutable terminal history for one actor-bound lifecycle operation. It never
// contains a bearer, credential, reusable permission or grant.
message VoiceRoomLifecycleReceipt {
  string operation_id = 1;
  string actor_profile_id = 2;
  string subject_profile_id = 3;
  voice.space.v1.SpaceRef space = 4;
  VoiceRoomLifecycleMethod method = 5;
  VoiceRoomLifecycleOutcome outcome = 6;
  optional string source_voice_room_id = 7;
  optional string destination_voice_room_id = 8;
  optional string room_id = 9;
  optional uint64 source_roster_version = 10;
  optional uint64 destination_roster_version = 11;
  optional string media_epoch = 12;
  optional uint64 space_access_epoch = 13;
  optional uint64 role_policy_epoch = 14;
  optional bytes authorization_digest = 15;
}

message GetJoinTokenRequest {
  string room_id = 1;
}

message UpdateVoiceStateRequest {
  string room_id = 1;
  optional bool is_muted = 2;
  optional bool is_deafened = 3;
  optional bool is_video_on = 4;
}

message GetVoiceStatesRequest {
  string room_id = 1;
  optional string voice_room_id = 2;
}

message VoiceParticipantState {
  string profile_id = 1;
  bool is_muted = 2;
  bool is_deafened = 3;
  bool is_video_on = 4;
  bool is_screen_sharing = 5;
  bool is_commander = 6;
  bool hand_raised = 7;
  // Organizer granted speak floor (raise-hand / raid-school mode).
  bool has_floor = 8;
  // Commander is holding "start broadcast" — clients duck other tracks.
  bool is_broadcasting = 9;
}

message GetActiveCallRequest {}

message StartScreenShareRequest {
  string room_id = 1;
}

message ScreenShareSession {
  string stream_id = 1;
}

message StopScreenShareRequest {
  string room_id = 1;
  optional string stream_id = 2;
}

message SetCommanderModeRequest {
  string room_id = 1;
  bool enabled = 2;
}

message SetBroadcastingRequest {
  string room_id = 1;
  bool enabled = 2;
}

message RaiseHandRequest {
  string room_id = 1;
}

message LowerHandRequest {
  string room_id = 1;
}

message GrantFloorRequest {
  string room_id = 1;
  string profile_id = 2;
}

message RevokeFloorRequest {
  string room_id = 1;
  string profile_id = 2;
}

message StartCallResponse {
  CallSession call_session = 1;
}
message AcceptCallResponse {
  CallSession call_session = 1;
}
message DeclineCallResponse {
  CallSession call_session = 1;
}
message JoinCallResponse {
  CallSession call_session = 1;
}
message LeaveCallResponse {}
message EndCallResponse {}
message JoinVoiceRoomResponse {
  VoiceSession voice_session = 1;
  VoiceRoomLifecycleReceipt receipt = 2;
}
message LeaveVoiceRoomResponse {
  VoiceRoomLifecycleReceipt receipt = 1;
}
message MoveToVoiceRoomResponse {
  VoiceSession voice_session = 1;
  VoiceRoomLifecycleReceipt receipt = 2;
}
message MoveVoiceRoomParticipantResponse {
  VoiceRoomLifecycleReceipt receipt = 1;
}

// JWT and wall-clock expiry (UTC). Public API uses google.protobuf.Timestamp per docs/REPOSITORIES.md.
message GetJoinTokenResponse {
  string jwt = 1;
  google.protobuf.Timestamp expires_at = 2;
  // WebSocket URL for LiveKit SDK connect (public ingress; not the internal service URL).
  string livekit_url = 3;
  string media_epoch = 4;
  uint64 space_access_epoch = 5;
  uint64 role_policy_epoch = 6;
  bytes authorization_digest = 7;
}
message UpdateVoiceStateResponse {}
message GetVoiceStatesResponse {
  repeated VoiceParticipantState participants = 1;
}
message GetActiveCallResponse {
  CallSession call_session = 1;
}
message StartScreenShareResponse {
  ScreenShareSession screen_share_session = 1;
}
message StopScreenShareResponse {}
message SetCommanderModeResponse {}
message SetBroadcastingResponse {}
message RaiseHandResponse {}
message LowerHandResponse {}
message GrantFloorResponse {}
message RevokeFloorResponse {}

// @voice.unknown_fields=reject
// @voice.hash=domain_separated_sha256
message ApplySpaceLifecycleFenceRequest {
  voice.common.v1.SpaceLifecycleFenceRequest fence = 1;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message ApplySpaceLifecycleFenceResponse {
  voice.common.v1.SpaceLifecycleFenceReceipt receipt = 1;
}

// @voice.unknown_fields=reject
// @voice.hash=domain_separated_sha256
message PurgeSpaceRequest {
  voice.common.v1.SpacePurgeRequest purge = 1;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message PurgeSpaceResponse {
  voice.common.v1.SpacePurgeReceipt receipt = 1;
}
