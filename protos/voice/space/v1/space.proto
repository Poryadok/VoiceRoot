  optional voice.chat.v1.ChatRef linked_chat = 5;
  optional string voice_room_id = 6;
  int32 sort_order = 7;
  bool is_system = 8;
  optional string display_name = 9; // enriched from Chat for text_chat nodes
  bool is_pinned = 10;
  optional int32 pin_order = 11;
