syntax = "proto3";

package voice.space.v1;

import "google/protobuf/timestamp.proto";
import "voice/chat/v1/chat.proto";
import "voice/common/v1/common.proto";
import "voice/common/v1/space_lifecycle.proto";
import "voice/file/v1/file.proto";
import "voice/role/v1/role.proto";
import "voice/space/v1/member_admission.proto";

option go_package = "voice.app/voice/space/v1;spacev1";

// Spaces, tree, invites. HTTP: /api/v1/spaces/**.
service SpaceService {
  // Narrow native membership authority; own DB only, no Role callback.
  // @voice.security=protected;callers=service:role
  rpc GetMemberAdmissionAuthority(GetMemberAdmissionAuthorityRequest) returns (GetMemberAdmissionAuthorityResponse);
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
  rpc UpdateSpace(UpdateSpaceRequest) returns (UpdateSpaceResponse);
  // Space-level matchmaking settings (mm_config jsonb; roadmap П.1).
  rpc UpdateSpaceMmConfig(UpdateSpaceMmConfigRequest) returns (UpdateSpaceMmConfigResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  rpc GetSpace(GetSpaceRequest) returns (GetSpaceResponse);
  // Narrow existence/lifecycle read. No ACL lookup or public Gateway route.
  // @voice.security=protected;callers=service:role
  rpc ValidateRoleOverrideTarget(ValidateRoleOverrideTargetRequest) returns (ValidateRoleOverrideTargetResponse);
  rpc ListMySpaces(ListMySpacesRequest) returns (ListMySpacesResponse);
  rpc SearchPublicSpaces(SearchPublicSpacesRequest) returns (SearchPublicSpacesResponse);

  rpc CreateVoiceRoom(CreateVoiceRoomRequest) returns (CreateVoiceRoomResponse);
  rpc UpdateVoiceRoom(UpdateVoiceRoomRequest) returns (UpdateVoiceRoomResponse);
  rpc DeleteVoiceRoom(DeleteVoiceRoomRequest) returns (DeleteVoiceRoomResponse);
  rpc UpsertTreeNode(UpsertTreeNodeRequest) returns (UpsertTreeNodeResponse);
  rpc RemoveTreeNode(RemoveTreeNodeRequest) returns (RemoveTreeNodeResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc ReorderSpaceTree(ReorderSpaceTreeRequest) returns (ReorderSpaceTreeResponse);
  rpc PinTreeNode(PinTreeNodeRequest) returns (PinTreeNodeResponse);
  rpc UnpinTreeNode(UnpinTreeNodeRequest) returns (UnpinTreeNodeResponse);
  rpc ListSpaceTree(ListSpaceTreeRequest) returns (ListSpaceTreeResponse);

  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc JoinByInvite(JoinByInviteRequest) returns (JoinByInviteResponse);

  rpc JoinSpace(JoinSpaceRequest) returns (JoinSpaceResponse);
  // Exact authenticated applicant; no ambient proof or latest-attempt lookup.
  // @voice.security=public_gateway;callers=service:gateway
  rpc StartJoinAttempt(StartJoinAttemptRequest) returns (StartJoinAttemptResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc GetJoinAttempt(GetJoinAttemptRequest) returns (GetJoinAttemptResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc SubmitJoinAttempt(SubmitJoinAttemptRequest) returns (SubmitJoinAttemptResponse);
  // Current member plus SPACE_APPROVE_JOIN_REQUESTS; not invite/settings ACL.
  // @voice.security=public_gateway;callers=service:gateway
  rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc GetJoinRequest(GetJoinRequestRequest) returns (GetJoinRequestResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc ApproveJoinRequest(ApproveJoinRequestRequest) returns (ApproveJoinRequestResponse);
  // Exact protected settings operation. The response is a saved safe acknowledgement.
  rpc SetEntryPolicy(SetEntryPolicyRequest) returns (SetEntryPolicyResponse);
  rpc LeaveSpace(LeaveSpaceRequest) returns (LeaveSpaceResponse);
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse);
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse);
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // BE-234-nickname-v1: verified actor, global MEMBER_MANAGE_NICKNAMES;
  // local members only, Owner protected, serialized redacted audit/outbox.
  // @voice.security=public_gateway;callers=service:gateway
  rpc UpdateMemberNickname(UpdateMemberNicknameRequest) returns (UpdateMemberNicknameResponse);
  rpc ListBans(ListBansRequest) returns (ListBansResponse);
  rpc TimeoutMember(TimeoutMemberRequest) returns (TimeoutMemberResponse);
  rpc RemoveMemberTimeout(RemoveMemberTimeoutRequest) returns (RemoveMemberTimeoutResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);

  // S2S: Bot Service adds bot actor profile to space membership on install.
  rpc AddBotMember(AddBotMemberRequest) returns (AddBotMemberResponse);
  rpc RemoveBotMember(RemoveBotMemberRequest) returns (RemoveBotMemberResponse);

  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CreateFromTemplate(CreateFromTemplateRequest) returns (CreateFromTemplateResponse);

  // GIS-only versioned complete roster projection. Membership remains source-scoped and expires fail-closed.
  // @voice.security=protected;callers=service:gameintegration
  rpc ApplyCommunityRoster(ApplyCommunityRosterRequest) returns (ApplyCommunityRosterResponse);

  // GIS-only idempotent community bootstrap. Owner identity is asserted by the authenticated GIS workload.
  // @voice.security=protected;callers=service:gameintegration
  rpc CreateCommunityBootstrap(CreateCommunityBootstrapRequest) returns (CreateCommunityBootstrapResponse);

  // GIS-only durable Owner succession after a distinct operator approval.
  // @voice.security=protected;callers=service:gameintegration
  rpc RecoverCommunityOwner(RecoverCommunityOwnerRequest) returns (RecoverCommunityOwnerResponse);

  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse);

  // @voice.security=protected;callers=service:role,service:chat
  rpc AppendAuditEvent(AppendAuditEventRequest) returns (AppendAuditEventResponse);

  // Chat-owned durable create intent; not an ordinary user tree mutation.
  // @voice.security=protected;callers=service:chat
  rpc CommitSpaceChatCreation(CommitSpaceChatCreationRequest) returns (CommitSpaceChatCreationResponse);
  // Exact immutable create outcome; caller authentication does not replace disclosure ACLs.
  // Gateway uses a verified delegated-user principal and current disclosure ACL.
  // @voice.security=protected;callers=service:chat,service:gateway
  rpc GetSpaceChatCreationOutcome(GetSpaceChatCreationOutcomeRequest) returns (GetSpaceChatCreationOutcomeResponse);

  // S2S: privacy audience "space members" — shared membership between two profiles.
  rpc AreCoMembers(AreCoMembersRequest) returns (AreCoMembersResponse);

  // S2S: canonical owner and exact membership evidence for Voice authorization.
  // This endpoint is restricted to the verified Voice service identity.
  // @voice.security=protected;callers=service:voice
  rpc ResolveVoiceRoomAccess(ResolveVoiceRoomAccessRequest) returns (ResolveVoiceRoomAccessResponse);

  // Fresh profile/Space timeout authority; no public or legacy transport.
  // @voice.security=protected;callers=service:messaging
  rpc ResolveMemberCommunicationState(ResolveMemberCommunicationStateRequest) returns (ResolveMemberCommunicationStateResponse);

  // S2S: Subscription Service syncs Space Pro entitlement cache after webhook.
  rpc SyncSpaceProSubscription(SyncSpaceProSubscriptionRequest) returns (SyncSpaceProSubscriptionResponse);

  // @voice.security=public_gateway;callers=service:gateway
  rpc RestoreSpace(voice.space.v1.RestoreSpaceRequest) returns (voice.space.v1.RestoreSpaceResponse);

  // @voice.security=public_gateway;callers=service:gateway
  // @voice.activation=held
  // @voice.authorization=current_owner
  rpc GetSpaceDeletionCoordinatorStatus(voice.space.v1.GetSpaceDeletionCoordinatorStatusRequest) returns (voice.space.v1.GetSpaceDeletionCoordinatorStatusResponse);
  // Global Bot deletion only: exact native cancellation plus target-owned
  // permanent Bot Add fence. Ordinary uninstall uses RemoveBotMember.
  // @voice.security=protected;callers=service:bot
  rpc ApplyBotInstallationRemoval(ApplyBotInstallationRemovalRequest) returns (ApplyBotInstallationRemovalResponse);
  // Relay only the exact accepted producer-owned Role/Messaging P3 evidence.
  // @voice.security=protected;callers=service:bot
  rpc GetBotPurgeHandoff(GetBotPurgeHandoffRequest) returns (GetBotPurgeHandoffResponse);
  // Minimal all-Add fence from Bot's committed verified-owner global root.
  // @voice.security=protected;callers=service:bot
  rpc RegisterBotGlobalTerminal(RegisterBotGlobalTerminalRequest) returns (RegisterBotGlobalTerminalResponse);
  // Exact own irreversible P3 decision authorizes this native-only drain.
  rpc ReconcileBotPurgeInstallation(ReconcileBotPurgeInstallationRequest) returns (ReconcileBotPurgeInstallationResponse);
}

// @voice.unknown_fields=reject
message GetBotPurgeHandoffRequest {
  uint32 protocol_version = 1;
  string request_id = 2;
  string space_id = 3;
  string deletion_operation_id = 4;
  uint64 generation = 5;
  voice.common.v1.ManifestBinding manifest = 6;
}

message BotPurgeRoleHandoff {
  voice.role.v1.RetireSpaceReceipt original_receipt = 1;
  bytes original_request_bytes = 2;
  bytes original_request_sha256 = 3;
  bytes original_receipt_bytes = 4;
  bytes original_receipt_sha256 = 5;
}

message BotPurgeMessagingHandoff {
  voice.common.v1.SpacePurgeReceipt original_receipt = 1;
  bytes original_request_bytes = 2;
  bytes original_request_sha256 = 3;
  bytes original_receipt_bytes = 4;
  bytes original_receipt_sha256 = 5;
}

message GetBotPurgeHandoffResponse {
  uint32 protocol_version = 1;
  string request_id = 2;
  string space_id = 3;
  string deletion_operation_id = 4;
  uint64 generation = 5;
  voice.common.v1.ManifestBinding manifest = 6;
  voice.space.v1.BotPurgeRoleHandoff role = 7;
  voice.space.v1.BotPurgeMessagingHandoff messaging = 8;
}

message Space {
  string id = 1;
  string name = 2;
  string description = 3;
  optional string icon_url = 4;
  optional string banner_url = 5;
  string visibility = 6;
  string owner_profile_id = 7;
  int32 member_count = 8;
  bool is_verified = 9;
  string verification_type = 10;
  string entry_requirement = 11;
  string entry_questions_json = 12;
  string mm_config_json = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  optional google.protobuf.Timestamp deletion_scheduled_at = 16;
  optional google.protobuf.Timestamp purge_after = 17;
  // Guest admission is explicit and defaults to false.
  bool allow_guests = 18;
}

message CreateSpaceRequest {
  string name = 1;
  string description = 2;
  string visibility = 3;
}

message UpdateSpaceRequest {
  string space_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string icon_url = 4;
  optional string banner_url = 5;
  optional string visibility = 6;
  optional string entry_requirement = 7;
  optional string entry_questions_json = 8;
  optional string mm_config_json = 9;
  optional bool allow_guests = 10;
}

message UpdateSpaceMmConfigRequest {
