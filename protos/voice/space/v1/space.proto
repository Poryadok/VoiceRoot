message ApplyBotInstallationRemovalRequest {
  uint32 protocol_version = 1;
  string operation_id = 2; // stable child operation; exact signed request_id
  string decision_id = 3;
  bytes decision_sha256 = 4;
  string purpose = 5; // global_delete only
  string bot_id = 6;
  string actor_profile_id = 7;
  string space_id = 8;
  // Preserve the original generation-scoped cancellation operation verbatim.
  // Its operation may differ from the enclosing global child operation.
  RemoveBotMemberRequest native_cancellation = 9;
  reserved 10 to 12; // no invented legacy/orphan provenance
  bytes frozen_scope_sha256 = 13;
}

message BotInstallationRemovalReceipt {
  uint32 protocol_version = 1;
  string receipt_id = 2;
  string operation_id = 3;
  string decision_id = 4;
  string purpose = 5;
  string bot_id = 6;
  string actor_profile_id = 7;
  string space_id = 8;
  string evidence_kind = 9; // native
  bytes evidence_sha256 = 10; // SHA256(deterministic full native_cancellation)
  bytes frozen_scope_sha256 = 11;
  bytes request_sha256 = 12; // SHA256(deterministic full enclosing request)
  string participant = 13; // space
  string outcome = 14; // COMPLETED only after exact cancel and global Add fence
  google.protobuf.Timestamp completed_at = 15;
  bool global_native_adds_fenced = 16; // true; includes new generation/new Space
}

message ApplyBotInstallationRemovalResponse {
  BotInstallationRemovalReceipt receipt = 1;
}

