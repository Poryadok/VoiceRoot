syntax = "proto3";

package voice.space.v1;

import "google/protobuf/timestamp.proto";
import "voice/chat/v1/chat.proto";
import "voice/common/v1/common.proto";
import "voice/common/v1/space_lifecycle.proto";
import "voice/file/v1/file.proto";

option go_package = "voice.app/voice/space/v1;spacev1";

// Spaces, tree, invites. HTTP: /api/v1/spaces/**.
service SpaceService {
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
  rpc UpdateSpace(UpdateSpaceRequest) returns (UpdateSpaceResponse);
  // Space-level matchmaking settings (mm_config jsonb; roadmap П.1).
  rpc UpdateSpaceMmConfig(UpdateSpaceMmConfigRequest) returns (UpdateSpaceMmConfigResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  rpc GetSpace(GetSpaceRequest) returns (GetSpaceResponse);
  rpc ListMySpaces(ListMySpacesRequest) returns (ListMySpacesResponse);
  rpc SearchPublicSpaces(SearchPublicSpacesRequest) returns (SearchPublicSpacesResponse);

  rpc CreateVoiceRoom(CreateVoiceRoomRequest) returns (CreateVoiceRoomResponse);
  rpc UpdateVoiceRoom(UpdateVoiceRoomRequest) returns (UpdateVoiceRoomResponse);
  rpc DeleteVoiceRoom(DeleteVoiceRoomRequest) returns (DeleteVoiceRoomResponse);
  rpc UpsertTreeNode(UpsertTreeNodeRequest) returns (UpsertTreeNodeResponse);
  rpc RemoveTreeNode(RemoveTreeNodeRequest) returns (RemoveTreeNodeResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc ReorderSpaceTree(ReorderSpaceTreeRequest) returns (ReorderSpaceTreeResponse);
  rpc PinTreeNode(PinTreeNodeRequest) returns (PinTreeNodeResponse);
  rpc UnpinTreeNode(UnpinTreeNodeRequest) returns (UnpinTreeNodeResponse);
  rpc ListSpaceTree(ListSpaceTreeRequest) returns (ListSpaceTreeResponse);

  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc JoinByInvite(JoinByInviteRequest) returns (JoinByInviteResponse);

  rpc JoinSpace(JoinSpaceRequest) returns (JoinSpaceResponse);
  rpc LeaveSpace(LeaveSpaceRequest) returns (LeaveSpaceResponse);
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse);
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse);
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc ListBans(ListBansRequest) returns (ListBansResponse);
  rpc TimeoutMember(TimeoutMemberRequest) returns (TimeoutMemberResponse);
  rpc RemoveMemberTimeout(RemoveMemberTimeoutRequest) returns (RemoveMemberTimeoutResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);

  // S2S: Bot Service adds bot actor profile to space membership on install.
  rpc AddBotMember(AddBotMemberRequest) returns (AddBotMemberResponse);
  rpc RemoveBotMember(RemoveBotMemberRequest) returns (RemoveBotMemberResponse);

  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CreateFromTemplate(CreateFromTemplateRequest) returns (CreateFromTemplateResponse);

  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse);

  // S2S: privacy audience "space members" — shared membership between two profiles.
  rpc AreCoMembers(AreCoMembersRequest) returns (AreCoMembersResponse);

  // S2S: canonical owner and exact membership evidence for Voice authorization.
  // This endpoint is restricted to the verified Voice service identity.
  rpc ResolveVoiceRoomAccess(ResolveVoiceRoomAccessRequest) returns (ResolveVoiceRoomAccessResponse);

  // S2S: Subscription Service syncs Space Pro entitlement cache after webhook.
  rpc SyncSpaceProSubscription(SyncSpaceProSubscriptionRequest) returns (SyncSpaceProSubscriptionResponse);

  // @voice.security=public_gateway;callers=service:gateway
  rpc RestoreSpace(voice.space.v1.RestoreSpaceRequest) returns (voice.space.v1.RestoreSpaceResponse);

  // @voice.security=public_gateway;callers=service:gateway
  // @voice.activation=held
  // @voice.authorization=current_owner
  rpc GetSpaceDeletionCoordinatorStatus(voice.space.v1.GetSpaceDeletionCoordinatorStatusRequest) returns (voice.space.v1.GetSpaceDeletionCoordinatorStatusResponse);
}

message Space {
  string id = 1;
  string name = 2;
  string description = 3;
  optional string icon_url = 4;
  optional string banner_url = 5;
  string visibility = 6;
  string owner_profile_id = 7;
  int32 member_count = 8;
  bool is_verified = 9;
  string verification_type = 10;
  string entry_requirement = 11;
  string entry_questions_json = 12;
  string mm_config_json = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  optional google.protobuf.Timestamp deletion_scheduled_at = 16;
  optional google.protobuf.Timestamp purge_after = 17;
}

message CreateSpaceRequest {
  string name = 1;
  string description = 2;
  string visibility = 3;
}

message UpdateSpaceRequest {
  string space_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string icon_url = 4;
  optional string banner_url = 5;
  optional string visibility = 6;
  optional string entry_requirement = 7;
  optional string entry_questions_json = 8;
  optional string mm_config_json = 9;
}

message UpdateSpaceMmConfigRequest {
  string space_id = 1;
  string mm_config_json = 2;
}

message UpdateSpaceMmConfigResponse {
  Space space = 1;
}

// @voice.unknown_fields=reject
message DeleteSpaceRequest {
  string space_id = 1;
  string confirmation_name = 2;
  string proof = 3;
  string operation_id = 4;
}

message GetSpaceRequest {
  string space_id = 1;
}

message ListMySpacesRequest {
  voice.common.v1.CursorPageRequest page = 1;
}

message SpaceList {
  repeated Space spaces = 1;
  string next_cursor = 2;
}

message SearchPublicSpacesRequest {
  string query = 1;
  voice.common.v1.CursorPageRequest page = 2;
}

message VoiceRoom {
  string id = 1;
  string space_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
}

message CreateVoiceRoomRequest {
  string space_id = 1;
  string name = 2;
}

message UpdateVoiceRoomRequest {
  string voice_room_id = 1;
  optional string name = 2;
}

message DeleteVoiceRoomRequest {
  string voice_room_id = 1;
}

message SpaceTreeNode {
  string id = 1;
  string space_id = 2;
  optional string category_id = 3;
  string kind = 4; // text_chat | voice_room
  optional voice.chat.v1.ChatRef linked_chat = 5;
  optional string voice_room_id = 6;
  int32 sort_order = 7;
  bool is_system = 8;
  optional string display_name = 9; // enriched from Chat for text_chat nodes
  bool is_pinned = 10;
  optional int32 pin_order = 11;
}

message PinTreeNodeRequest {
  string space_id = 1;
  string node_id = 2;
}

message UnpinTreeNodeRequest {
  string space_id = 1;
  string node_id = 2;
}

message UpsertTreeNodeRequest {
  string space_id = 1;
  optional string node_id = 2;
  optional string category_id = 3;
  string kind = 4;
  optional voice.chat.v1.ChatRef linked_chat = 5;
  optional string voice_room_id = 6;
  optional int32 sort_order = 7;
  optional bool is_system = 8;
}

message RemoveTreeNodeRequest {
  string space_id = 1;
  string node_id = 2;
}

message Category {
  string id = 1;
  string space_id = 2;
  string name = 3;
  int32 sort_order = 4;
}

message CreateCategoryRequest {
  string space_id = 1;
  string name = 2;
  int32 sort_order = 3;
}

message UpdateCategoryRequest {
  string category_id = 1;
  optional string name = 2;
  optional int32 sort_order = 3;
}

message DeleteCategoryRequest {
  string category_id = 1;
}

message ReorderSpaceTreeRequest {
  string space_id = 1;
  repeated string ordered_node_ids = 2;
}

message ListSpaceTreeRequest {
  string space_id = 1;
}

message Invite {
  string id = 1;
  string space_id = 2;
  string code = 3;
  string creator_profile_id = 4;
  optional int32 max_uses = 5;
  int32 use_count = 6;
  optional google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp revoked_at = 9;
}

message CreateInviteRequest {
  string space_id = 1;
  optional int32 max_uses = 2;
  optional google.protobuf.Timestamp expires_at = 3;
}

message RevokeInviteRequest {
  string invite_id = 1;
}

message GetInviteRequest {
  string code = 1;
}

message ListInvitesRequest {
  string space_id = 1;
}

message InviteList {
  repeated Invite invites = 1;
}

message JoinByInviteRequest {
  string code = 1;
}

message SpaceMembership {
  string space_id = 1;
  string profile_id = 2;
  google.protobuf.Timestamp joined_at = 3;
  optional string nickname = 4;
  repeated string role_names = 5;
}

message JoinSpaceRequest {
  string space_id = 1;
}

message LeaveSpaceRequest {
  string space_id = 1;
}

message KickMemberRequest {
  string space_id = 1;
  string profile_id = 2;
}

message BanMemberRequest {
  string space_id = 1;
  string account_id = 2;
  optional string reason = 3;
  optional string profile_id = 4;
}

message UnbanMemberRequest {
  string space_id = 1;
  string account_id = 2;
}

message ListMembersRequest {
  string space_id = 1;
  voice.common.v1.CursorPageRequest page = 2;
}

message SpaceMemberList {
  repeated SpaceMembership members = 1;
  string next_cursor = 2;
}

message ListBansRequest {
  string space_id = 1;
}

message BanList {
  repeated SpaceBan bans = 1;
}

message SpaceBan {
  string space_id = 1;
  string account_id = 2;
  string banned_by_profile_id = 3;
  optional string reason = 4;
  google.protobuf.Timestamp banned_at = 5;
}

message TimeoutMemberRequest {
  string space_id = 1;
  string profile_id = 2;
  int32 duration_seconds = 3;
  optional string reason = 4;
}

message RemoveMemberTimeoutRequest {
  string space_id = 1;
  string profile_id = 2;
}

message TransferOwnershipRequest {
  string space_id = 1;
  string new_owner_profile_id = 2;
}

message AddBotMemberRequest {
  string space_id = 1;
  string profile_id = 2;
}

message RemoveBotMemberRequest {
  string space_id = 1;
  string profile_id = 2;
}

message ListTemplatesRequest {}

message TemplateList {
  repeated SpaceTemplate templates = 1;
}

message SpaceTemplate {
  string id = 1;
  string name = 2;
  string description = 3;
}

message CreateFromTemplateRequest {
  string template_id = 1;
  string name = 2;
}

message GetAuditLogRequest {
  string space_id = 1;
  voice.common.v1.CursorPageRequest page = 2;
}

message AuditLogList {
  repeated AuditLogEntry entries = 1;
  string next_cursor = 2;
}

message AuditLogEntry {
  string id = 1;
  string space_id = 2;
  string actor_profile_id = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  string details_json = 7;
  google.protobuf.Timestamp created_at = 8;
}

// Logical reference to space_db.spaces for other services (cf. ChatRef).
message SpaceRef {
  string id = 1;
}

message CreateSpaceResponse {
  Space space = 1;
}
message UpdateSpaceResponse {
  Space space = 1;
}

// @voice.unknown_fields=accept_preserve
message DeleteSpaceResponse {}
message GetSpaceResponse {
  Space space = 1;
}
message ListMySpacesResponse {
  SpaceList space_list = 1;
}
message SearchPublicSpacesResponse {
  SpaceList space_list = 1;
}
message CreateVoiceRoomResponse {
  VoiceRoom voice_room = 1;
}
message UpdateVoiceRoomResponse {
  VoiceRoom voice_room = 1;
}
message DeleteVoiceRoomResponse {}
message UpsertTreeNodeResponse {
  SpaceTreeNode space_tree_node = 1;
}
message RemoveTreeNodeResponse {}
message CreateCategoryResponse {
  Category category = 1;
}
message UpdateCategoryResponse {
  Category category = 1;
}
message DeleteCategoryResponse {}
message ReorderSpaceTreeResponse {}
message PinTreeNodeResponse {
  SpaceTreeNode space_tree_node = 1;
}
message UnpinTreeNodeResponse {
  SpaceTreeNode space_tree_node = 1;
}
message ListSpaceTreeResponse {
  repeated Category categories = 1;
  repeated SpaceTreeNode nodes = 2;
  repeated VoiceRoom voice_rooms = 3;
}
message CreateInviteResponse {
  Invite invite = 1;
}
message RevokeInviteResponse {}
message GetInviteResponse {
  Invite invite = 1;
}
message ListInvitesResponse {
  InviteList invite_list = 1;
}
message JoinByInviteResponse {
  SpaceMembership space_membership = 1;
}
message JoinSpaceResponse {
  SpaceMembership space_membership = 1;
}
message LeaveSpaceResponse {}
message KickMemberResponse {}
message BanMemberResponse {}
message UnbanMemberResponse {}
message ListMembersResponse {
  SpaceMemberList space_member_list = 1;
}
message ListBansResponse {
  BanList ban_list = 1;
}
message TimeoutMemberResponse {}
message RemoveMemberTimeoutResponse {}
message TransferOwnershipResponse {}
message AddBotMemberResponse {}
message RemoveBotMemberResponse {}
message ListTemplatesResponse {
  TemplateList template_list = 1;
}
message CreateFromTemplateResponse {
  Space space = 1;
}
message GetAuditLogResponse {
  AuditLogList audit_log_list = 1;
}

message AreCoMembersRequest {
  string profile_id_a = 1;
  string profile_id_b = 2;
  repeated string space_ids = 3; // optional filter; empty = any shared space
}

message AreCoMembersResponse {
  bool co_members = 1;
}

// ResolveVoiceRoomAccessRequest is intentionally independent of caller-forwarded
// identity metadata: Voice supplies the subject and asserted path explicitly.
message ResolveVoiceRoomAccessRequest {
  string voice_room_id = 1;
  string profile_id = 2;
  SpaceRef space = 3;
}

// ResolveVoiceRoomAccessResponse gives Voice canonical room ownership and the
// current exact membership evidence from one Space-owned epoch. Only a
// discoverable current member receives a response. Existing but undiscoverable,
// absent, deleted/inactive and foreign-path rooms all return the same NOT_FOUND.
// In the current hard-delete model a room is active exactly while its row exists.
message ResolveVoiceRoomAccessResponse {
  string space_id = 1;
  bool member = 2;
  bool active = 3;
  bool discoverable = 4;
  uint64 access_epoch = 5;
}

message SyncSpaceProSubscriptionRequest {
  string space_id = 1;
  string purchaser_account_id = 2;
  string status = 3; // active | grace_period | cancelled
}

message SyncSpaceProSubscriptionResponse {}

enum SpaceDeletionPhase {
  SPACE_DELETION_PHASE_UNSPECIFIED = 0;
  SPACE_DELETION_PHASE_LIVE = 1;
  SPACE_DELETION_PHASE_SCHEDULE_PENDING = 2;
  SPACE_DELETION_PHASE_FREEZE_PENDING = 3;
  SPACE_DELETION_PHASE_SCHEDULED = 4;
  SPACE_DELETION_PHASE_RESTORE_DECIDED = 5;
  SPACE_DELETION_PHASE_PURGE_DECIDED = 6;
  SPACE_DELETION_PHASE_PURGING = 7;
  SPACE_DELETION_PHASE_PURGED = 8;
}

enum ParticipantOperationState {
  PARTICIPANT_OPERATION_STATE_UNSPECIFIED = 0;
  PARTICIPANT_OPERATION_STATE_NOT_STARTED = 1;
  PARTICIPANT_OPERATION_STATE_IN_FLIGHT = 2;
  PARTICIPANT_OPERATION_STATE_COMPLETE = 3;
  PARTICIPANT_OPERATION_STATE_RETRYABLE_FAILURE = 4;
  PARTICIPANT_OPERATION_STATE_CONTRACT_MISMATCH = 5;
}

// @voice.unknown_fields=reject
message RestoreSpaceRequest {
  string space_id = 1;
  string operation_id = 2;
}

// @voice.unknown_fields=accept_preserve
message RestoreSpaceResponse {
  voice.space.v1.Space space = 1;
}

// @voice.unknown_fields=reject
// @voice.hash=domain_separated_sha256
message SpaceDeletionManifestSet {
  uint32 protocol_version = 1;
  string space_id = 2;
  string deletion_operation_id = 3;
  uint64 schedule_generation = 4;
  voice.common.v1.ManifestBinding chat_manifest = 5;
  repeated voice.file.v1.FileReferenceProducerDeclaration file_producers = 6;
  bytes root_sha256 = 7;
}

// @voice.unknown_fields=accept_preserve
message ParticipantCoordinatorStatus {
  voice.common.v1.ParticipantId participant_id = 1;
  voice.space.v1.ParticipantOperationState state = 2;
  bytes request_sha256 = 3;
  bytes receipt_sha256 = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// @voice.unknown_fields=accept_preserve
message SpaceDeletionCoordinatorStatus {
  uint32 protocol_version = 1;
  string space_id = 2;
  string deletion_operation_id = 3;
  optional uint64 generation = 4;
  voice.space.v1.SpaceDeletionPhase phase = 5;
  voice.common.v1.ManifestBinding manifest = 6;
  repeated voice.space.v1.ParticipantCoordinatorStatus participants = 7;
  optional google.protobuf.Timestamp scheduled_at = 8;
  optional google.protobuf.Timestamp purge_after = 9;
  optional google.protobuf.Timestamp purged_at = 10;
}

// @voice.unknown_fields=reject
message GetSpaceDeletionCoordinatorStatusRequest {
  uint32 protocol_version = 1;
  string space_id = 2;
  string deletion_operation_id = 3;
}

// @voice.unknown_fields=accept_preserve
message GetSpaceDeletionCoordinatorStatusResponse {
  voice.space.v1.SpaceDeletionCoordinatorStatus status = 1;
}
