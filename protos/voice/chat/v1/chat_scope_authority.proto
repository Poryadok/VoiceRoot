syntax = "proto3";

package voice.chat.v1;

import "voice/chat/v1/chat.proto";

option go_package = "voice.app/voice/chat/v1;chatv1";

// Narrow own-DB resource facts. This service grants no user permissions and is
// served only on dedicated signed per-caller mTLS listeners.
service ChatScopeAuthorityService {
  rpc GetSpaceChatScopeAuthority(GetSpaceChatScopeAuthorityRequest) returns (GetSpaceChatScopeAuthorityResponse);
  // Messaging only. Saved binding observation grants no viewer permission.
  rpc ReadSpaceReportAttachment(ReadSpaceReportAttachmentRequest) returns (ReadSpaceReportAttachmentResponse);
}

message GetSpaceChatScopeAuthorityRequest {
  uint32 protocol_version = 1;
  string chat_id = 2;
  string expected_space_id = 3;
  // Fresh transport request identity; retries use fresh signed JWT/JTI.
  string operation_id = 4;
}

message GetSpaceChatScopeAuthorityResponse {
  uint32 protocol_version = 1;
  string chat_id = 2;
  string expected_space_id = 3;
  string operation_id = 4;
  bool exists = 5;
  bool live = 6;
  ChatType chat_type = 7;
  string actual_space_id = 8;
  string chat_scope_incarnation = 9;
  uint64 chat_authority_revision = 10;
  // Independent Chat-owned lifecycle fence, never a membership/Role epoch.
  uint64 lifecycle_generation = 11;
  ChatScopeLifecycleState lifecycle_state = 12;
  ChatScopeManagedKind managed_kind = 13;
  // Separate native Space attachment epoch. Type/creator changes do not retire it.
  uint64 report_attachment_generation = 14;
}

message ReadSpaceReportAttachmentRequest {
  uint32 protocol_version = 1;
  string operation_id = 2;
  string chat_id = 3;
  string expected_space_id = 4;
  uint64 saved_attachment_generation = 5;
}

message ReadSpaceReportAttachmentResponse {
  uint32 protocol_version = 1;
  string operation_id = 2;
  string chat_id = 3;
  string expected_space_id = 4;
  uint64 saved_attachment_generation = 5;
  SpaceReportAttachmentDisposition disposition = 6;
  // Present only for RETIRED. Never contains the destination Space or a viewer.
  SpaceReportAttachmentRetirementReason reason = 7;
  string owner_event_id = 8;
  uint64 owner_revision = 9;
}

enum SpaceReportAttachmentDisposition {
  SPACE_REPORT_ATTACHMENT_DISPOSITION_UNSPECIFIED = 0;
  SPACE_REPORT_ATTACHMENT_DISPOSITION_UNKNOWN = 1;
  SPACE_REPORT_ATTACHMENT_DISPOSITION_UNCHANGED = 2;
  SPACE_REPORT_ATTACHMENT_DISPOSITION_RETIRED = 3;
}

enum SpaceReportAttachmentRetirementReason {
  SPACE_REPORT_ATTACHMENT_RETIREMENT_REASON_UNSPECIFIED = 0;
  SPACE_REPORT_ATTACHMENT_RETIREMENT_REASON_TARGET_DELETED = 1;
  SPACE_REPORT_ATTACHMENT_RETIREMENT_REASON_TARGET_MOVED = 2;
}

enum ChatScopeManagedKind {
  CHAT_SCOPE_MANAGED_KIND_UNSPECIFIED = 0;
  CHAT_SCOPE_MANAGED_KIND_ORDINARY = 1;
  CHAT_SCOPE_MANAGED_KIND_GAME_INTEGRATION = 2;
  CHAT_SCOPE_MANAGED_KIND_MATCH_SQUAD = 3;
}

enum ChatScopeLifecycleState {
  CHAT_SCOPE_LIFECYCLE_STATE_UNSPECIFIED = 0;
  CHAT_SCOPE_LIFECYCLE_STATE_LIVE = 1;
  CHAT_SCOPE_LIFECYCLE_STATE_FROZEN = 2;
  CHAT_SCOPE_LIFECYCLE_STATE_PURGE_DECIDED = 3;
  CHAT_SCOPE_LIFECYCLE_STATE_PURGED = 4;
}
