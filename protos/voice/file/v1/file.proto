syntax = "proto3";

package voice.file.v1;

import "google/protobuf/timestamp.proto";
import "voice/chat/v1/chat.proto";
import "voice/common/v1/common.proto";
import "voice/common/v1/space_lifecycle.proto";
import "voice/story/v1/story.proto";

option go_package = "voice.app/voice/file/v1;filev1";

// Canonical values for FileMetadata.status (string). See microservices/file-service.md for lifecycle.
enum FileLifecycleStatus {
  FILE_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  FILE_LIFECYCLE_STATUS_PENDING_UPLOAD = 1;
  FILE_LIFECYCLE_STATUS_PROCESSING = 2;
  FILE_LIFECYCLE_STATUS_READY = 3;
  FILE_LIFECYCLE_STATUS_FAILED = 4;
  FILE_LIFECYCLE_STATUS_DELETED = 5;
  FILE_LIFECYCLE_STATUS_EXPIRED = 6;
}

// Canonical values for FileMetadata.file_type (string).
enum FileMediaCategory {
  FILE_MEDIA_CATEGORY_UNSPECIFIED = 0;
  FILE_MEDIA_CATEGORY_IMAGE = 1;
  FILE_MEDIA_CATEGORY_VIDEO = 2;
  FILE_MEDIA_CATEGORY_AUDIO = 3;
  FILE_MEDIA_CATEGORY_DOCUMENT = 4;
  FILE_MEDIA_CATEGORY_OTHER = 5;
}

// Canonical values for FileMetadata.scan_result (string).
enum FileScanOutcome {
  FILE_SCAN_OUTCOME_UNSPECIFIED = 0;
  FILE_SCAN_OUTCOME_PENDING = 1;
  FILE_SCAN_OUTCOME_CLEAN = 2;
  FILE_SCAN_OUTCOME_INFECTED = 3;
  FILE_SCAN_OUTCOME_ERROR = 4;
  FILE_SCAN_OUTCOME_SKIPPED = 5;
}

// Uploads, R2, scanning. HTTP: /api/v1/files/**.
service FileService {
  rpc RequestUpload(RequestUploadRequest) returns (RequestUploadResponse);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc GetFileURL(GetFileURLRequest) returns (GetFileURLResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse);
  // @voice.security=public_gateway;callers=service:gateway
  rpc GetBulkMetadata(GetBulkMetadataRequest) returns (GetBulkMetadataResponse);

  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  rpc CheckQuota(CheckQuotaRequest) returns (CheckQuotaResponse);

  // @voice.security=protected;callers=service:messaging,service:chat,service:story,service:user
  rpc IssueFileAccessCapability(voice.file.v1.IssueFileAccessCapabilityRequest) returns (voice.file.v1.IssueFileAccessCapabilityResponse);

  // @voice.security=protected;callers=service:space
  rpc PrepareSpaceDeletionReferenceManifest(voice.file.v1.PrepareSpaceDeletionReferenceManifestRequest) returns (voice.file.v1.PrepareSpaceDeletionReferenceManifestResponse);

  // @voice.security=protected;callers=service:space,service:chat,service:messaging
  rpc RegisterSpaceDeletionReferenceChunk(voice.file.v1.RegisterSpaceDeletionReferenceChunkRequest) returns (voice.file.v1.RegisterSpaceDeletionReferenceChunkResponse);

  // @voice.security=protected;callers=service:space,service:chat,service:messaging
  rpc ReleaseSpaceDeletionProducerReferences(voice.file.v1.ReleaseSpaceDeletionProducerReferencesRequest) returns (voice.file.v1.ReleaseSpaceDeletionProducerReferencesResponse);

  // @voice.security=protected;callers=service:space
  rpc ApplySpaceLifecycleFence(voice.file.v1.ApplySpaceLifecycleFenceRequest) returns (voice.file.v1.ApplySpaceLifecycleFenceResponse);

  // @voice.security=protected;callers=service:space
  rpc PurgeSpace(voice.file.v1.PurgeSpaceRequest) returns (voice.file.v1.PurgeSpaceResponse);

  // @voice.security=protected;callers=service:space,service:chat,service:messaging
  rpc AcquireFileReferences(voice.file.v1.AcquireFileReferencesRequest) returns (voice.file.v1.AcquireFileReferencesResponse);

  // @voice.security=protected;callers=service:space,service:chat,service:messaging
  rpc ReleaseFileReferences(voice.file.v1.ReleaseFileReferencesRequest) returns (voice.file.v1.ReleaseFileReferencesResponse);

  // @voice.security=protected;callers=service:space
  rpc GetSpacePurgeReceipt(voice.file.v1.GetSpacePurgeReceiptRequest) returns (voice.file.v1.GetSpacePurgeReceiptResponse);
}

message RequestUploadRequest {
  string original_name = 1;
  string mime_type = 2;
  int64 size_bytes = 3;
  optional voice.chat.v1.ChatRef context_chat = 4;
  reserved 5;
  reserved "chat_type";
  optional bool is_e2e = 6;
  optional voice.story.v1.StoryRef context_story = 7;
}

message UploadResponse {
  string file_id = 1;
  string presigned_put_url = 2;
  string r2_key = 3;
}

message ConfirmUploadRequest {
  string file_id = 1;
  string sha256_hash = 2;
}

message FileMetadata {
  string id = 1;
  string uploader_profile_id = 2;
  string original_name = 3;
  string mime_type = 4;
  int64 size_bytes = 5;
  string sha256_hash = 6;
  string r2_key = 7;
  string status = 8;
  string file_type = 9;
  optional int32 width = 10;
  optional int32 height = 11;
  optional int32 duration_seconds = 12;
  optional string thumbnail_r2_key = 13;
  optional string converted_r2_key = 14;
  optional voice.chat.v1.ChatRef chat = 15;
  reserved 16;
  reserved "chat_type";
  bool is_e2e = 17;
  optional google.protobuf.Timestamp expires_at = 18;
  string scan_result = 19;
  google.protobuf.Timestamp created_at = 20;
  optional FileLifecycleStatus status_enum = 21;
  optional FileMediaCategory file_type_enum = 22;
  optional FileScanOutcome scan_result_enum = 23;
}

// @voice.unknown_fields=reject
message GetFileURLRequest {
  string file_id = 1;
  voice.file.v1.FileAccessSelector access = 2;
}

// @voice.unknown_fields=reject
message GetFileMetadataRequest {
  string file_id = 1;
  voice.file.v1.FileAccessSelector access = 2;
}

// @voice.unknown_fields=reject
message GetBulkMetadataRequest {
  repeated string file_ids = 1 [deprecated = true];
  repeated voice.file.v1.FileAccessItem items = 2;
}

message BulkFileMetadata {
  map<string, FileMetadata> by_file_id = 1;
}

message DeleteFileRequest {
  string file_id = 1;
}

message ListFilesRequest {
  optional voice.chat.v1.ChatRef filter_chat = 1;
  voice.common.v1.CursorPageRequest page = 2;
}

message FileList {
  repeated FileMetadata files = 1;
  string next_cursor = 2;
  optional voice.common.v1.CursorPageResponse page = 3;
}

message CheckQuotaRequest {
  string profile_id = 1;
}

message QuotaResponse {
  int64 bytes_used = 1;
  int64 bytes_limit = 2;
}

message RequestUploadResponse {
  UploadResponse upload_response = 1;
}
message ConfirmUploadResponse {
  FileMetadata file_metadata = 1;
}
message GetFileURLResponse {
  string presigned_get_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}
message GetFileMetadataResponse {
  FileMetadata file_metadata = 1;
}
message GetBulkMetadataResponse {
  BulkFileMetadata bulk_file_metadata = 1;
}
message DeleteFileResponse {}
message ListFilesResponse {
  FileList file_list = 1;
}
message CheckQuotaResponse {
  QuotaResponse quota_response = 1;
}

enum FileReferenceOwnerType {
  FILE_REFERENCE_OWNER_TYPE_UNSPECIFIED = 0;
  FILE_REFERENCE_OWNER_TYPE_MESSAGE = 1;
  FILE_REFERENCE_OWNER_TYPE_STORY = 2;
  FILE_REFERENCE_OWNER_TYPE_PROFILE_AVATAR = 3;
  FILE_REFERENCE_OWNER_TYPE_CHAT_AVATAR = 4;
  FILE_REFERENCE_OWNER_TYPE_SPACE_AVATAR = 5;
  FILE_REFERENCE_OWNER_TYPE_STICKER = 6;
  FILE_REFERENCE_OWNER_TYPE_GIF_ASSET = 7;
  FILE_REFERENCE_OWNER_TYPE_UPLOAD_SESSION = 8;
}

enum FileReadSurface {
  FILE_READ_SURFACE_UNSPECIFIED = 0;
  FILE_READ_SURFACE_URL = 1;
  FILE_READ_SURFACE_METADATA = 2;
}

enum FileReferenceProducerId {
  FILE_REFERENCE_PRODUCER_ID_UNSPECIFIED = 0;
  FILE_REFERENCE_PRODUCER_ID_SPACE = 1;
  FILE_REFERENCE_PRODUCER_ID_CHAT = 2;
  FILE_REFERENCE_PRODUCER_ID_MESSAGING = 3;
}

// @voice.unknown_fields=reject
// @voice.hash=domain_separated_sha256
message FileReferenceProducerDeclaration {
  voice.file.v1.FileReferenceProducerId producer_id = 1;
  uint64 expected_total_count = 2;
  bytes expected_references_sha256 = 3;
}

// @voice.unknown_fields=reject
// @voice.hash=domain_separated_sha256
message FileReferenceKey {
  string file_id = 1;
  voice.file.v1.FileReferenceOwnerType owner_type = 2;
  string owner_id = 3;
  optional string subresource_id = 4;
  optional string scope_space_id = 5;
}

// @voice.unknown_fields=reject
message FileAccessSelector {
  oneof selector {
    voice.file.v1.FileReferenceKey reference = 1;
    string capability_id = 2;
  }
}

// @voice.unknown_fields=reject
message FileAccessItem {
  string file_id = 1;
  voice.file.v1.FileAccessSelector access = 2;
}

// @voice.unknown_fields=reject
// @voice.hash=domain_separated_sha256
message IssueFileAccessCapabilityRequest {
  uint32 protocol_version = 1;
  string operation_id = 2;
  voice.file.v1.FileReferenceKey reference = 3;
  string subject_profile_id = 4;
  repeated voice.file.v1.FileReadSurface allowed_surfaces = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message IssueFileAccessCapabilityResponse {
  voice.file.v1.IssueFileAccessCapabilityReceipt receipt = 1;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message IssueFileAccessCapabilityReceipt {
  uint32 protocol_version = 1;
  string receipt_id = 2;
  string operation_id = 3;
  string capability_id = 4;
  voice.file.v1.FileReferenceKey reference = 5;
  string subject_profile_id = 6;
  repeated voice.file.v1.FileReadSurface allowed_surfaces = 7;
  google.protobuf.Timestamp expires_at = 8;
  bytes request_sha256 = 9;
  google.protobuf.Timestamp completed_at = 10;
}

// @voice.unknown_fields=reject
// @voice.hash=domain_separated_sha256
message PrepareSpaceDeletionReferenceManifestRequest {
  uint32 protocol_version = 1;
  string space_id = 2;
  string deletion_operation_id = 3;
  uint64 schedule_generation = 4;
  voice.common.v1.ManifestBinding chat_manifest = 5;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message PrepareSpaceDeletionReferenceManifestReceipt {
  uint32 protocol_version = 1;
  string receipt_id = 2;
  string space_id = 3;
  string deletion_operation_id = 4;
  uint64 schedule_generation = 5;
  voice.common.v1.LifecycleFenceState applied_state = 6;
  bytes request_sha256 = 7;
  google.protobuf.Timestamp applied_at = 8;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message PrepareSpaceDeletionReferenceManifestResponse {
  voice.file.v1.PrepareSpaceDeletionReferenceManifestReceipt receipt = 1;
