// @voice.unknown_fields=reject
// @voice.hash=domain_separated_sha256
message RegisterSpaceDeletionReferenceChunkRequest {
  uint32 protocol_version = 1;
  voice.file.v1.FileReferenceProducerId producer_id = 2;
  string operation_id = 3;
  string deletion_operation_id = 4;
  string space_id = 5;
  uint64 schedule_generation = 6;
  uint64 chunk_index = 7;
  repeated voice.file.v1.FileReferenceKey references = 8;
  uint64 expected_total_count = 9;
  bytes expected_references_sha256 = 10;
  bool seals_producer = 11;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message RegisterSpaceDeletionReferenceChunkReceipt {
  uint32 protocol_version = 1;
  string receipt_id = 2;
  string operation_id = 3;
  string deletion_operation_id = 4;
  string space_id = 5;
  uint64 schedule_generation = 6;
  uint64 chunk_index = 7;
  uint64 accepted_count = 8;
  voice.file.v1.FileReferenceProducerId producer_id = 9;
  uint64 expected_total_count = 10;
  bytes expected_references_sha256 = 11;
  bool producer_sealed = 12;
  bytes request_sha256 = 13;
  google.protobuf.Timestamp completed_at = 14;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
