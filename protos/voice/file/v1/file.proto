  uint64 purge_generation = 5;
  uint64 source_schedule_generation = 6;
  voice.file.v1.FileReferenceProducerId producer_id = 7;
  uint64 released_count = 8;
  bytes expected_references_sha256 = 9;
  bytes request_sha256 = 10;
  google.protobuf.Timestamp completed_at = 11;
}

// @voice.unknown_fields=accept_preserve
// @voice.hash=domain_separated_sha256
message ReleaseSpaceDeletionProducerReferencesResponse {
