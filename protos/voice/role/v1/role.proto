syntax = "proto3";

package voice.role.v1;

import "google/protobuf/timestamp.proto";
import "voice/chat/v1/chat.proto";

option go_package = "voice.app/voice/role/v1;rolev1";

// Roles and permission bitmask in space. HTTP: /api/v1/roles/**.
// Permission names: docs/microservices/role-service.md (SCREAMING_SNAKE_CASE).
service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc ReorderRoles(ReorderRolesRequest) returns (ReorderRolesResponse);

  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc GetMemberRoles(GetMemberRolesRequest) returns (GetMemberRolesResponse);

  rpc SetChatOverride(SetChatOverrideRequest) returns (SetChatOverrideResponse);
  rpc RemoveChatOverride(RemoveChatOverrideRequest) returns (RemoveChatOverrideResponse);
  rpc GetChatOverrides(GetChatOverridesRequest) returns (GetChatOverridesResponse);
  rpc SetVoiceRoomOverride(SetVoiceRoomOverrideRequest) returns (SetVoiceRoomOverrideResponse);
  rpc RemoveVoiceRoomOverride(RemoveVoiceRoomOverrideRequest) returns (RemoveVoiceRoomOverrideResponse);
  rpc GetVoiceRoomOverrides(GetVoiceRoomOverridesRequest) returns (GetVoiceRoomOverridesResponse);

  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetEffectivePermissions(GetEffectivePermissionsRequest) returns (GetEffectivePermissionsResponse);
  // Trusted Voice-only decision. Role owns the explicit grants and policy epoch.
  rpc ResolveVoiceRoomGrants(ResolveVoiceRoomGrantsRequest) returns (ResolveVoiceRoomGrantsResponse);

  rpc SetDefaultJoinRole(SetDefaultJoinRoleRequest) returns (SetDefaultJoinRoleResponse);
  rpc GetDefaultJoinRole(GetDefaultJoinRoleRequest) returns (GetDefaultJoinRoleResponse);

  // Called by Space Service after CreateSpace — seeds system roles and assigns Owner.
  rpc BootstrapSpaceRoles(BootstrapSpaceRolesRequest) returns (BootstrapSpaceRolesResponse);

  // BOT-B: remove custom roles created by a profile (e.g. bot actor on uninstall).
  rpc DeleteRolesCreatedByProfile(DeleteRolesCreatedByProfileRequest) returns (DeleteRolesCreatedByProfileResponse);

  // Trusted Space-only lifecycle operations. These are the sole Owner mutation path.
  // Staged v2 contract: runtime activation requires the durable journal/freeze cutover.
  // Trusted Space-only methods; never reinterpret the legacy Apply/Compensate pair.
  rpc GetOwnershipTransferCapabilities(GetOwnershipTransferCapabilitiesRequest) returns (GetOwnershipTransferCapabilitiesResponse);
  rpc PrepareOwnershipTransfer(PrepareOwnershipTransferRequest) returns (PrepareOwnershipTransferResponse);
  rpc FinalizeOwnershipTransfer(FinalizeOwnershipTransferRequest) returns (FinalizeOwnershipTransferResponse);
  rpc AbortOwnershipTransfer(AbortOwnershipTransferRequest) returns (AbortOwnershipTransferResponse);
  rpc ApplyOwnershipTransfer(ApplyOwnershipTransferRequest) returns (ApplyOwnershipTransferResponse);
  rpc CompensateOwnershipTransfer(CompensateOwnershipTransferRequest) returns (CompensateOwnershipTransferResponse);
}

message BootstrapSpaceRolesRequest {
  string space_id = 1;
  string owner_profile_id = 2;
}

message BootstrapSpaceRolesResponse {}

message DeleteRolesCreatedByProfileRequest {
  string space_id = 1;
  string created_by_profile_id = 2;
}

message DeleteRolesCreatedByProfileResponse {}

message ApplyOwnershipTransferRequest {
  string space_id = 1;
  string old_owner_profile_id = 2;
  string new_owner_profile_id = 3;
  string operation_id = 4;
}

message CompensateOwnershipTransferRequest {
  string space_id = 1;
  string old_owner_profile_id = 2;
  string new_owner_profile_id = 3;
  string operation_id = 4;
}

message ApplyOwnershipTransferResponse {
  string current_owner_profile_id = 1;
}

message CompensateOwnershipTransferResponse {
  string current_owner_profile_id = 1;
}

// Immutable cross-action identity. Missing intent and protocol_version other than 2
// are rejected before mutation. UUIDs retain the original old/new ordering.
// The ledger hashes and retains the deterministic encoding, INCLUDING unknown
// intent fields; receipts echo that exact intent rather than reconstructing IDs.
// Space separately binds account/session/proof data in its durable journal.
message OwnershipTransferIntent {
  uint32 protocol_version = 1;
  string space_id = 2;
  string old_owner_profile_id = 3;
  string new_owner_profile_id = 4;
  string operation_id = 5;
}

// Successful receipts never use UNSPECIFIED. Prepared freezes scoped authority.
enum OwnershipTransferState {
  OWNERSHIP_TRANSFER_STATE_UNSPECIFIED = 0;
  OWNERSHIP_TRANSFER_STATE_PREPARED = 1;
  OWNERSHIP_TRANSFER_STATE_FINALIZED = 2;
  OWNERSHIP_TRANSFER_STATE_ABORTED = 3;
}

message OwnershipTransferReceipt {
  OwnershipTransferIntent intent = 1;
  OwnershipTransferState state = 2;
  // Empty while prepared; new owner when finalized; old owner when aborted.
  string current_owner_profile_id = 3;
}

message GetOwnershipTransferCapabilitiesRequest {}

// An authenticated protocol 2 and all three exact full transition RPC paths are
// required before journal reservation. Missing/incompatible capability denies;
// no network-error or old-server fallback to v1 is permitted. Schema availability
// alone does not advertise support or activate the production ownership flow.
message GetOwnershipTransferCapabilitiesResponse {
  uint32 protocol_version = 1;
  repeated string supported_methods = 2;
}

// Each action retains its first accepted full deterministic request hash,
// INCLUDING unknown wrapper fields, separately from the shared intent hash.
// JWT request_hash binds the full request; its rpc claim binds the exact action.
// Changed intent or same-action request conflicts with ALREADY_EXISTS.
message PrepareOwnershipTransferRequest {
  OwnershipTransferIntent intent = 1;
}

message PrepareOwnershipTransferResponse {
  // Only PREPARED; terminal operations cannot be prepared again.
  OwnershipTransferReceipt receipt = 1;
}

// Same immutable intent and per-action full request binding rules as Prepare.
// Only a durable Space commit decision may issue Finalize; absent/aborted denies.
message FinalizeOwnershipTransferRequest {
  OwnershipTransferIntent intent = 1;
}

message FinalizeOwnershipTransferResponse {
  // Only FINALIZED, including identical terminal retries.
  OwnershipTransferReceipt receipt = 1;
}

// Same immutable intent and per-action full request binding rules as Prepare.
// Only a durable Space abort decision may issue Abort; absent Abort fences delayed
// Prepare after sole-old-owner validation. A finalized operation cannot abort.
message AbortOwnershipTransferRequest {
  OwnershipTransferIntent intent = 1;
}

message AbortOwnershipTransferResponse {
  // Only ABORTED, including identical terminal retries.
  OwnershipTransferReceipt receipt = 1;
}

message Role {
  string id = 1;
  string space_id = 2;
  string name = 3;
  uint64 permissions_mask = 4;
  int32 position = 5;
  bool managed = 6;
  google.protobuf.Timestamp created_at = 7;
  optional string created_by_profile_id = 8;
}

message CreateRoleRequest {
  string space_id = 1;
  string name = 2;
  uint64 permissions_mask = 3;
  int32 position = 4;
}

message UpdateRoleRequest {
  string role_id = 1;
  optional string name = 2;
  optional uint64 permissions_mask = 3;
  optional int32 position = 4;
}

message DeleteRoleRequest {
  string role_id = 1;
}

message ListRolesRequest {
  string space_id = 1;
}

message RoleList {
  repeated Role roles = 1;
}

message ReorderRolesRequest {
  string space_id = 1;
  repeated string ordered_role_ids = 2;
}

message AssignRoleRequest {
  string space_id = 1;
  string profile_id = 2;
  string role_id = 3;
}

message RevokeRoleRequest {
  string space_id = 1;
  string profile_id = 2;
  string role_id = 3;
}

message GetMemberRolesRequest {
  string space_id = 1;
  string profile_id = 2;
}

message SetChatOverrideRequest {
  string space_id = 1;
  voice.chat.v1.ChatRef chat = 2;
  uint64 deny_mask = 3;
  uint64 allow_mask = 4;
  string role_id = 5;
}

message RemoveChatOverrideRequest {
  string space_id = 1;
  voice.chat.v1.ChatRef chat = 2;
  string role_id = 3;
}

message GetChatOverridesRequest {
  string space_id = 1;
  optional voice.chat.v1.ChatRef filter_chat = 2;
}

message SetVoiceRoomOverrideRequest {
  string space_id = 1;
  string voice_room_id = 2;
  uint64 deny_mask = 3;
  uint64 allow_mask = 4;
  string role_id = 5;
}

message RemoveVoiceRoomOverrideRequest {
  string space_id = 1;
  string voice_room_id = 2;
  string role_id = 3;
}

message GetVoiceRoomOverridesRequest {
  string space_id = 1;
  optional string voice_room_id = 2;
}

message OverrideList {
  repeated PermissionOverride overrides = 1;
}

message PermissionOverride {
  optional voice.chat.v1.ChatRef chat = 1;
  optional string voice_room_id = 2;
  uint64 deny_mask = 3;
  uint64 allow_mask = 4;
  string role_id = 5;
  string role_name = 6;
}

message SetDefaultJoinRoleRequest {
  string space_id = 1;
  string role_id = 2;
}

message GetDefaultJoinRoleRequest {
  string space_id = 1;
}

message CheckPermissionRequest {
  string space_id = 1;
  string profile_id = 2;
  string permission_name = 3;
  optional voice.chat.v1.ChatRef chat = 4;
  optional string voice_room_id = 5;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message ResolveVoiceRoomGrantsRequest {
  string space_id = 1;
  string voice_room_id = 2;
  string profile_id = 3;
}

message VoiceRoomGrants {
  bool can_join = 1;
  bool can_publish_audio = 2;
  bool can_publish_video = 3;
  bool can_publish_screen_share = 4;
  // Subscription uses the same canonical VOICE_JOIN decision as can_join.
  bool can_subscribe = 5;
  bool can_mute_others = 6;
  bool can_deafen_others = 7;
  bool can_move_others = 8;
  bool can_use_ptt = 9;
  bool priority_speaker = 10;
}

message ResolveVoiceRoomGrantsResponse {
  VoiceRoomGrants grants = 1;
  uint64 policy_epoch = 2;
}

message GetEffectivePermissionsRequest {
  string space_id = 1;
  string profile_id = 2;
  optional voice.chat.v1.ChatRef chat = 3;
  optional string voice_room_id = 4;
}

message PermissionSet {
  uint64 effective_mask = 1;
  repeated string permission_names = 2; // denormalized names for debugging/UI
}

message CreateRoleResponse {
  Role role = 1;
}
message UpdateRoleResponse {
  Role role = 1;
}
message DeleteRoleResponse {}
message ListRolesResponse {
  RoleList role_list = 1;
}
message ReorderRolesResponse {}
message AssignRoleResponse {}
message RevokeRoleResponse {}
message GetMemberRolesResponse {
  RoleList role_list = 1;
}
message SetChatOverrideResponse {}
message RemoveChatOverrideResponse {}
message GetChatOverridesResponse {
  OverrideList override_list = 1;
}
message SetVoiceRoomOverrideResponse {}
message RemoveVoiceRoomOverrideResponse {}
message GetVoiceRoomOverridesResponse {
  OverrideList override_list = 1;
}
message GetEffectivePermissionsResponse {
  PermissionSet permission_set = 1;
}
message SetDefaultJoinRoleResponse {}
message GetDefaultJoinRoleResponse {
  Role role = 1;
}
