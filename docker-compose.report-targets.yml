# Opt-in LOCAL/CI only; layer after docker-compose.yml + docker-compose.phase0.yml.
# Keeps the existing Phase0 Gateway signer and uses its HTTPS JWKS proxy.
services:
  user:
    user: "0:0"
    environment:
      USER_REPORT_TARGETS_GRPC_LISTEN: ":9097"
      USER_REPORT_TARGETS_TLS_CERT_FILE: "/run/report-targets/user.crt"
      USER_REPORT_TARGETS_TLS_KEY_FILE: "/run/report-targets/user.key"
      USER_REPORT_TARGETS_CLIENT_CA_FILE: "/run/report-targets/ca.crt"
      USER_REPORT_TARGETS_MODERATION_JWKS_URL: "https://voice-moderation-authority:8443/internal/principals/jwks"
      USER_REPORT_TARGETS_JWKS_CA_FILE: "/run/report-targets/ca.crt"
      USER_REPORT_TARGETS_JWKS_CLIENT_CERT_FILE: "/run/report-targets/user-jwks-client.crt"
      USER_REPORT_TARGETS_JWKS_CLIENT_KEY_FILE: "/run/report-targets/user-jwks-client.key"
      USER_REPORT_TARGETS_REPLAY_REDIS_ADDR: "redis:6379"
    volumes:
      - ${REPORT_TARGETS_FIXTURE_DIR:?generate a local report targets fixture first}:/run/report-targets:ro
  messaging:
    user: "0:0"
    environment:
      MESSAGING_REPORT_TARGETS_GRPC_LISTEN: ":9097"
      MESSAGING_REPORT_TARGETS_TLS_CERT_FILE: "/run/report-targets/messaging.crt"
      MESSAGING_REPORT_TARGETS_TLS_KEY_FILE: "/run/report-targets/messaging.key"
      MESSAGING_REPORT_TARGETS_CLIENT_CA_FILE: "/run/report-targets/ca.crt"
      MESSAGING_REPORT_TARGETS_MODERATION_JWKS_URL: "https://voice-moderation-authority:8443/internal/principals/jwks"
      MESSAGING_REPORT_TARGETS_JWKS_CA_FILE: "/run/report-targets/ca.crt"
      MESSAGING_REPORT_TARGETS_JWKS_CLIENT_CERT_FILE: "/run/report-targets/messaging-jwks-client.crt"
      MESSAGING_REPORT_TARGETS_JWKS_CLIENT_KEY_FILE: "/run/report-targets/messaging-jwks-client.key"
      MESSAGING_REPORT_TARGETS_REPLAY_REDIS_ADDR: "redis:6379"
    volumes:
      - ${REPORT_TARGETS_FIXTURE_DIR:?generate a local report targets fixture first}:/run/report-targets:ro
  space:
    user: "0:0"
    environment:
      SPACE_REPORT_TARGETS_GRPC_LISTEN: ":9097"
      SPACE_REPORT_TARGETS_TLS_CERT_FILE: "/run/report-targets/space.crt"
      SPACE_REPORT_TARGETS_TLS_KEY_FILE: "/run/report-targets/space.key"
      SPACE_REPORT_TARGETS_CLIENT_CA_FILE: "/run/report-targets/ca.crt"
      SPACE_REPORT_TARGETS_MODERATION_JWKS_URL: "https://voice-moderation-authority:8443/internal/principals/jwks"
      SPACE_REPORT_TARGETS_JWKS_CA_FILE: "/run/report-targets/ca.crt"
      SPACE_REPORT_TARGETS_JWKS_CLIENT_CERT_FILE: "/run/report-targets/space-jwks-client.crt"
      SPACE_REPORT_TARGETS_JWKS_CLIENT_KEY_FILE: "/run/report-targets/space-jwks-client.key"
      SPACE_REPORT_TARGETS_REPLAY_REDIS_ADDR: "redis:6379"
    volumes:
      - ${REPORT_TARGETS_FIXTURE_DIR:?generate a local report targets fixture first}:/run/report-targets:ro
  story:
    user: "0:0"
    environment:
      STORY_REPORT_TARGETS_GRPC_LISTEN: ":9097"
      STORY_REPORT_TARGETS_TLS_CERT_FILE: "/run/report-targets/story.crt"
      STORY_REPORT_TARGETS_TLS_KEY_FILE: "/run/report-targets/story.key"
      STORY_REPORT_TARGETS_CLIENT_CA_FILE: "/run/report-targets/ca.crt"
      STORY_REPORT_TARGETS_MODERATION_JWKS_URL: "https://voice-moderation-authority:8443/internal/principals/jwks"
      STORY_REPORT_TARGETS_JWKS_CA_FILE: "/run/report-targets/ca.crt"
      STORY_REPORT_TARGETS_JWKS_CLIENT_CERT_FILE: "/run/report-targets/story-jwks-client.crt"
      STORY_REPORT_TARGETS_JWKS_CLIENT_KEY_FILE: "/run/report-targets/story-jwks-client.key"
      STORY_REPORT_TARGETS_REPLAY_REDIS_ADDR: "redis:6379"
    volumes:
      - ${REPORT_TARGETS_FIXTURE_DIR:?generate a local report targets fixture first}:/run/report-targets:ro
  moderation:
    networks:
      default:
        aliases: [voice-moderation-authority]
    user: "0:0"
    environment:
      MODERATION_PRINCIPAL_SIGNING_KEYS_DIR: "/run/report-targets/moderation"
      MODERATION_PRINCIPAL_ACTIVE_KID: "current"
      MODERATION_PRINCIPAL_JWKS_LISTEN: ":8443"
      MODERATION_PRINCIPAL_TLS_CERT_FILE: "/run/report-targets/moderation.crt"
      MODERATION_PRINCIPAL_TLS_KEY_FILE: "/run/report-targets/moderation.key"
      MODERATION_PRINCIPAL_CLIENT_CA_FILE: "/run/report-targets/ca.crt"
      MODERATION_REPORT_TARGETS_TLS_CA_FILE: "/run/report-targets/ca.crt"
      MODERATION_REPORT_TARGETS_CLIENT_CERT_FILE: "/run/report-targets/moderation-client.crt"
      MODERATION_REPORT_TARGETS_CLIENT_KEY_FILE: "/run/report-targets/moderation-client.key"
      MODERATION_REPORT_TARGETS_USER_GRPC_ADDR: "user:9097"
      MODERATION_REPORT_TARGETS_USER_TLS_SERVER_NAME: "user"
      MODERATION_REPORT_TARGETS_MESSAGING_GRPC_ADDR: "messaging:9097"
      MODERATION_REPORT_TARGETS_MESSAGING_TLS_SERVER_NAME: "messaging"
      MODERATION_REPORT_TARGETS_SPACE_GRPC_ADDR: "space:9097"
      MODERATION_REPORT_TARGETS_SPACE_TLS_SERVER_NAME: "space"
      MODERATION_REPORT_TARGETS_STORY_GRPC_ADDR: "story:9097"
      MODERATION_REPORT_TARGETS_STORY_TLS_SERVER_NAME: "story"
      MODERATION_INTAKE_GRPC_LISTEN: ":9098"
      MODERATION_INTAKE_TLS_CERT_FILE: "/run/report-targets/moderation.crt"
      MODERATION_INTAKE_TLS_KEY_FILE: "/run/report-targets/moderation.key"
      MODERATION_INTAKE_CLIENT_CA_FILE: "/run/report-targets/ca.crt"
      MODERATION_INTAKE_GATEWAY_JWKS_URL: "https://phase0-jwks:8443/gateway/jwks.json"
      MODERATION_INTAKE_GATEWAY_JWKS_CA_FILE: "/run/phase0-report/ca.crt"
      MODERATION_INTAKE_REPLAY_REDIS_ADDR: "redis:6379"
      MODERATION_INTAKE_EPOCH_REDIS_ADDR: "redis:6379"
    volumes:
      - ${REPORT_TARGETS_FIXTURE_DIR:?generate a local report targets fixture first}:/run/report-targets:ro
      - ${PHASE0_FIXTURE_DIR:?generate Phase0 fixture first}/ca/ca.crt:/run/phase0-report/ca.crt:ro
  gateway:
    environment:
      GATEWAY_MODERATION_INTAKE_GRPC_ADDR: "moderation:9098"
      GATEWAY_MODERATION_INTAKE_TLS_CA_FILE: "/run/report-targets/ca.crt"
      GATEWAY_MODERATION_INTAKE_TLS_SERVER_NAME: "moderation"
      GATEWAY_MODERATION_INTAKE_CLIENT_CERT_FILE: "/run/report-targets/gateway-intake-client.crt"
      GATEWAY_MODERATION_INTAKE_CLIENT_KEY_FILE: "/run/report-targets/gateway-intake-client.key"
    volumes:
      - ${REPORT_TARGETS_FIXTURE_DIR:?generate a local report targets fixture first}:/run/report-targets:ro
